<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Map - Final Fix</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Reset chuẩn để không bị vỡ layout */
        body, html { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
        
        #map { 
            width: 100vw; 
            height: 100vh; 
            background: #0b0e11; 
        }

        /* Giao diện phẳng, đơn giản */
        .info-box {
            position: absolute; top: 15px; left: 50px; z-index: 1000;
            background: white; padding: 10px; border: 1px solid #000;
            font-family: sans-serif; min-width: 180px;
        }
        .menu-right {
            position: absolute; right: 15px; top: 15px; z-index: 1000;
            display: flex; flex-direction: column; border: 1px solid #000;
        }
        .menu-item {
            background: white; border: 0.5px solid #eee; padding: 8px 12px;
            font-size: 12px; cursor: pointer; text-align: center;
        }
        .menu-item.active { background: #000; color: white; }

        /* Icon tâm bão đơn giản */
        .storm-dot {
            width: 10px; height: 10px; background: red;
            border-radius: 50%; border: 2px solid white;
        }
    </style>
</head>
<body>

    <div class="info-box">
        <div style="font-weight: bold; border-bottom: 1px solid #000; margin-bottom: 5px;">DỮ LIỆU BẢN ĐỒ</div>
        <div style="font-size: 12px;">Vùng: Eldria Continent</div>
        <div style="font-size: 12px; color: red;">● Cảnh báo bão</div>
    </div>

    <div class="menu-right">
        <div class="menu-item active">BẢN ĐỒ</div>
        <div class="menu-item">GIÓ</div>
        <div class="menu-item">MƯA</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Tọa độ phẳng cho map giả tưởng
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 2,
            attributionControl: false
        });

        // QUAN TRỌNG: Định nghĩa kích thước ảnh gốc (Dựa trên ảnh của bạn là 890x1778 hoặc tương đương)
        // Tôi lấy con số 1000 để làm chuẩn, Leaflet sẽ tự fit không lo bị méo.
        var bounds = [[0, 0], [1000, 1000]]; 
        var image = L.imageOverlay('https://i.ibb.co/p6njm03s/1778582329890.png', bounds).addTo(map);

        map.fitBounds(bounds);

        // Thêm các điểm bão (tọa độ tính trong khoảng 0-1000)
        function addStorm(y, x, text) {
            L.circle([y, x], { radius: 80, color: 'red', weight: 1, fillOpacity: 0.05, dashArray: '5,5' }).addTo(map);
            var icon = L.divIcon({ className: 'storm-dot', iconSize: [10, 10] });
            L.marker([y, x], {icon: icon}).addTo(map).bindTooltip(text);
        }

        // Đặt bão vào các vị trí chính xác trên map của bạn
        addStorm(650, 280, "Áp thấp nhiệt đới");
        addStorm(450, 750, "Cơn bão số 2");

    </script>
</body>
</html>
