<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Khí Tượng Đồng Bộ Toàn Cầu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .map-container { width: 100vw; height: 50vw; max-height: 100vh; max-width: 200vh; position: relative; margin: auto; top: 50%; transform: translateY(-50%); border: 1px solid #333; }
        #map { width: 100%; height: 100%; background: #05070a; cursor: crosshair; }

        /* Global Alert Ticker */
        #tickerWrap { position: absolute; top: 0; width: 100%; background: #ff0000; color: #fff; z-index: 5000; display: none; padding: 5px 0; overflow: hidden; }
        .ticker { display: inline-block; white-space: nowrap; animation: ticker 15s linear infinite; font-weight: bold; text-transform: uppercase; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Admin Panel Pro */
        #adminPanel { 
            position: absolute; top: 10px; right: -350px; width: 320px; height: 95%; 
            background: rgba(15, 15, 15, 0.98); border-left: 3px solid #ff4b4b; 
            z-index: 4000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); color: #fff; padding: 20px; box-sizing: border-box;
            box-shadow: -10px 0 30px rgba(0,0,0,0.9);
        }
        #adminPanel.active { right: 0; }
        h3 { margin-top: 0; color: #ff4b4b; border-bottom: 1px solid #333; padding-bottom: 10px; text-align: center; }
        .group { margin-bottom: 15px; }
        label { font-size: 11px; color: #888; display: block; margin-bottom: 5px; }
        input, select { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-add { background: #ff4b4b; color: white; }
        .btn-msg { background: #444; color: #ccc; font-size: 11px; }

        /* Marker & Radar Style */
        .storm-marker { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; position: relative; }
        .radar { position: absolute; inset: -20px; border: 2px solid rgba(255,0,0,0.5); border-radius: 50%; animation: radar 2s infinite; }
        @keyframes radar { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        .login-dot { position: absolute; bottom: 5px; right: 5px; z-index: 1000; background: none; border: none; color: #111; cursor: pointer; }
    </style>
</head>
<body>

    <div id="tickerWrap"><div class="ticker" id="tickerMsg"></div></div>

    <div class="map-container">
        <div id="map"></div>
        <button class="login-dot" onclick="login()">.</button>

        <div id="adminPanel">
            <h3>BẢNG ĐIỀU KHIỂN</h3>
            <div class="group">
                <label>TÊN CƠN BÃO</label>
                <input type="text" id="sName" placeholder="VD: YAGI 2026">
            </div>
            <div class="group">
                <label>NHIỆT ĐỘ TÂM (°C)</label>
                <input type="number" id="sTemp" value="29">
            </div>
            <div class="group">
                <label>CẤP ĐỘ NGUY HIỂM</label>
                <select id="sLevel">
                    <option value="apthap">Áp thấp (Vàng)</option>
                    <option value="bao">Bão nhiệt đới (Cam)</option>
                    <option value="sieubao">Siêu bão (Đỏ)</option>
                </select>
            </div>
            <div class="group">
                <label>BÁN KÍNH ẢNH HƯỞNG (KM)</label>
                <input type="range" id="sRadius" min="50" max="600" value="200">
            </div>
            <div class="group">
                <label>TIN NHẮN TOÀN CẦU</label>
                <input type="text" id="alertInp" placeholder="Cảnh báo khẩn cấp...">
                <button class="btn btn-msg" onclick="sendMsg()">PHÁT THÔNG BÁO</button>
            </div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            <div id="statusHint" style="font-size: 11px; color: #ff4b4b; text-align: center;">HÃY CHỌN TÂM BÃO TRÊN MAP</div>
            <button class="btn" style="background:#222; color:#555; font-size:10px; margin-top:20px;" onclick="location.reload()">ĐĂNG XUẤT</button>
        </div>
    </div>

    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Setup PubNub (Sử dụng Demo Keys công cộng)
        const pubnub = new PubNub({
            publishKey: 'pub-c-497793d9-a359-458b-967b-1b913840742d',
            subscribeKey: 'sub-c-17937446-ec8c-4f76-905c-3a8595085e6a',
            uuid: "user_" + Math.random().toString(36).substring(7)
        });

        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
        const bounds = [[0, 0], [1000, 2000]];
        L.imageOverlay('https://i.ibb.co/p6njm03s/1778582329890.png', bounds).addTo(map);
        map.fitBounds(bounds);

        let isAdmin = false, step = 1, tempStorm = {}, stormLayers = {};
        const layerGroup = L.layerGroup().addTo(map);

        function login() { if(prompt("Mật khẩu:") === 'aihoi') { isAdmin = true; document.getElementById('adminPanel').classList.add('active'); } }

        // Nhận dữ liệu đồng bộ
        pubnub.addListener({
            message: (obj) => {
                const data = obj.message;
                if(data.type === 'storm') {
                    addStormToMap(data);
                } else if(data.type === 'msg') {
                    if(data.txt) {
                        document.getElementById('tickerWrap').style.display = 'block';
                        document.getElementById('tickerMsg').innerText = data.txt;
                    } else {
                        document.getElementById('tickerWrap').style.display = 'none';
                    }
                } else if(data.type === 'delete') {
                    if(stormLayers[data.id]) { layerGroup.removeLayer(stormLayers[data.id]); delete stormLayers[data.id]; }
                }
            }
        });
        pubnub.subscribe({ channels: ['weather_channel_shared'] });

        function addStormToMap(s) {
            if(stormLayers[s.id]) layerGroup.removeLayer(stormLayers[s.id]);
            const color = s.lv === 'sieubao' ? '#ff0000' : (s.lv === 'bao' ? '#ff9800' : '#ffeb3b');
            
            const marker = L.marker([s.y, s.x], {
                icon: L.divIcon({ className: 'storm-marker', html: `<div class="radar" style="border-color:${color}"></div>` })
            });
            const circle = L.circle([s.y, s.x], { radius: parseInt(s.r), color: color, weight: 1, fillOpacity: 0.1 });
            const elements = [marker, circle];
            
            if(s.ty) elements.push(L.polyline([[s.y, s.x], [s.ty, s.tx]], { color: color, weight: 1, dashArray: '5,5', opacity: 0.4 }));

            const group = L.layerGroup(elements).addTo(layerGroup);
            const delBtn = isAdmin ? `<br><button onclick="deleteStorm('${s.id}')" style="background:red; color:white; border:none; padding:2px 5px; cursor:pointer;">XÓA</button>` : "";
            marker.bindTooltip(`<b>${s.name}</b><br>${s.temp}°C | Bán kính: ${s.r}km${delBtn}`, { permanent: true, direction: 'top', interactive: true });
            
            stormLayers[s.id] = group;
        }

        map.on('click', e => {
            if(!isAdmin) return;
            if(step === 1) {
                tempStorm = { 
                    y: e.latlng.lat, x: e.latlng.lng, 
                    name: document.getElementById('sName').value || "UNNAMED",
                    temp: document.getElementById('sTemp').value,
                    lv: document.getElementById('sLevel').value,
                    r: document.getElementById('sRadius').value
                };
                step = 2;
                document.getElementById('statusHint').innerText = "CHỌN HƯỚNG BÃO DI CHUYỂN";
            } else {
                tempStorm.ty = e.latlng.lat; tempStorm.tx = e.latlng.lng;
                tempStorm.type = 'storm'; tempStorm.id = "S" + Date.now();
                pubnub.publish({ channel: 'weather_channel_shared', message: tempStorm });
                step = 1;
                document.getElementById('statusHint').innerText = "HÃY CHỌN TÂM BÃO TRÊN MAP";
            }
        });

        window.deleteStorm = (id) => pubnub.publish({ channel: 'weather_channel_shared', message: { type: 'delete', id: id } });
        window.sendMsg = () => pubnub.publish({ channel: 'weather_channel_shared', message: { type: 'msg', txt: document.getElementById('alertInp').value } });

    </script>
</body>
</html>
