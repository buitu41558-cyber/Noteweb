<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Khí Tượng 3 Điểm - Realtime</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .map-container { width: 100vw; height: 50vw; max-height: 100vh; max-width: 200vh; position: relative; margin: auto; top: 50%; transform: translateY(-50%); border: 1px solid #333; }
        #map { width: 100%; height: 100%; background: #05070a; }

        /* Panel quản trị bên trái */
        #adminPanel { 
            position: absolute; top: 0; left: -320px; width: 300px; height: 100%; 
            background: rgba(10, 10, 10, 0.98); border-right: 3px solid #ff4b4b; 
            z-index: 4000; transition: 0.4s ease-in-out; color: #fff; padding: 25px; box-sizing: border-box;
        }
        #adminPanel.active { left: 0; }
        .toggle-panel {
            position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
            width: 40px; height: 60px; background: #ff4b4b; color: white; border: none; 
            border-radius: 0 5px 5px 0; cursor: pointer; display: none; font-weight: bold;
        }

        h2 { color: #ff4b4b; font-size: 16px; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
        .item { margin-bottom: 12px; }
        label { font-size: 10px; color: #666; display: block; margin-bottom: 3px; }
        input, select { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 12px; background: #ff4b4b; color: #fff; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 4px; }

        /* Marker bão Pro */
        .storm-marker { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; position: relative; }
        .radar-pulse { 
            position: absolute; inset: -20px; border: 2px solid inherit; border-radius: 50%; 
            animation: pulse 2s infinite; opacity: 0.6; pointer-events: none;
        }
        @keyframes pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        .login-btn { position: absolute; bottom: 15px; right: 20px; z-index: 1000; background: rgba(255,255,255,0.05); color: #444; border: 1px solid #222; padding: 5px 15px; cursor: pointer; border-radius: 20px; font-size: 11px; }
        .login-btn:hover { color: #ff4b4b; border-color: #ff4b4b; }
        #statusHint { font-size: 11px; color: #ff4b4b; text-align: center; margin-top: 15px; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>

    <div class="map-container">
        <div id="map"></div>
        <button class="login-btn" onclick="login()">ADMIN</button>

        <div id="adminPanel">
            <button class="toggle-panel" id="toggleBtn" onclick="togglePanel()"> < </button>
            <h2>COMMAND CENTER</h2>
            <div class="item">
                <label>TÊN BÃO</label>
                <input type="text" id="sName" placeholder="VD: TYPHOON 01">
            </div>
            <div class="item">
                <label>NHIỆT ĐỘ (°C)</label>
                <input type="number" id="sTemp" value="28">
            </div>
            <div class="item">
                <label>CẤP ĐỘ</label>
                <select id="sLevel">
                    <option value="apthap">ÁP THẤP (VÀNG)</option>
                    <option value="bao">BÃO (CAM)</option>
                    <option value="sieubao">SIÊU BÃO (ĐỎ)</option>
                </select>
            </div>
            <div class="item">
                <label>BÁN KÍNH (KM)</label>
                <input type="range" id="sRadius" min="50" max="600" value="250">
            </div>
            <div id="statusHint">CLICK LẦN 1: CHỌN TÂM BÃO</div>
            <button class="btn-action" style="background:#222; margin-top:20px;" onclick="location.reload()">ĐĂNG XUẤT</button>
        </div>
    </div>

    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const pubnub = new PubNub({
            publishKey: 'pub-c-497793d9-a359-458b-967b-1b913840742d',
            subscribeKey: 'sub-c-17937446-ec8c-4f76-905c-3a8595085e6a',
            uuid: "meteor_" + Math.random().toString(36).substr(2, 5)
        });

        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
        const bounds = [[0, 0], [1000, 2000]];
        L.imageOverlay('https://i.ibb.co/p6njm03s/1778582329890.png', bounds).addTo(map);
        map.fitBounds(bounds);

        let isAdmin = false, step = 1, points = [], stormLayers = {};
        const layerGroup = L.layerGroup().addTo(map);

        function login() {
            if(prompt("Mật khẩu:") === 'aihoi') {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('toggleBtn').style.display = 'flex';
            }
        }

        function togglePanel() {
            const panel = document.getElementById('adminPanel');
            const btn = document.getElementById('toggleBtn');
            panel.classList.toggle('active');
            btn.innerText = panel.classList.contains('active') ? '<' : '>';
        }

        // Tải dữ liệu lịch sử
        pubnub.fetchMessages({ channels: ['global_storm_v5'], count: 20 }, (s, res) => {
            if (res && res.channels['global_storm_v5']) {
                res.channels['global_storm_v5'].forEach(m => {
                    if(m.message.type === 'storm') renderStorm(m.message);
                    if(m.message.type === 'delete') deleteLocal(m.message.id);
                });
            }
        });

        pubnub.addListener({ message: (obj) => {
            const d = obj.message;
            if(d.type === 'storm') renderStorm(d);
            if(d.type === 'delete') deleteLocal(d.id);
        }});
        pubnub.subscribe({ channels: ['global_storm_v5'] });

        function renderStorm(s) {
            if(stormLayers[s.id]) layerGroup.removeLayer(stormLayers[s.id]);
            const color = s.lv === 'sieubao' ? '#ff0000' : (s.lv === 'bao' ? '#ff9800' : '#ffeb3b');
            
            const marker = L.marker([s.p1.y, s.p1.x], {
                icon: L.divIcon({ className: 'storm-marker', html: `<div class="radar-pulse" style="border-color:${color}; background:radial-gradient(circle, ${color} 10%, transparent 70%); opacity:0.3"></div>`, iconSize:[20,20] })
            });

            const circle = L.circle([s.p1.y, s.p1.x], { radius: parseInt(s.r), color: color, weight: 1, fillOpacity: 0.1 });
            const elements = [marker, circle];
            
            if(s.p2 && s.p3) {
                elements.push(L.polyline([[s.p1.y, s.p1.x], [s.p2.y, s.p2.x], [s.p3.y, s.p3.x]], { color: color, weight: 1, dashArray: '10,10', opacity: 0.5 }));
                elements.push(L.circle([s.p3.y, s.p3.x], { radius: 10, color: color, fillOpacity: 0.5 }));
            }

            const group = L.layerGroup(elements).addTo(layerGroup);
            const delAction = isAdmin ? `<br><button onclick="publishDel('${s.id}')" style="background:red; color:white; border:none; padding:3px 10px; cursor:pointer; border-radius:3px; margin-top:5px;">XÓA BÃO</button>` : "";
            marker.bindTooltip(`<b>${s.name}</b><br>${s.temp}°C${delAction}`, { permanent: true, direction: 'top', interactive: true });
            
            stormLayers[s.id] = group;
        }

        map.on('click', e => {
            if(!isAdmin) return;
            const p = { y: e.latlng.lat, x: e.latlng.lng };
            points.push(p);

            if(step === 1) { document.getElementById('statusHint').innerText = "CLICK LẦN 2: CHỌN ĐIỂM GIỮA"; step = 2; }
            else if(step === 2) { document.getElementById('statusHint').innerText = "CLICK LẦN 3: XÁC NHẬN KẾT THÚC"; step = 3; }
            else {
                const data = {
                    type: 'storm', id: "ID" + Date.now(),
                    name: document.getElementById('sName').value || "BÃO MỚI",
                    temp: document.getElementById('sTemp').value,
                    lv: document.getElementById('sLevel').value,
                    r: document.getElementById('sRadius').value,
                    p1: points[0], p2: points[1], p3: points[2]
                };
                pubnub.publish({ channel: 'global_storm_v5', message: data });
                points = []; step = 1;
                document.getElementById('statusHint').innerText = "ĐÃ LƯU VĨNH VIỄN! CLICK ĐỂ TẠO BÃO MỚI";
            }
        });
