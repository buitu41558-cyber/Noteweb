<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Windy - Fixed Ratio</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0b0e11; overflow: hidden; }
        #map { width: 100%; height: 100%; }

        /* UI chuẩn Windy */
        .windy-header {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: rgba(35, 35, 35, 0.9); padding: 10px 20px;
            border-radius: 4px; color: white; border-left: 4px solid #ff4b4b;
        }
        .layer-control {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            z-index: 1000; background: rgba(35,35,35,0.9); padding: 10px; border-radius: 8px;
        }
        .layer-btn { color: #aaa; text-align: center; font-size: 11px; margin: 10px 0; cursor: pointer; }
        .layer-btn.active { color: #32a1ff; }

        /* Hiệu ứng xoáy bão chuyên nghiệp (SVG) */
        .storm-core {
            animation: rotate 4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 140, 255, 0.5));
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="windy-header">
        <b style="font-size: 18px;">HỆ THỐNG CẢNH BÁO THIÊN TAI</b>
        <div style="font-size: 12px; color: #ff4b4b;">● ĐANG THEO DÕI 2 CƠN BÃO</div>
    </div>

    <div class="layer-control">
        <div class="layer-btn active">🌀<br>Gió</div>
        <div class="layer-btn">🌡️<br>Nhiệt</div>
        <div class="layer-btn">⛈️<br>Sét</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const mapImgUrl = 'https://i.ibb.co/p6njm03s/1778582329890.png';
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            attributionControl: false
        });

        // FIX LỖI MÉO ẢNH: Dùng Image() để lấy kích thước thật của file
        const img = new Image();
        img.src = mapImgUrl;
        img.onload = function() {
            const w = this.width;
            const h = this.height;
            
            // Thiết lập tọa độ chuẩn theo pixel ảnh (Giữ nguyên tỉ lệ w/h)
            const southWest = map.unproject([0, h], map.getMaxZoom()-1);
            const northEast = map.unproject([w, 0], map.getMaxZoom()-1);
            const bounds = new L.LatLngBounds(southWest, northEast);

            // Add ảnh vào với bounds đã tính toán chuẩn
            L.imageOverlay(mapImgUrl, bounds).addTo(map);
