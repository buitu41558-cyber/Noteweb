  <script>
    /* FIREBASE & STATE */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-app.firebaseapp.com",
      databaseURL: "https://your-app-default-rtdb.firebaseio.com",
      projectId: "your-app",
      storageBucket: "your-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    let db = null;
    let isFirebaseConnected = false;

    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseConnected = true;
      }
    } catch(e) {}

    let isAdmin = false;
    let activeTeamId = null;
    let currentFormation = '4-3-3';
    
    let teams = {};
    let players = {};
    let squadLineup = {};

    // SƠ ĐỒ DỌC (SA BÀN MANAGEMENT)
    const FORMATIONS = {
      '4-3-3': [
        { id: 'gk', pos: 'GK', top: 88, left: 50 },
        { id: 'lb', pos: 'LB', top: 70, left: 15 },
        { id: 'cb1', pos: 'CB', top: 75, left: 38 },
        { id: 'cb2', pos: 'CB', top: 75, left: 62 },
        { id: 'rb', pos: 'RB', top: 70, left: 85 },
        { id: 'cm1', pos: 'CM', top: 48, left: 30 },
        { id: 'cdm', pos: 'CDM', top: 52, left: 50 },
        { id: 'cm2', pos: 'CM', top: 48, left: 70 },
        { id: 'lw', pos: 'LW', top: 22, left: 20 },
        { id: 'st', pos: 'ST', top: 18, left: 50 },
        { id: 'rw', pos: 'RW', top: 22, left: 80 }
      ],
      '4-2-3-1': [
        { id: 'gk', pos: 'GK', top: 88, left: 50 },
        { id: 'lb', pos: 'LB', top: 72, left: 15 },
        { id: 'cb1', pos: 'CB', top: 75, left: 38 },
        { id: 'cb2', pos: 'CB', top: 75, left: 62 },
        { id: 'rb', pos: 'RB', top: 72, left: 85 },
        { id: 'cdm1', pos: 'CDM', top: 58, left: 35 },
        { id: 'cdm2', pos: 'CDM', top: 58, left: 65 },
        { id: 'cam1', pos: 'LM', top: 35, left: 20 },
        { id: 'cam2', pos: 'CAM', top: 32, left: 50 },
        { id: 'cam3', pos: 'RM', top: 35, left: 80 },
        { id: 'st', pos: 'ST', top: 16, left: 50 }
      ],
      '4-4-2': [
        { id: 'gk', pos: 'GK', top: 88, left: 50 },
        { id: 'lb', pos: 'LB', top: 72, left: 15 },
        { id: 'cb1', pos: 'CB', top: 75, left: 38 },
        { id: 'cb2', pos: 'CB', top: 75, left: 62 },
        { id: 'rb', pos: 'RB', top: 72, left: 85 },
        { id: 'lm', pos: 'LM', top: 48, left: 15 },
        { id: 'cm1', pos: 'CM', top: 50, left: 38 },
        { id: 'cm2', pos: 'CM', top: 50, left: 62 },
        { id: 'rm', pos: 'RM', top: 48, left: 85 },
        { id: 'st1', pos: 'ST', top: 20, left: 35 },
        { id: 'st2', pos: 'ST', top: 20, left: 65 }
      ],
      '3-5-2': [
        { id: 'gk', pos: 'GK', top: 88, left: 50 },
        { id: 'cb1', pos: 'CB', top: 75, left: 25 },
        { id: 'cb2', pos: 'CB', top: 78, left: 50 },
        { id: 'cb3', pos: 'CB', top: 75, left: 75 },
        { id: 'cdm1', pos: 'CDM', top: 56, left: 38 },
        { id: 'cdm2', pos: 'CDM', top: 56, left: 62 },
        { id: 'lm', pos: 'LWB', top: 40, left: 12 },
        { id: 'cam', pos: 'CAM', top: 38, left: 50 },
        { id: 'rm', pos: 'RWB', top: 40, left: 88 },
        { id: 'st1', pos: 'ST', top: 18, left: 35 },
        { id: 'st2', pos: 'ST', top: 18, left: 65 }
      ]
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderSquadPitch();
      initMatchCanvas();
    });

    function loadData() {
      if (isFirebaseConnected) {
        db.ref('teams').on('value', (s) => { teams = s.val() || {}; updateTeamDropdowns(); renderDashboard(); });
        db.ref('players').on('value', (s) => { players = s.val() || {}; renderDatabaseTable(); renderSquadPitch(); });
      } else {
        const lt = localStorage.getItem('victoria_teams');
        const lp = localStorage.getItem('victoria_players');
        if (lt) teams = JSON.parse(lt);
        if (lp) players = JSON.parse(lp);
        updateTeamDropdowns();
        renderDashboard();
        renderDatabaseTable();
        renderSquadPitch();
      }
    }

    function saveData(k, v) {
      if (isFirebaseConnected) db.ref(k).set(v);
      else localStorage.setItem(`victoria_${k}`, JSON.stringify(v));
    }

    function switchScreen(sId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`screen-${sId}`).classList.add('active');
      event.currentTarget.classList.add('active');
      if (sId === 'squad') renderSquadPitch();
      if (sId === 'dashboard') renderDashboard();
    }

    function openAdminModal() { openModal('modalAdmin'); }
    function loginAdmin() {
      if (document.getElementById('adminPasswordInput').value === 'admin123') {
        isAdmin = true;
        document.getElementById('adminStatusText').innerText = "Quyền: Quản Trị Viên (Admin)";
        document.getElementById('adminStatusText').style.color = "var(--accent-emerald)";
        document.getElementById('adminDataControls').style.display = "flex";
        document.querySelectorAll('.admin-col').forEach(c => c.style.display = "table-cell");
        closeModal('modalAdmin');
        renderDatabaseTable();
      } else alert("Mật khẩu sai!");
    }

    function saveTeam() {
      if (!isAdmin) return;
      const name = document.getElementById('teamNameInput').value;
      const fileInput = document.getElementById('teamLogoInput');
      if (!name) return alert("Vui lòng nhập tên!");

      const id = 'team_' + Date.now();
      const save = (logo) => {
        teams[id] = { id, name, logo: logo || '' };
        saveData('teams', teams);
        updateTeamDropdowns();
        closeModal('modalCreateTeam');
      };

      if (fileInput.files && fileInput.files[0]) {
        const r = new FileReader();
        r.onload = (e) => save(e.target.result);
        r.readAsDataURL(fileInput.files[0]);
      } else save('');
    }

    function savePlayer() {
      if (!isAdmin) return;
      const name = document.getElementById('playerNameInput').value;
      const teamId = document.getElementById('playerTeamSelect').value;
      const pos = document.getElementById('playerPosSelect').value;
      const photoInput = document.getElementById('playerPhotoInput');

      const pac = parseInt(document.getElementById('attrPAC').value) || 80;
      const sho = parseInt(document.getElementById('attrSHO').value) || 75;
      const pas = parseInt(document.getElementById('attrPAS').value) || 75;
      const dri = parseInt(document.getElementById('attrDRI').value) || 80;
      const def = parseInt(document.getElementById('attrDEF').value) || 70;
      const phy = parseInt(document.getElementById('attrPHY').value) || 75;
      const iq = parseInt(document.getElementById('attrIQ').value) || 85;

      if (!name) return alert("Nhập tên cầu thủ!");

      const ovr = Math.round((pac + sho + pas + dri + def + phy + iq) / 7);
      const id = 'player_' + Date.now();

      const save = (photo) => {
        players[id] = { id, name, teamId, pos, photo: photo || '', ovr, pac, sho, pas, dri, def, phy, iq };
        saveData('players', players);
        renderDatabaseTable();
        closeModal('modalCreatePlayer');
      };

      if (photoInput.files && photoInput.files[0]) {
        const r = new FileReader();
        r.onload = (e) => save(e.target.result);
        r.readAsDataURL(photoInput.files[0]);
      } else save('');
    }

    function deletePlayer(id) {
      if (!isAdmin) return;
      if (confirm("Xóa cầu thủ này?")) {
        delete players[id];
        saveData('players', players);
        renderDatabaseTable();
      }
    }

    function updateTeamDropdowns() {
      let html = '<option value="">-- Chọn Đội --</option>';
      Object.values(teams).forEach(t => { html += `<option value="${t.id}">${t.name}</option>`; });
      document.getElementById('activeTeamSelect').innerHTML = html;
      document.getElementById('playerTeamSelect').innerHTML = html;
      document.getElementById('matchHomeTeamSelect').innerHTML = html;
      document.getElementById('matchAwayTeamSelect').innerHTML = html;
      if (activeTeamId) document.getElementById('activeTeamSelect').value = activeTeamId;
    }

    function changeActiveTeam(id) { activeTeamId = id; renderDashboard(); renderSquadPitch(); }

    function renderDashboard() {
      if (!activeTeamId || !teams[activeTeamId]) {
        document.getElementById('dashTeamName').innerText = "Chưa chọn Đội";
        document.getElementById('dashTeamOVR').innerText = "0";
        document.getElementById('dashPlayerCount').innerText = "0";
        return;
      }
      const t = teams[activeTeamId];
      const tp = Object.values(players).filter(p => p.teamId === activeTeamId);
      const avg = tp.length ? Math.round(tp.reduce((a, b) => a + b.ovr, 0) / tp.length) : 0;
      document.getElementById('dashTeamName').innerText = t.name;
      document.getElementById('dashTeamLogo').src = t.logo || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' fill='%23131e36'/></svg>";
      document.getElementById('dashTeamOVR').innerText = avg;
      document.getElementById('dashPlayerCount').innerText = tp.length;
    }

    function renderDatabaseTable() {
      const tbody = document.getElementById('playerTableBody');
      const search = document.getElementById('searchPlayerInput').value.toLowerCase();
      const posF = document.getElementById('filterPosSelect').value;
      tbody.innerHTML = '';

      Object.values(players).forEach(p => {
        if (search && !p.name.toLowerCase().includes(search)) return;
        if (posF && p.pos !== posF) return;

        const team = teams[p.teamId];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${p.photo || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'30\' height=\'30\'><circle cx=\'15\' cy=\'15\' r=\'15\' fill=\'%2327395e\'/></svg>'}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;"></td>
          <td style="font-weight:600;">${p.name}</td>
          <td><span class="player-pos-tag">${p.pos}</span></td>
          <td style="font-weight:700; color:var(--accent-emerald);">${p.ovr}</td>
          <td>${p.pac}</td><td>${p.sho}</td><td>${p.pas}</td><td>${p.dri}</td><td>${p.def}</td><td>${p.phy}</td>
          <td>${team ? team.name : 'Tự do'}</td>
          <td class="admin-col" style="${isAdmin ? '' : 'display:none;'}">
            <button class="btn btn-danger" style="padding:2px 6px; font-size:11px;" onclick="deletePlayer('${p.id}')">Xóa</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* SQUAD MANAGEMENT */
    function changeFormation(f) { currentFormation = f; renderSquadPitch(); }

    function renderSquadPitch() {
      const pitch = document.getElementById('squadPitch');
      pitch.querySelectorAll('.player-slot').forEach(s => s.remove());

      const slots = FORMATIONS[currentFormation];
      const tp = Object.values(players).filter(p => p.teamId === activeTeamId);

      slots.forEach(s => {
        const slotDiv = document.createElement('div');
        slotDiv.className = 'player-slot';
        slotDiv.style.top = `${s.top}%`;
        slotDiv.style.left = `${s.left}%`;

        const pId = squadLineup[s.id];
        const p = players[pId];

        slotDiv.innerHTML = `
          <div class="player-card-mini">
            ${p ? `<img src="${p.photo || ''}">` : s.pos}
          </div>
          <div class="player-pos-tag">${p ? p.name.split(' ').pop() : s.pos}</div>
        `;
        slotDiv.onclick = () => assignPlayerPrompt(s.id, s.pos);
        pitch.appendChild(slotDiv);
      });

      const startingIds = Object.values(squadLineup);
      const bench = tp.filter(p => !startingIds.includes(p.id));
      const benchList = document.getElementById('benchList');
      benchList.innerHTML = '';

      bench.forEach(p => {
        const item = document.createElement('div');
        item.className = 'card';
        item.style.padding = '6px 10px';
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        item.style.alignItems = 'center';
        item.innerHTML = `
          <div><strong style="font-size:12px;">${p.name}</strong> <span class="player-pos-tag">${p.pos}</span></div>
          <div style="font-weight:700; color:var(--accent-emerald); font-size:12px;">${p.ovr}</div>
        `;
        benchList.appendChild(item);
      });
    }

    function assignPlayerPrompt(sId, reqPos) {
      if (!activeTeamId) return alert("Vui lòng chọn đội bóng trước!");
      const tp = Object.values(players).filter(p => p.teamId === activeTeamId);
      let msg = `Chọn cầu thủ vị trí ${reqPos}:\n`;
      tp.forEach((p, i) => { msg += `${i + 1}. ${p.name} (${p.pos} - OVR: ${p.ovr})\n`; });

      const choice = prompt(msg);
      if (choice) {
        const idx = parseInt(choice) - 1;
        if (tp[idx]) { squadLineup[sId] = tp[idx].id; renderSquadPitch(); }
      }
    }

    /* MATCH SIMULATION ENGINE 2D FIXED AI REALISTIC MOVEMENT */
    let canvas, ctx;
    let matchInterval = null;
    let matchTime = 0;
    let isMatchRunning = false;

    let homeTeamState = [], awayTeamState = [];
    let ballState = { x: 450, y: 275, vx: 0, vy: 0, owner: null };
    let refereeState = { x: 450, y: 200 };

    let matchStats = {
      homeShots: 0, homeShotsTarget: 0, awayShots: 0, awayShotsTarget: 0,
      homeFouls: 0, awayFouls: 0, homeOffsides: 0, awayOffsides: 0,
      homeCardsY: 0, homeCardsR: 0, awayCardsY: 0, awayCardsR: 0,
      scoreHome: 0, scoreAway: 0
    };

    function initMatchCanvas() {
      canvas = document.getElementById('matchCanvas');
      ctx = canvas.getContext('2d');
      drawPitch();
    }

    function drawPitch() {
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;

      ctx.strokeRect(30, 20, canvas.width - 60, canvas.height - 40);

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 20);
      ctx.lineTo(canvas.width / 2, canvas.height - 20);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 55, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeRect(30, (canvas.height - 220) / 2, 110, 220);
      ctx.strokeRect(canvas.width - 140, (canvas.height - 220) / 2, 110, 220);

      ctx.strokeRect(30, (canvas.height - 100) / 2, 45, 100);
      ctx.strokeRect(canvas.width - 75, (canvas.height - 100) / 2, 45, 100);

      ctx.strokeRect(15, (canvas.height - 80) / 2, 15, 80);
      ctx.strokeRect(canvas.width - 30, (canvas.height - 80) / 2, 15, 80);
    }

    function setupTeamOnPitch(teamId, isHome) {
      const tp = Object.values(players).filter(p => p.teamId === teamId);
      const slots = FORMATIONS[currentFormation] || FORMATIONS['4-3-3'];

      return slots.map((slot, idx) => {
        const p = tp[idx] || { name: `${isHome ? 'home' : 'away'}_${slot.pos}`, pos: slot.pos, pac: 80, sho: 75, pas: 75, dri: 80, def: 75, phy: 75, iq: 80 };
        
        let normalizedX = (100 - slot.top) / 100;
        let posX = 30 + normalizedX * (canvas.width / 2 - 60);
        let posY = 20 + (slot.left / 100) * (canvas.height - 40);

        if (!isHome) {
          posX = canvas.width - posX;
        }

        return {
          ...p,
          x: posX,
          y: posY,
          baseX: posX,
          baseY: posY,
          isHome: isHome,
          cooldown: 0
        };
      });
    }

    function startMatchSimulation() {
      const homeId = document.getElementById('matchHomeTeamSelect').value;
      const awayId = document.getElementById('matchAwayTeamSelect').value;

      if (!homeId || !awayId || homeId === awayId) {
        return alert("Vui lòng chọn 2 đội bóng khác nhau!");
      }

      homeTeamState = setupTeamOnPitch(homeId, true);
      awayTeamState = setupTeamOnPitch(awayId, false);

      matchTime = 0;
      ballState = { x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, owner: null };
      
      matchStats = { homeShots: 0, homeShotsTarget: 0, awayShots: 0, awayShotsTarget: 0, homeFouls: 0, awayFouls: 0, homeOffsides: 0, awayOffsides: 0, homeCardsY: 0, homeCardsR: 0, awayCardsY: 0, awayCardsR: 0, scoreHome: 0, scoreAway: 0 };
      updateStatsUI();

      isMatchRunning = true;
      document.getElementById('btnStartMatch').style.display = 'none';
      document.getElementById('btnStopMatch').style.display = 'inline-block';

      logMatch("Trọng tài thổi còi bắt đầu trận đấu!");

      if (matchInterval) clearInterval(matchInterval);
      matchInterval = setInterval(updateMatchLoop, 60);
    }

    function updateMatchLoop() {
      if (!isMatchRunning) return;

      matchTime += 0.1;
      if (matchTime >= 90) {
        stopMatchSimulation();
        logMatch("Trận đấu kết thúc!");
        return;
      }

      document.getElementById('matchTimerDisplay').innerText = `${Math.floor(matchTime)}:00`;

      updateAIEngine();
      updateBallPhysics();
      
      drawPitch();
      renderPlayersAndBall();
    }

    function updateAIEngine() {
      const allPlayers = [...homeTeamState, ...awayTeamState];

      // Trọng tài di chuyển theo bóng
      refereeState.x += (ballState.x - refereeState.x) * 0.05;
      refereeState.y += (ballState.y - 40 - refereeState.y) * 0.05;

      allPlayers.forEach(p => {
        if (p.cooldown > 0) p.cooldown--;

        const speed = (p.pac / 200) * 2.2 + 1.0;
        const distToBall = Math.hypot(ballState.x - p.x, ballState.y - p.y);

        // NẾU LÀ NGƯỜI GIỮ BÓNG
        if (ballState.owner === p) {
          const targetGoalX = p.isHome ? canvas.width - 30 : 30;
          const targetGoalY = canvas.height / 2;
          const distToGoal = Math.hypot(targetGoalX - p.x, targetGoalY - p.y);

          const angle = Math.atan2(targetGoalY - p.y, targetGoalX - p.x);
          p.x += Math.cos(angle) * (speed * 0.7);
          p.y += Math.sin(angle) * (speed * 0.7);

          ballState.x = p.x + Math.cos(angle) * 10;
          ballState.y = p.y + Math.sin(angle) * 10;

          // Quyết định sút gôn
          if (distToGoal < 160 || (distToGoal < 240 && Math.random() < 0.03)) {
            triggerShot(p, targetGoalX, targetGoalY);
          } 
          // Quyết định chuyền bóng
          else if (Math.random() < 0.04) {
            triggerPass(p);
          }
        } 
        // NẾU BÓNG TỰ DO HOẶC ĐỐI PHƯƠNG GIỮ BÓNG
        else {
          const isOwnerEnemy = ballState.owner && (ballState.owner.isHome !== p.isHome);
          
          // Cầu thủ gần bóng nhất nhảy vào cướp bóng
          if (distToBall < 180 && p.cooldown === 0) {
            const angle = Math.atan2(ballState.y - p.y, ballState.x - p.x);
            p.x += Math.cos(angle) * speed;
            p.y += Math.sin(angle) * speed;

            // Xoạc/Cướp bóng
            if (distToBall < 14) {
              if (!ballState.owner || Math.random() * 200 < p.def) {
                ballState.owner = p;
                p.cooldown = 20; // Cooldown 1.2s tránh dính bóng
                logMatch(`${p.name} (${p.isHome ? 'Đội nhà' : 'Đội khách'}) cướp bóng thành công!`);
              } else if (Math.random() < 0.05) {
                if (p.isHome) matchStats.homeFouls++; else matchStats.awayFouls++;
                logMatch(`Trọng tài thổi phạt! ${p.name} phạm lỗi.`);
                updateStatsUI();
              }
            }
          } 
          // CÁC CẦU THỦ KHÁC: Di chuyển chiến thuật dâng cao/lùi về theo vị trí bóng
          else {
            let shiftX = (ballState.x - canvas.width / 2) * 0.3;
            let targetX = p.baseX + shiftX;
            let targetY = p.baseY;

            // Di chuyển mượt về vị trí chiến thuật
            p.x += (targetX - p.x) * 0.05;
            p.y += (targetY - p.y) * 0.05;
          }
        }
      });
    }

    function triggerPass(p) {
      const teammates = (p.isHome ? homeTeamState : awayTeamState).filter(tm => tm !== p);
      if (!teammates.length) return;

      // Chọn đồng đội ở vị trí thuận lợi phía trước
      let target = teammates[Math.floor(Math.random() * teammates.length)];
      
      logMatch(`${p.name} chuyền bóng cho ${target.name}.`);

      p.cooldown = 25; // Cooldown cho ng chuyền
      ballState.owner = null;

      const angle = Math.atan2(target.y - p.y, target.x - p.x);
      ballState.vx = Math.cos(angle) * 9;
      ballState.vy = Math.sin(angle) * 9;
    }

    function triggerShot(p, targetX, targetY) {
      logMatch(`${p.name} dứt điểm từ xa!`);
      ballState.owner = null;
      p.cooldown = 30;

      if (p.isHome) matchStats.homeShots++; else matchStats.awayShots++;

      const isTarget = Math.random() * 200 < p.sho;
      if (isTarget) {
        if (p.isHome) matchStats.homeShotsTarget++; else matchStats.awayShotsTarget++;
        
        if (Math.random() < 0.4) {
          if (p.isHome) matchStats.scoreHome++; else matchStats.scoreAway++;
          logMatch(`VÀO OOO! Bàn thắng nâng tỷ số cho ${p.name}!`);
          document.getElementById('scoreHome').innerText = matchStats.scoreHome;
          document.getElementById('scoreAway').innerText = matchStats.scoreAway;
          resetBallToCenter();
          return;
        }
      }

      const angle = Math.atan2(targetY - p.y, targetX - p.x) + (Math.random() - 0.5) * 0.3;
      ballState.vx = Math.cos(angle) * 11;
      ballState.vy = Math.sin(angle) * 11;

      updateStatsUI();
    }

    function updateBallPhysics() {
      if (!ballState.owner) {
        ballState.x += ballState.vx;
        ballState.y += ballState.vy;
        ballState.vx *= 0.93;
        ballState.vy *= 0.93;

        if (ballState.x < 30 || ballState.x > canvas.width - 30) { ballState.vx *= -1; }
        if (ballState.y < 20 || ballState.y > canvas.height - 20) { ballState.vy *= -1; }
      }
    }

    function resetBallToCenter() {
      ballState = { x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, owner: null };
    }

    function renderPlayersAndBall() {
      // Trọng tài
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(refereeState.x, refereeState.y, 5, 0, Math.PI * 2);
      ctx.fill();

      // Đội nhà (Xanh dương)
      homeTeamState.forEach(p => {
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // Đội khách (Đỏ)
      awayTeamState.forEach(p => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // Trái bóng
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ballState.x, ballState.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function stopMatchSimulation() {
      isMatchRunning = false;
      if (matchInterval) clearInterval(matchInterval);
      document.getElementById('btnStartMatch').style.display = 'inline-block';
      document.getElementById('btnStopMatch').style.display = 'none';
    }

    function updateStatsUI() {
      document.getElementById('statShots').innerText = `${matchStats.homeShots} (${matchStats.homeShotsTarget}) - ${matchStats.awayShots} (${matchStats.awayShotsTarget})`;
      document.getElementById('statFouls').innerText = `${matchStats.homeFouls} - ${matchStats.awayFouls}`;
      document.getElementById('statOffsides').innerText = `${matchStats.homeOffsides} - ${matchStats.awayOffsides}`;
      document.getElementById('statCards').innerText = `${matchStats.homeCardsY}/${matchStats.homeCardsR} - ${matchStats.awayCardsY}/${matchStats.awayCardsR}`;
    }

    function logMatch(msg) {
      const c = document.getElementById('matchLogConsole');
      c.innerHTML += `<div>[${Math.floor(matchTime)}'] ${msg}</div>`;
      c.scrollTop = c.scrollHeight;
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
