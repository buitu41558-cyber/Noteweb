<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather System - Admin Click</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .map-container { width: 100vw; height: 50vw; max-height: 100vh; max-width: 200vh; position: relative; }
        #map { width: 100%; height: 100%; background: #0b0e11; cursor: crosshair; }

        /* Popup Admin ngay tại điểm click */
        .admin-popup { color: #000; min-width: 150px; }
        .admin-popup input { width: 100%; margin-bottom: 5px; padding: 5px; box-sizing: border-box; border: 1px solid #ccc; }
        .dir-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
        .dir-btn { background: #eee; border: 1px solid #ccc; padding: 4px 8px; cursor: pointer; font-size: 11px; flex: 1; text-align: center; }
        .dir-btn:hover { background: #ddd; }
        .dir-btn.active { background: #ff4b4b; color: white; border-color: #d32f2f; }
        .save-btn { background: #000; color: #fff; border: none; width: 100%; padding: 8px; margin-top: 8px; cursor: pointer; font-weight: bold; }

        /* Marker bão */
        .storm-marker { width: 12px; height: 12px; background: red; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(255,0,0,0.8); }
        
        .login-btn { position: absolute; bottom: 10px; right: 10px; z-index: 1000; background: #222; color: #444; border: none; padding: 5px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

    <div class="map-container">
        <div id="map"></div>
        <button class="login-btn" onclick="login()">[Admin]</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
        const bounds = [[0, 0], [1000, 2000]];
        L.imageOverlay('https://i.ibb.co/p6njm03s/1778582329890.png', bounds).addTo(map);
        map.fitBounds(bounds);

        let isAdmin = false;
        let db = JSON.parse(localStorage.getItem('storm_db_v2')) || [];
        let markers = [];
        let selectedDir = "Tây";

        function login() {
            if(prompt("Mật khẩu quản trị:") === 'aihoi') {
                isAdmin = true;
                alert("Đã vào chế độ Admin. Hãy Click vào bản đồ để thêm bão.");
            }
        }

        function renderMap() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            db.forEach((s, i) => {
                const m = L.marker([s.y, s.x], {
                    icon: L.divIcon({ className: 'storm-marker' })
                }).addTo(map).bindTooltip(`<b>${s.name}</b><br>${s.temp}°C | Hướng: ${s.dir} <br><span style="color:red" onclick="deleteStorm(${i})">[Xóa]</span>`, { interactive: true, permanent: false });
                markers.push(m);
            });
            localStorage.setItem('storm_db_v2', JSON.stringify(db));
        }

        // Xử lý Click Map
        map.on('click', function(e) {
            if(!isAdmin) return;

            const tempPopup = L.popup()
                .setLatLng(e.latlng)
                .setContent(`
                    <div class="admin-popup">
                        <strong>CÀI ĐẶT BÃO</strong>
                        <input type="text" id="popName" placeholder="Tên bão...">
                        <input type="number" id="popTemp" placeholder="Nhiệt độ" value="28">
                        <div class="dir-row">
                            <div class="dir-btn" onclick="updatePopDir('Tây', this)">Tây</div>
                            <div class="dir-btn" onclick="updatePopDir('T.Bắc', this)">T.Bắc</div>
                            <div class="dir-btn" onclick="updatePopDir('Bắc', this)">Bắc</div>
                            <div class="dir-btn" onclick="updatePopDir('T.Nam', this)">T.Nam</div>
                            <div class="dir-btn" onclick="updatePopDir('Nam', this)">Nam</div>
                        </div>
                        <button class="save-btn" onclick="saveStorm(${e.latlng.lat}, ${e.latlng.lng})">XÁC NHẬN</button>
                    </div>
                `)
                .openOn(map);
        });

        window.updatePopDir = function(dir, btn) {
            selectedDir = dir;
            document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        window.saveStorm = function(lat, lng) {
            const name = document.getElementById('popName').value || "UNNAMED";
            const temp = document.getElementById('popTemp').value || 0;
            db.push({ y: lat, x: lng, name: name, temp: temp, dir: selectedDir });
            renderMap();
            map.closePopup();
        };

        window.deleteStorm = function(i) {
            db.splice(i, 1);
            renderMap();
        };

        renderMap();
    </script>
</body>
</html>
