Đã sửa lỗi không tạo được thư mục và ghi chú. Bây giờ mọi thứ hoạt động ổn định, kèm animation mượt mà.

```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ghi chú · Thư mục thông minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #f8f8f5;
      color: #1a1a1a;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem 3rem;
      animation: fadeInBody 0.5s ease forwards;
    }

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }

    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardOut {
      to { opacity: 0; transform: scale(0.9); }
    }

    .app-wrapper {
      max-width: 1120px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      animation: slideUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .app-header h1 {
      font-size: 1.8rem;

    }

    .btn::after {
      content: '';

      border-radius: inherit;
    }
    .btn:hover::after { opacity: 1; }

    .btn-primary {
      background: #1c1c1c;

    }
    .btn-primary:hover { background: #2a2a2a; }

      padding: 0.35rem 0.9rem;

    }

      color: #4a3030;

    .btn-danger:hover { background: #f1e8e8; border-color: #b8a7a7; }

    /* Layout */

    .sidebar-header {
      display: flex;

      align-items: center;
      padding-bottom: 0.3rem;

    .sidebar-header h2 {
      font-size: 1rem;
      font-weight: 700;

    .folder-list {
      list-style: none;

    .folder-item {
      display: flex;
      align-items: center;

    .folder-actions {
      display: flex;

    }
    .folder-item:hover .folder-actions { opacity: 0.8; }

    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem 0.35rem;

    }
    .icon-btn:hover { background: #e0e0d4; }

    .add-folder-row {
      display: flex;
      gap: 0.4rem;

    .add-folder-row input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 0.45rem;
      padding: 0.5rem 0.7rem;
      font-size: 0.82rem;
      background: #fcfcf9;
      font-family: inherit;
      transition: border 0.2s;
    }
    .add-folder-row input:focus { outline: none; border-color: #b0b0a0; }

    /* Notes area */
    .notes-area {
      flex: 1;
      display: flex;
      flex-direction: column;

    }

    .current-folder-title {
      font-weight: 700;
      font-size: 1.3rem;

      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.02em;
    }

    /* Form */
    .note-form {
      background: #ffffff;
      border: 1px solid #e8e8e0;
      border-radius: 0.9rem;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
      transition: box-shadow 0.2s;
    }
    .note-form:focus-within {
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
      border-color: #cecec0;
    }

    .note-form input[type="text"],
    .note-form textarea {
      width: 100%;
      border: 1px solid #e4e4db;
      border-radius: 0.5rem;
      padding: 0.75rem 0.9rem;
      font-family: inherit;
      font-size: 0.92rem;
      background: #fcfcf9;
      outline: none;
      resize: vertical;
      transition: border 0.2s, background 0.2s;
    }
    .note-form textarea { min-height: 85px; }
    .note-form input:focus, .note-form textarea:focus {
      border-color: #b8b8a8;

    .form-row {
      display: flex;

      display: inline-flex;
      align-items: center;

      padding: 0.5rem 1rem;
      background: #f2f2e9;
      border-radius: 0.45rem;
      font-size: 0.82rem;
      cursor: pointer;
      border: 1px solid #dbdbcf;
      transition: background 0.2s;
      font-weight: 500;
    }
    .file-label:hover { background: #e8e8db; }

    #imageInput { display: none; }
    .img-preview-name {
      font-size: 0.75rem;

      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Note cards */
    .note-cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-card {
      background: #ffffff;
      border: 1px solid #eaeae2;
      border-radius: 0.8rem;
      padding: 1.2rem 1.3rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      animation: cardIn 0.35s ease both;

      border-color: #c8c8b9;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      transform: translateY(-1px);

    .note-title { font-weight: 600; font-size: 1.05rem; letter-spacing: -0.01em; }
    .note-content { color: #444; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
    .note-image {
      margin-top: 0.4rem;
      border-radius: 0.5rem;
      max-width: 100%;
      max-height: 220px;
      object-fit: cover;
      border: 1px solid #e6e6dd;
      transition: transform 0.2s;
    }
    .note-image:hover { transform: scale(1.01); }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #777;
      margin-top: 0.2rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .move-select {
      padding: 0.3rem 0.45rem;
      border-radius: 0.35rem;
      border: 1px solid #d5d5ca;
      font-size: 0.75rem;
      background: #fafaf7;
      font-family: inherit;
      cursor: pointer;
    }

    .empty-message {
      text-align: center;
      padding: 3rem 1.5rem;
      color: #8a8a8a;
      background: #fdfdfb;
      border-radius: 0.8rem;
      border: 1px dashed #d8d8cd;
      font-size: 0.95rem;
      animation: cardIn 0.4s ease;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1c1c1c;
      color: #f5f5f0;
      padding: 0.7rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 999;
      animation: toastIn 0.3s ease, toastOut 0.3s 1.5s ease forwards;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-8px); } }

    @media (max-width: 750px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <header class="app-header">
    <h1>📁 Thư mục ghi chú <span id="totalCount">0</span></h1>
    <button class="btn btn-outline btn-sm" id="addFolderBtn">➕ Thư mục mới</button>
  </header>

  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><h2>Thư mục</h2></div>
      <ul class="folder-list" id="folderList"></ul>
      <div class="add-folder-row" id="folderInputRow" style="display:none;">
        <input type="text" id="newFolderName" placeholder="Tên thư mục..." maxlength="40" />
        <button class="btn btn-sm btn-primary" id="confirmAddFolder">✓</button>
        <button class="btn btn-sm btn-outline" id="cancelAddFolder">✕</button>
      </div>
    </aside>

    <main class="notes-area">
      <div class="current-folder-title" id="currentFolderTitle">📄 Tất cả ghi chú</div>
      <div class="note-form">
        <input type="text" id="noteTitle" placeholder="Tiêu đề ghi chú" maxlength="120" />
        <textarea id="noteContent" placeholder="Nội dung..."></textarea>
        <div class="form-row">
          <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
            <label for="imageInput" class="file-label">🖼️ Ảnh</label>
            <input type="file" id="imageInput" accept="image/*" />
            <span class="img-preview-name" id="imgPreviewName"></span>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn btn-outline btn-sm" id="cancelEditBtn" style="display:none;">Huỷ</button>
            <button class="btn btn-primary" id="saveNoteBtn">➕ Thêm</button>
          </div>
        </div>
      </div>
      <div class="note-cards" id="notesContainer"></div>
    </main>
  </div>
</div>

<script>
  (() => {
    // ===== DỮ LIỆU =====
    let folders = [
      { id: 'folder_all', name: 'Tất cả', isDefault: true },
      { id: 'folder_1', name: 'Cá nhân' },
      { id: 'folder_2', name: 'Công việc' }
    ];
    let notes = [];
    let currentFolderId = 'folder_all';
    let editingNoteId = null;
    let selectedImageData = null;
    let nextFolderId = 3;

    // Dữ liệu mẫu
    function seedData() {
      notes.push(
        { id: 1001, folderId: 'folder_1', title: 'Nhật ký', content: 'Hôm nay trời đẹp, đi dạo công viên.', image: null, createdAt: Date.now() - 200000 },
        { id: 1002, folderId: 'folder_2', title: 'Họp dự án', content: 'Chuẩn bị slide thuyết trình.', image: null, createdAt: Date.now() - 100000 },
        { id: 1003, folderId: 'folder_all', title: 'Ghi chú nhanh', content: 'Mua sữa, trứng, bánh mì.', image: null, createdAt: Date.now() }
      );
    }
    seedData();

    // ===== DOM =====
    const folderListEl = document.getElementById('folderList');
    const folderInputRow = document.getElementById('folderInputRow');
    const newFolderNameInput = document.getElementById('newFolderName');
    const addFolderBtn = document.getElementById('addFolderBtn');
    const confirmAddFolderBtn = document.getElementById('confirmAddFolder');
    const cancelAddFolderBtn = document.getElementById('cancelAddFolder');
    const currentFolderTitle = document.getElementById('currentFolderTitle');
    const noteTitleInput = document.getElementById('noteTitle');
    const noteContentInput = document.getElementById('noteContent');
    const imageInput = document.getElementById('imageInput');
    const imgPreviewName = document.getElementById('imgPreviewName');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const notesContainer = document.getElementById('notesContainer');
    const totalCountEl = document.getElementById('totalCount');

    // ===== TOAST =====
    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    // ===== ESCAPE HTML =====
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ===== RENDER THƯ MỤC =====
    function renderFolders() {
      folderListEl.innerHTML = folders.map(f => {
        const count = (f.id === 'folder_all') ? notes.length : notes.filter(n => n.folderId === f.id).length;
        const activeClass = (currentFolderId === f.id) ? 'active' : '';
        return `
          <li class="folder-item ${activeClass}" data-folder-id="${f.id}">
            <span class="folder-name-click" style="flex:1; display:flex; align-items:center; cursor:pointer;">
              ${f.isDefault ? '📁' : '📂'} ${escapeHtml(f.name)}
              <span class="folder-badge">${count}</span>
            </span>
            ${!f.isDefault ? `
            <span class="folder-actions">
              <button class="icon-btn edit-folder-btn" data-id="${f.id}" title="Sửa tên">✎</button>
              <button class="icon-btn delete-folder-btn" data-id="${f.id}" title="Xoá thư mục">🗑</button>
            </span>` : ''}
          </li>
        `;
      }).join('');

      // Gắn sự kiện click vào tên thư mục
      document.querySelectorAll('.folder-name-click').forEach(el => {
        el.addEventListener('click', function(e) {
          const folderId = this.closest('.folder-item').dataset.folderId;
          if (folderId) selectFolder(folderId);
        });
      });

      // Sửa tên thư mục
      document.querySelectorAll('.edit-folder-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const folderId = this.dataset.id;
          const folder = folders.find(f => f.id === folderId);
          if (!folder) return;
          const newName = prompt('Nhập tên mới cho thư mục:', folder.name);
          if (newName && newName.trim() !== '') {
            folder.name = newName.trim();
            renderFolders();
            updateCurrentFolderTitle();
            showToast('✅ Đã đổi tên thư mục');
          }
        });
      });

      // Xoá thư mục
      document.querySelectorAll('.delete-folder-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const folderId = this.dataset.id;
          if (!confirm('Xoá thư mục này? Tất cả ghi chú trong thư mục sẽ được chuyển về "Tất cả".')) return;
          // Chuyển ghi chú về folder_all
          notes.forEach(n => {
            if (n.folderId === folderId) n.folderId = 'folder_all';
          });
          // Xoá thư mục
          folders = folders.filter(f => f.id !== folderId);
          // Nếu đang xem thư mục bị xoá thì quay về Tất cả
          if (currentFolderId === folderId) {
            currentFolderId = 'folder_all';
          }
          renderFolders();
          renderNotes();
          updateCurrentFolderTitle();
          showToast('🗑 Đã xoá thư mục');
        });
      });

      // Cập nhật tổng số ghi chú
      totalCountEl.textContent = notes.length;
    }

    // ===== CHỌN THƯ MỤC =====
    function selectFolder(folderId) {
      currentFolderId = folderId;
      if (editingNoteId !== null) exitEditMode();
      renderFolders();
      renderNotes();
      updateCurrentFolderTitle();
    }

    function updateCurrentFolderTitle() {
      const folder = folders.find(f => f.id === currentFolderId);
      currentFolderTitle.textContent = folder ? `📄 ${folder.name}` : '📄 Ghi chú';
    }

    // ===== THÊM THƯ MỤC MỚI =====
    addFolderBtn.addEventListener('click', function() {
      folderInputRow.style.display = 'flex';
      newFolderNameInput.value = '';
      newFolderNameInput.focus();
    });

    cancelAddFolderBtn.addEventListener('click', function() {
      folderInputRow.style.display = 'none';
      newFolderNameInput.value = '';
    });

    confirmAddFolderBtn.addEventListener('click', function() {
      const name = newFolderNameInput.value.trim();
      if (!name) {
        alert('Vui lòng nhập tên thư mục.');
        return;
      }
      const newFolder = {
        id: 'folder_' + nextFolderId,
        name: name
      };
      nextFolderId++;
      folders.push(newFolder);
      folderInputRow.style.display = 'none';
      newFolderNameInput.value = '';
      renderFolders();
      showToast('📁 Đã tạo thư mục: ' + name);
    });

    // Cho phép nhấn Enter để thêm thư mục
    newFolderNameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        confirmAddFolderBtn.click();
      }
    });

    // ===== LẤY DANH SÁCH GHI CHÚ HIỆN TẠI =====
    function getCurrentNotes() {
      if (currentFolderId === 'folder_all
