<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bản đồ thời tiết thế giới</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #1a1d23;
      color: #e0e0e0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    /* Top bar */
    .top-bar {
      background: #22262e;
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-bottom: 1px solid #333840;
      z-index: 1000;
      animation: slideDown 0.5s ease;
    }
    .top-bar h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .top-bar h1 .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 0.4rem;
      font-weight: 500;
      font-size: 0.82rem;
      border: 1px solid #3a3f4a;
      cursor: pointer;
      background: #2a2f3a;
      color: #d0d0d0;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:hover {
      background: #353b48;
      border-color: #5a5f6a;
      color: #fff;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }
    .btn-storm {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }
    .btn-storm:hover {
      background: #dc2626;
    }

    /* Map container */
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    /* Panel bên phải */
    .side-panel {
      position: absolute;
      top: 80px;
      right: 15px;
      width: 300px;
      max-height: calc(100vh - 120px);
      background: #22262e;
      border: 1px solid #333840;
      border-radius: 0.8rem;
      padding: 1rem;
      z-index: 999;
      overflow-y: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      animation: slideDown 0.5s 0.2s ease both;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .side-panel h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
      border-bottom: 1px solid #333840;
      padding-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .city-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.6rem;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 0.85rem;
      border: 1px solid transparent;
    }
    .city-item:hover {
      background: #2a2f3a;
      border-color: #3a3f4a;
    }
    .city-name {
      font-weight: 500;
    }
    .city-temp {
      font-weight: 600;
      color: #fbbf24;
    }
    .storm-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .storm-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.5rem;
      background: #2a1a1a;
      border-radius: 0.4rem;
      border: 1px solid #4a2020;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .storm-item:hover {
      background: #3a2020;
    }
    .storm-cat {
      font-weight: 700;
      color: #fca5a5;
      min-width: 28px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: #aaa;
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Leaflet overrides */
    .leaflet-container {
      background: #1a1d23 !important;
    }
    .leaflet-control-zoom a {
      background: #2a2f3a !important;
      color: #e0e0e0 !important;
      border-color: #3a3f4a !important;
    }
    .leaflet-popup-content-wrapper {
      background: #22262e;
      color: #e0e0e0;
      border-radius: 0.6rem;
      border: 1px solid #3a3f4a;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }
    .leaflet-popup-tip {
      background: #22262e;
    }

    @media (max-width: 700px) {
      .side-panel {
        width: 260px;
        right: 5px;
        top: 75px;
        font-size: 0.8rem;
      }
      .top-bar h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Thanh trên cùng -->
  <div class="top-bar">
    <h1><span class="dot"></span> Bản đồ thời tiết toàn cầu</h1>
    <div class="controls">
      <button class="btn active" id="btnTemp">Nhiệt độ</button>
      <button class="btn" id="btnRain">Mưa</button>
      <button class="btn" id="btnWind">Gió</button>
      <button class="btn" id="btnSnow">Tuyết</button>
      <button class="btn btn-storm" id="btnStorm">Bão & Áp thấp</button>
      <button class="btn" id="btnReset">Đặt lại</button>
    </div>
  </div>

  <!-- Bản đồ -->
  <div id="map"></div>

  <!-- Panel thông tin bên phải -->
  <div class="side-panel" id="sidePanel">
    <h3>Thành phố lớn</h3>
    <div id="cityList"></div>
    <h3 style="margin-top:0.3rem;">Bão / Áp thấp đang hoạt động</h3>
    <div class="storm-list" id="stormList"></div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#fbbf24;"></span> Nhiệt độ</span>
      <span><span class="legend-dot" style="background:#3b82f6;"></span> Mưa</span>
      <span><span class="legend-dot" style="background:#10b981;"></span> Gió</span>
      <span><span class="legend-dot" style="background:#a78bfa;"></span> Tuyết</span>
      <span><span class="legend-dot" style="background:#ef4444;"></span> Bão</span>
    </div>
  </div>

  <script>
    (() => {
      // ===== DỮ LIỆU GIẢ TƯỞNG =====
      const cities = [
        { name: 'Hà Nội', lat: 21.0285, lng: 105.8542, temp: 32, condition: 'Nắng', rain: 0, wind: 12, snow: 0 },
        { name: 'Tokyo', lat: 35.6762, lng: 139.6503, temp: 22, condition: 'Mưa nhẹ', rain: 45, wind: 18, snow: 0 },
        { name: 'New York', lat: 40.7128, lng: -74.006, temp: 15, condition: 'Nhiều mây', rain: 20, wind: 25, snow: 0 },
        { name: 'London', lat: 51.5074, lng: -0.1278, temp: 11, condition: 'Mưa', rain: 70, wind: 30, snow: 0 },
        { name: 'Moscow', lat: 55.7558, lng: 37.6173, temp: -5, condition: 'Tuyết rơi', rain: 0, wind: 15, snow: 80 },
        { name: 'Sydney', lat: -33.8688, lng: 151.2093, temp: 28, condition: 'Nắng', rain: 0, wind: 10, snow: 0 },
        { name: 'Rio de Janeiro', lat: -22.9068, lng: -43.1729, temp: 31, condition: 'Nắng nóng', rain: 5, wind: 8, snow: 0 },
        { name: 'Cairo', lat: 30.0444, lng: 31.2357, temp: 38, condition: 'Nắng gắt', rain: 0, wind: 6, snow: 0 },
        { name: 'Bắc Kinh', lat: 39.9042, lng: 116.4074, temp: 18, condition: 'Sương mù', rain: 10, wind: 8, snow: 0 },
        { name: 'Delhi', lat: 28.6139, lng: 77.209, temp: 42, condition: 'Nắng nóng', rain: 0, wind: 5, snow: 0 },
        { name: 'Paris', lat: 48.8566, lng: 2.3522, temp: 14, condition: 'Nhiều mây', rain: 30, wind: 20, snow: 0 },
        { name: 'Seoul', lat: 37.5665, lng: 126.978, temp: 20, condition: 'Mưa rào', rain: 55, wind: 22, snow: 0 },
      ];

      // Bão giả tưởng
      let storms = [
        { id: 1, name: 'Bão TALA', lat: 16.5, lng: 118.2, cat: 3, windSpeed: 185, movement: 'Tây Bắc', pressure: 945 },
        { id: 2, name: 'Bão NORU', lat: 28.3, lng: -88.5, cat: 4, windSpeed: 220, movement: 'Bắc', pressure: 920 },
        { id: 3, name: 'Áp thấp 06W', lat: 12.8, lng: 142.3, cat: 1, windSpeed: 65, movement: 'Tây', pressure: 995 },
        { id: 4, name: 'Bão LIDIA', lat: 18.1, lng: -108.4, cat: 2, windSpeed: 155, movement: 'Đông Bắc', pressure: 970 },
      ];

      let currentOverlay = 'temp'; // temp, rain, wind, snow, storm
      let map;
      let cityMarkers = [];
      let stormMarkers = [];
      let stormPolylines = [];
      let imageOverlay; // Lớp ảnh bản đồ

      // ===== KHỞI TẠO BẢN ĐỒ =====
      function initMap() {
        map = L.map('map', {
          center: [15, 20],
          zoom: 2.5,
          minZoom: 2,
          maxZoom: 8,
          zoomControl: true,
          attributionControl: false,
          // Giới hạn kéo để tránh lộ viền ảnh quá nhiều
          maxBounds: [
            [-85, -250],
            [85, 250]
          ],
          maxBoundsViscosity: 0.8,
        });

        // Sử dụng ảnh bản đồ của bạn làm lớp nền
        imageOverlay = L.imageOverlay(
          'https://i.ibb.co/dhCgk7h/IMG-20260512-160553.png',
          // Tọa độ giới hạn cho ảnh bản đồ thế giới
          // Bạn có thể điều chỉnh 4 con số này nếu ảnh bị lệch
          [
            [-85, -250],
            [85, 250]
          ], {
            opacity: 1.0,
            attribution: 'Bản đồ tùy chỉnh',
            interactive: false,
          }
        ).addTo(map);

        // Thêm tile layer mờ phía sau để có tọa độ tham chiếu
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
          subdomains: 'abcd',
          maxZoom: 8,
          opacity: 0.3,
        }).addTo(map);

        renderAll();
        setInterval(simulateWeather, 4000);
        setInterval(moveStorms, 5000);
      }

      // ===== RENDER THÀNH PHỐ =====
      function renderCities() {
        cityMarkers.forEach(m => map.removeLayer(m));
        cityMarkers = [];

        cities.forEach(city => {
          let color = '#fbbf24';
          if (currentOverlay === 'rain') color = '#3b82f6';
          else if (currentOverlay === 'wind') color = '#10b981';
          else if (currentOverlay === 'snow') color = '#a78bfa';
          else if (currentOverlay === 'storm') color = '#ef4444';

          const value = currentOverlay === 'temp' ? `${Math.round(city.temp)}°C` :
            currentOverlay === 'rain' ? `${Math.round(city.rain)}mm` :
            currentOverlay === 'wind' ? `${Math.round(city.wind)}km/h` :
            currentOverlay === 'snow' ? `${Math.round(city.snow)}%` :
            `${Math.round(city.temp)}°C`;

          const iconHtml =
            `<div style="background:${color};color:#000;font-weight:700;padding:3px 8px;border-radius:12px;font-size:11px;white-space:nowrap;border:1px solid rgba(255,255,255,0.3);box-shadow:0 2px 6px rgba(0,0,0,0.5);">${value}</div>`;

          const icon = L.divIcon({
            html: iconHtml,
            className: '',
            iconSize: [60, 24],
            iconAnchor: [30, 12],
          });

          const marker = L.marker([city.lat, city.lng], { icon }).addTo(map);
          marker.bindPopup(`
            <div style="font-family:Inter,sans-serif;">
              <b style="font-size:1rem;">${city.name}</b><br/>
              <span style="color:#fbbf24;">🌡 ${Math.round(city.temp)}°C</span> · ${city.condition}<br/>
              💧 Mưa: ${Math.round(city.rain)}mm · 💨 Gió: ${Math.round(city.wind)}km/h<br/>
              ❄ Tuyết: ${Math.round(city.snow)}%
            </div>
          `);
          cityMarkers.push(marker);
        });
      }

      // ===== RENDER BÃO =====
      function renderStorms() {
        stormMarkers.forEach(m => map.removeLayer(m));
        stormPolylines.forEach(p => map.removeLayer(p));
        stormMarkers = [];
        stormPolylines = [];

        storms.forEach(storm => {
          const catColor = storm.cat >= 4 ? '#ff4444' : storm.cat >= 2 ? '#ff8800' : '#ffcc00';
          const icon = L.divIcon({
            html: `<div style="
              width:${24 + storm.cat * 4}px;height:${24 + storm.cat * 4}px;
              background:${catColor};border-radius:50%;opacity:0.8;
              border:2px solid #fff;box-shadow:0 0 ${10 + storm.cat * 5}px ${catColor};
              animation: pulse 1.5s infinite;
            "></div>`,
            className: '',
            iconSize: [36 + storm.cat * 4, 36 + storm.cat * 4],
            iconAnchor: [18 + storm.cat * 2, 18 + storm.cat * 2],
          });

          const marker = L.marker([storm.lat, storm.lng], { icon }).addTo(map);
          marker.bindPopup(`
            <div style="font-family:Inter,sans-serif;">
              <b style="font-size:1rem;color:#fca5a5;">🌀 ${storm.name}</b><br/>
              Cấp: <span style="color:#fbbf24;font-weight:700;">${storm.cat}</span> ·
              Gió: ${storm.windSpeed}km/h<br/>
              Áp suất: ${storm.pressure}hPa<br/>
              Hướng: ${storm.movement}
            </div>
          `);
          stormMarkers.push(marker);

          // Đường dự báo hướng di chuyển
          const destLat = storm.lat + (storm.movement.includes('Bắc') ? 2 : storm.movement.includes('Nam') ? -2 : 0);
          const destLng = storm.lng + (storm.movement.includes('Đông') ? 2 : storm.movement.includes('Tây') ? -2 : 0);
          const line = L.polyline([
            [storm.lat, storm.lng],
            [destLat, destLng]
          ], {
            color: catColor,
            weight: 2,
            dashArray: '8 6',
            opacity: 0.6,
          }).addTo(map);
          stormPolylines.push(line);
        });
      }

      // ===== RENDER PANEL =====
      function renderPanel() {
        const cityList = document.getElementById('cityList');
        cityList.innerHTML = cities.map(c => `
          <div class="city-item" data-lat="${c.lat}" data-lng="${c.lng}">
            <span class="city-name">${c.name}</span>
            <span class="city-temp">${Math.round(c.temp)}°C</span>
          </div>
        `).join('');

        document.querySelectorAll('.city-item').forEach(el => {
          el.addEventListener('click', function() {
            const lat = parseFloat(this.dataset.lat);
            const lng = parseFloat(this.dataset.lng);
            map.flyTo([lat, lng], 6, { duration: 1.5 });
          });
        });

        updateStormList();
      }

      function updateStormList() {
        const stormList = document.getElementById('stormList');
        if (!stormList) return;
        stormList.innerHTML = storms.map(s => `
          <div class="storm-item" data-lat="${s.lat}" data-lng="${s.lng}">
            <span class="storm-cat">C${s.cat}</span>
            <span>${s.name}</span>
            <span style="margin-left:auto;color:#fbbf24;">${s.windSpeed}km/h</span>
          </div>
        `).join('');
        document.querySelectorAll('.storm-item').forEach(el => {
          el.addEventListener('click', function() {
            const lat = parseFloat(this.dataset.lat);
            const lng = parseFloat(this.dataset.lng);
            map.flyTo([lat, lng], 5, { duration: 1.5 });
          });
        });
      }

      function renderAll() {
        renderCities();
        renderStorms();
        renderPanel();
      }

      // ===== MÔ PHỎNG THAY ĐỔI THỜI TIẾT =====
      function simulateWeather() {
        cities.forEach(c => {
          c.temp = Math.max(-10, Math.min(45, c.temp + (Math.random() - 0.5) * 3));
          c.rain = Math.max(0, Math.min(100, c.rain + (Math.random() - 0.5) * 15));
          c.wind = Math.max(0, Math.min(60, c.wind + (Math.random() - 0.5) * 8));
          c.snow = Math.max(0, Math.min(100, c.snow + (Math.random() - 0.5) * 10));
          c.temp = Math.round(c.temp * 10) / 10;
          c.rain = Math.round(c.rain);
          c.wind = Math.round(c.wind);
          c.snow = Math.round(c.snow);
        });
        renderCities();
        renderPanel();
      }

      // ===== DI CHUYỂN BÃO =====
      function moveStorms() {
        storms.forEach(s => {
          const dLat = (Math.random() - 0.4) * 1.2;
          const dLng = (Math.random() - 0.5) * 1.5;
          s.lat = Math.max(-60, Math.min(60, s.lat + dLat));
          s.lng = ((s.lng + dLng + 540) % 360) - 180;
          s.windSpeed = Math.max(40, Math.min(280, s.windSpeed + (Math.random() - 0.5) * 20));
          s.windSpeed = Math.round(s.windSpeed);
          s.pressure = Math.round(s.pressure + (Math.random() - 0.5) * 10);
          if (s.cat === 1 && s.windSpeed > 118) s.cat = 2;
          else if (s.cat === 2 && s.windSpeed > 153) s.cat = 3;
          else if (s.cat === 3 && s.windSpeed > 178) s.cat = 4;
          else if (s.cat === 4 && s.windSpeed > 209) s.cat = 5;
          else if (s.cat >= 2 && s.windSpeed < 100) s.cat = 1;
        });
        renderStorms();
        updateStormList();
      }

      // ===== NÚT ĐIỀU KHIỂN =====
      document.getElementById('btnTemp').addEventListener('click', function() {
        setActiveButton(this);
        currentOverlay = 'temp';
        renderCities();
      });
      document.getElementById('btnRain').addEventListener('click', function() {
        setActiveButton(this);
        currentOverlay = 'rain';
        renderCities();
      });
      document.getElementById('btnWind').addEventListener('click', function() {
        setActiveButton(this);
        currentOverlay = 'wind';
        renderCities();
      });
      document.getElementById('btnSnow').addEventListener('click', function() {
        setActiveButton(this);
        currentOverlay = 'snow';
        renderCities();
      });
      document.getElementById('btnStorm').addEventListener('click', function() {
        setActiveButton(this);
        currentOverlay = 'storm';
        map.flyTo([16, 115], 3.5, { duration: 1.5 });
        renderCities();
      });
      document.getElementById('btnReset').addEventListener('click', function() {
        setActiveButton(document.getElementById('btnTemp'));
        currentOverlay = 'temp';
        map.flyTo([15, 20], 2.5, { duration: 1.5 });
        renderCities();
      });

      function setActiveButton(activeBtn) {
        document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
      }

      // ===== KHỞI ĐỘNG =====
      initMap();
    })();
  </script>
</body>
</html>
