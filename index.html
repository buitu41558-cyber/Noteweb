<script>
    const firebaseConfig = {
        apiKey: "", authDomain: "", databaseURL: "",
        projectId: "", storageBucket: "", messagingSenderId: "", appId: ""
    };

    let db = null;
    let isFirebaseActive = false;

    try {
        if (firebaseConfig.databaseURL) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            isFirebaseActive = true;
            document.getElementById('db-status-dot').className = "w-2 h-2 rounded-full bg-emerald-500";
        } else {
            document.getElementById('db-status-dot').className = "w-2 h-2 rounded-full bg-gray-500";
        }
    } catch (e) {}

    let state = {
        isAdmin: false,
        currentTeamId: null,
        teams: [],
        players: [],
        squad: Array(11).fill(null),
        formation: "4-3-3",
        selectedPlayerId: null
    };

    window.onload = function() {
        loadData();
        renderApp();
        initMatchCanvas();
    };

    function saveData() {
        if (isFirebaseActive && db) {
            db.ref('victoria_data').set({ teams: state.teams, players: state.players });
        } else {
            localStorage.setItem('victoria_teams', JSON.stringify(state.teams));
            localStorage.setItem('victoria_players', JSON.stringify(state.players));
        }
    }

    function loadData() {
        if (isFirebaseActive && db) {
            db.ref('victoria_data').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    state.teams = val.teams || [];
                    state.players = val.players || [];
                    renderApp();
                }
            });
        } else {
            state.teams = JSON.parse(localStorage.getItem('victoria_teams')) || [];
            state.players = JSON.parse(localStorage.getItem('victoria_players')) || [];
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById('tab-' + tabId).classList.remove('hidden');

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-gray-700', 'text-white');
            btn.classList.add('text-gray-300');
        });
        const activeBtn = document.getElementById('btn-' + tabId);
        if(activeBtn) {
            activeBtn.classList.add('bg-gray-700', 'text-white');
            activeBtn.classList.remove('text-gray-300');
        }
    }

    function toggleAdminLogin() {
        if (state.isAdmin) {
            state.isAdmin = false;
            updateAdminState();
        } else {
            document.getElementById('login-modal').classList.remove('hidden');
        }
    }

    function closeAdminLogin() {
        document.getElementById('login-modal').classList.add('hidden');
    }

    function submitAdminLogin() {
        const pass = document.getElementById('admin-pass-input').value;
        if (pass === 'admin123') {
            state.isAdmin = true;
            closeAdminLogin();
            document.getElementById('admin-pass-input').value = '';
            updateAdminState();
        } else {
            alert('Mật khẩu k đúng!');
        }
    }

    function updateAdminState() {
        const roleLabel = document.getElementById('role-label');
        const authBtn = document.getElementById('auth-btn');
        const adminLockMsg = document.getElementById('admin-lock-msg');
        const adminContent = document.getElementById('admin-panel-content');

        if (state.isAdmin) {
            roleLabel.textContent = "Admin";
            roleLabel.className = "text-emerald-400 font-bold";
            authBtn.innerHTML = `<i class="fa-solid fa-lock-open"></i> Đăng xuất Admin`;
            adminLockMsg.classList.add('hidden');
            adminContent.classList.remove('hidden');
        } else {
            roleLabel.textContent = "Người chơi";
            roleLabel.className = "text-gray-200";
            authBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Đăng nhập Admin`;
            adminLockMsg.classList.remove('hidden');
            adminContent.classList.add('hidden');
        }
    }

    function handleCreateTeam(e) {
        e.preventDefault();
        const name = document.getElementById('team-name-input').value;
        const fileInput = document.getElementById('team-logo-input');

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                state.teams.push({ id: 'team_' + Date.now(), name, logo: evt.target.result });
                saveData(); renderApp(); e.target.reset();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }
    }

    function handleCreatePlayer(e) {
        e.preventDefault();
        const name = document.getElementById('p-name').value;
        const pos = document.getElementById('p-pos').value;
        const teamId = document.getElementById('p-team').value;

        const pac = parseInt(document.getElementById('p-pac').value) || 0;
        const sho = parseInt(document.getElementById('p-sho').value) || 0;
        const pas = parseInt(document.getElementById('p-pas').value) || 0;
        const dri = parseInt(document.getElementById('p-dri').value) || 0;
        const def = parseInt(document.getElementById('p-def').value) || 0;
        const phy = parseInt(document.getElementById('p-phy').value) || 0;
        const ovr = Math.round((pac + sho + pas + dri + def + phy) / 6);

        const fileInput = document.getElementById('p-avatar');
        const savePlayer = (avatar) => {
            state.players.push({ id: 'p_' + Date.now(), name, pos, teamId, ovr, pac, sho, pas, dri, def, phy, avatar });
            saveData(); renderApp(); e.target.reset();
        };

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = (evt) => savePlayer(evt.target.result);
            reader.readAsDataURL(fileInput.files[0]);
        } else { savePlayer(''); }
    }

    function deletePlayer(id) {
        if (!state.isAdmin) return;
        state.players = state.players.filter(p => p.id !== id);
        saveData(); renderApp();
    }

    function selectTeam(teamId) {
        state.currentTeamId = teamId;
        state.squad = Array(11).fill(null);
        state.selectedPlayerId = null;
        renderApp();
    }

    function renderApp() {
        const teamsGrid = document.getElementById('teams-grid');
        teamsGrid.innerHTML = '';
        const pTeamSelect = document.getElementById('p-team');
        pTeamSelect.innerHTML = '<option value="">-- Chọn Đội bóng --</option>';

        const simTeamA = document.getElementById('sim-team-a-select');
        const simTeamB = document.getElementById('sim-team-b-select');
        const valA = simTeamA.value;
        const valB = simTeamB.value;

        simTeamA.innerHTML = '<option value="">-- Chọn Đội Nhà --</option>';
        simTeamB.innerHTML = '<option value="">-- Chọn Đội Khách --</option>';

        state.teams.forEach(t => {
            const isSelected = t.id === state.currentTeamId;
            teamsGrid.innerHTML += `
                <div class="p-3 flex flex-col items-center gap-2 bg-gray-800 rounded border ${isSelected ? 'border-emerald-500' : 'border-gray-700'}">
                    <img src="${t.logo}" class="w-12 h-12 object-contain rounded bg-gray-900 p-1" alt="">
                    <div class="text-center">
                        <div class="font-bold text-white text-xs">${t.name}</div>
                        <div class="text-[10px] text-gray-400">${state.players.filter(p=>p.teamId === t.id).length} cầu thủ</div>
                    </div>
                    <button onclick="selectTeam('${t.id}')" class="w-full ${isSelected ? 'bg-emerald-700' : 'bg-gray-700 hover:bg-gray-600'} text-white text-xs py-1 rounded transition">
                        ${isSelected ? 'Đã chọn' : 'Chọn đội'}
                    </button>
                </div>
            `;
            pTeamSelect.innerHTML += `<option value="${t.id}">${t.name}</option>`;
            simTeamA.innerHTML += `<option value="${t.id}">${t.name}</option>`;
            simTeamB.innerHTML += `<option value="${t.id}">${t.name}</option>`;
        });

        simTeamA.value = valA;
        simTeamB.value = valB;

        const currentTeam = state.teams.find(t => t.id === state.currentTeamId);
        document.getElementById('dash-my-team').textContent = currentTeam ? currentTeam.name : 'Chưa chọn';
        document.getElementById('dash-total-players').textContent = state.players.length;

        renderAdminTable();
        renderSquadSection();
    }

    function renderAdminTable() {
        const tbody = document.getElementById('admin-players-table');
        tbody.innerHTML = '';
        state.players.forEach(p => {
            const team = state.teams.find(t => t.id === p.teamId);
            tbody.innerHTML += `
                <tr>
                    <td class="p-2 flex items-center gap-2 font-medium text-white">
                        <div class="w-6 h-6 rounded-full bg-gray-700 overflow-hidden flex items-center justify-center shrink-0">
                            ${p.avatar ? `<img src="${p.avatar}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-user text-[10px]"></i>'}
                        </div>
                        ${p.name}
                    </td>
                    <td class="p-2 font-bold text-gray-300">${p.pos}</td>
                    <td class="p-2">${team ? team.name : 'N/A'}</td>
                    <td class="p-2 font-bold text-emerald-400">${p.ovr}</td>
                    <td class="p-2 text-gray-400">${p.pac}/${p.sho}/${p.pas}/${p.dri}/${p.def}/${p.phy}</td>
                    <td class="p-2"><button onclick="deletePlayer('${p.id}')" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button></td>
                </tr>
            `;
        });
    }

    const formationCoords = {
        "4-3-3": [
            {top: '85%', left: '50%', pos: 'GK'},
            {top: '68%', left: '20%', pos: 'LB'}, {top: '72%', left: '38%', pos: 'CB'}, {top: '72%', left: '62%', pos: 'CB'}, {top: '68%', left: '80%', pos: 'RB'},
            {top: '48%', left: '30%', pos: 'CM'}, {top: '52%', left: '50%', pos: 'CDM'}, {top: '48%', left: '70%', pos: 'CM'},
            {top: '22%', left: '20%', pos: 'LW'}, {top: '18%', left: '50%', pos: 'ST'}, {top: '22%', left: '80%', pos: 'RW'}
        ],
        "4-2-3-1": [
            {top: '85%', left: '50%', pos: 'GK'},
            {top: '68%', left: '20%', pos: 'LB'}, {top: '72%', left: '38%', pos: 'CB'}, {top: '72%', left: '62%', pos: 'CB'}, {top: '68%', left: '80%', pos: 'RB'},
            {top: '54%', left: '35%', pos: 'CDM'}, {top: '54%', left: '65%', pos: 'CDM'},
            {top: '34%', left: '25%', pos: 'CAM'}, {top: '32%', left: '50%', pos: 'CAM'}, {top: '34%', left: '75%', pos: 'CAM'},
            {top: '16%', left: '50%', pos: 'ST'}
        ],
        "4-4-2": [
            {top: '85%', left: '50%', pos: 'GK'},
            {top: '68%', left: '20%', pos: 'LB'}, {top: '72%', left: '38%', pos: 'CB'}, {top: '72%', left: '62%', pos: 'CB'}, {top: '68%', left: '80%', pos: 'RB'},
            {top: '45%', left: '18%', pos: 'LM'}, {top: '48%', left: '38%', pos: 'CM'}, {top: '48%', left: '62%', pos: 'CM'}, {top: '45%', left: '82%', pos: 'RM'},
            {top: '20%', left: '35%', pos: 'ST'}, {top: '20%', left: '65%', pos: 'ST'}
        ]
    };

    function changeFormation() {
        state.formation = document.getElementById('formation-select').value;
        renderSquadSection();
    }

    function selectPlayerForPosition(id) {
        if (state.selectedPlayerId === id) {
            state.selectedPlayerId = null;
        } else {
            state.selectedPlayerId = id;
        }
        renderSquadSection();
    }

    function handleSlotClick(slotIndex) {
        const coords = formationCoords[state.formation];
        const slotPos = coords[slotIndex].pos;

        if (!state.selectedPlayerId) {
            if (state.squad[slotIndex]) {
                state.squad[slotIndex] = null;
                renderSquadSection();
            }
            return;
        }

        const player = state.players.find(p => p.id === state.selectedPlayerId);
        if (!player) return;

        if (slotPos === 'GK' && player.pos !== 'GK') {
            alert('Cầu thủ này k phải GK, k thể đá vị trí GK!');
            return;
        }
        if (slotPos !== 'GK' && player.pos === 'GK') {
            alert('Thủ môn (GK) k thể đá các vị trí khác ngoài GK!');
            return;
        }

        const oldIndex = state.squad.findIndex(s => s && s.id === player.id);
        if (oldIndex !== -1) {
            state.squad[oldIndex] = null;
        }

        state.squad[slotIndex] = player;
        state.selectedPlayerId = null;
        renderSquadSection();
    }

    function renderSquadSection() {
        const slotsContainer = document.getElementById('formation-slots');
        slotsContainer.innerHTML = '';
        const coords = formationCoords[state.formation];
        let activeTeamPlayers = state.players.filter(p => p.teamId === state.currentTeamId);

        coords.forEach((coord, index) => {
            const assignedPlayer = state.squad[index];
            let labelText = coord.pos;
            if (assignedPlayer) {
                labelText = `${coord.pos} - ${assignedPlayer.name} (${assignedPlayer.pos})`;
            }

            slotsContainer.innerHTML += `
                <div style="top: ${coord.top}; left: ${coord.left};" 
                     onclick="handleSlotClick(${index})"
                     class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer group">
                    <div class="w-10 h-10 rounded-full bg-gray-900 border-2 ${assignedPlayer ? 'border-amber-400' : 'border-dashed border-white/60'} flex items-center justify-center overflow-hidden shadow group-hover:scale-110 transition">
                        ${assignedPlayer && assignedPlayer.avatar 
                            ? `<img src="${assignedPlayer.avatar}" class="w-full h-full object-cover">` 
                            : `<span class="text-xs text-white font-bold">${assignedPlayer ? assignedPlayer.name.charAt(0) : coord.pos}</span>`}
                    </div>
                    <div class="bg-gray-900/90 px-1.5 py-0.5 rounded text-[10px] text-white mt-1 whitespace-nowrap border border-gray-700 shadow">
                        ${labelText}
                    </div>
                </div>
            `;
        });

        let totalOvr = 0, count = 0;
        state.squad.forEach(p => { if (p) { totalOvr += p.ovr; count++; } });
        document.getElementById('dash-team-ovr').textContent = count > 0 ? Math.round(totalOvr / count) : 0;

        const selectedPlayer = state.players.find(p => p.id === state.selectedPlayerId);
        document.getElementById('selected-player-tip').textContent = selectedPlayer ? `Đang chọn: ${selectedPlayer.name} (Click vị trí trên sân)` : '';

        const inventory = document.getElementById('squad-inventory');
        inventory.innerHTML = '';
        activeTeamPlayers.forEach(p => {
            const isAssigned = state.squad.some(s => s && s.id === p.id);
            const isSelected = state.selectedPlayerId === p.id;

            inventory.innerHTML += `
                <div class="p-2 rounded bg-gray-800 flex items-center justify-between border cursor-pointer transition ${isSelected ? 'border-amber-400 bg-amber-950/30' : 'border-gray-700 hover:bg-gray-700'}"
                     onclick="selectPlayerForPosition('${p.id}')">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full bg-gray-900 overflow-hidden flex items-center justify-center border border-gray-700 shrink-0">
                            ${p.avatar ? `<img src="${p.avatar}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-xs text-gray-400"></i>`}
                        </div>
                        <div>
                            <div class="text-xs text-white font-semibold flex items-center gap-1">
                                ${p.name}
                                ${isAssigned ? '<span class="text-[9px] bg-emerald-900 text-emerald-300 px-1 rounded">Đang đá</span>' : ''}
                            </div>
                            <div class="text-[10px] text-gray-400 font-bold">Vị trí: <span class="text-amber-400">${p.pos}</span> | OVR: ${p.ovr}</div>
                        </div>
                    </div>
                    <button class="text-[10px] font-medium px-2 py-1 rounded ${isSelected ? 'bg-amber-500 text-black font-bold' : 'bg-gray-700 text-gray-300'}">
                        ${isSelected ? 'Đang chọn' : 'Chọn'}
                    </button>
                </div>
            `;
        });
    }

    // --- MÔ PHỎNG TRẬN ĐẤU CẢI TIẾN ---
    let simCanvas, simCtx, simInterval = null, simTime = 0, simRunning = false;
    let ball = { x: 400, y: 240, vx: 0, vy: 0 };
    let referee = { x: 400, y: 200, color: "#facc15" };
    let teamA_players = [], teamB_players = [];
    let scoreA = 0, scoreB = 0;
    let setPieceTimer = 0; // Trạng thái chờ đặt lại vị trí khi phạt

    // Vị trí mặc định theo tỷ lệ sân (400x240 là tâm)
    const tacticalPositionsA = [
        { x: 30, y: 240 }, // GK
        { x: 120, y: 80 }, { x: 100, y: 170 }, { x: 100, y: 310 }, { x: 120, y: 400 }, // LB, CB, CB, RB
        { x: 220, y: 140 }, { x: 180, y: 240 }, { x: 220, y: 340 }, // CM, CDM, CM
        { x: 320, y: 80 }, { x: 340, y: 240 }, { x: 320, y: 400 }  // LW, ST, RW
    ];

    const tacticalPositionsB = [
        { x: 770, y: 240 }, // GK
        { x: 680, y: 80 }, { x: 700, y: 170 }, { x: 700, y: 310 }, { x: 680, y: 400 },
        { x: 580, y: 140 }, { x: 620, y: 240 }, { x: 580, y: 340 },
        { x: 480, y: 80 }, { x: 460, y: 240 }, { x: 480, y: 400 }
    ];

    function updateMatchTeams() { resetMatchSim(); }

    function initMatchCanvas() {
        simCanvas = document.getElementById('matchCanvas');
        simCtx = simCanvas.getContext('2d');
        drawPitch();
    }

    function drawPitch() {
        simCtx.fillStyle = "#22543d";
        simCtx.fillRect(0, 0, 800, 480);
        simCtx.strokeStyle = "rgba(255,255,255,0.7)";
        simCtx.lineWidth = 2;

        simCtx.strokeRect(15, 15, 770, 450);
        simCtx.beginPath(); simCtx.moveTo(400, 15); simCtx.lineTo(400, 465); simCtx.stroke();
        simCtx.beginPath(); simCtx.arc(400, 240, 50, 0, Math.PI * 2); simCtx.stroke();

        simCtx.fillStyle = "#ffffff";
        simCtx.fillRect(5, 190, 10, 100);
        simCtx.fillRect(785, 190, 10, 100);
    }

    function resetPlayersToTactical() {
        teamA_players.forEach((p, idx) => {
            p.x = tacticalPositionsA[idx].x;
            p.y = tacticalPositionsA[idx].y;
            p.vx = 0; p.vy = 0;
        });
        teamB_players.forEach((p, idx) => {
            p.x = tacticalPositionsB[idx].x;
            p.y = tacticalPositionsB[idx].y;
            p.vx = 0; p.vy = 0;
        });
    }

    function setupSimPlayers() {
        const teamAId = document.getElementById('sim-team-a-select').value;
        const teamBId = document.getElementById('sim-team-b-select').value;

        if (!teamAId || !teamBId) {
            alert("Cậu phải chọn đủ 2 đội bóng thi đấu đã!");
            return false;
        }
        if (teamAId === teamBId) {
            alert("Vui lòng chọn 2 đội khác nhau!");
            return false;
        }

        const pA = state.players.filter(p => p.teamId === teamAId);
        const pB = state.players.filter(p => p.teamId === teamBId);

        if (pA.length < 11 || pB.length < 11) {
            alert(`Chưa đủ cầu thủ! Đội A có ${pA.length}/11, Đội B có ${pB.length}/11 cầu thủ. Vào Bảng Admin thêm đủ 11 người mỗi đội nhé!`);
            return false;
        }

        teamA_players = pA.slice(0, 11).map((p, idx) => ({
            id: p.id, name: p.name, pos: p.pos,
            homeX: tacticalPositionsA[idx].x,
            homeY: tacticalPositionsA[idx].y,
            x: tacticalPositionsA[idx].x,
            y: tacticalPositionsA[idx].y,
            vx: 0, vy: 0, radius: 8, color: "#dc2626"
        }));

        teamB_players = pB.slice(0, 11).map((p, idx) => ({
            id: p.id, name: p.name, pos: p.pos,
            homeX: tacticalPositionsB[idx].x,
            homeY: tacticalPositionsB[idx].y,
            x: tacticalPositionsB[idx].x,
            y: tacticalPositionsB[idx].y,
            vx: 0, vy: 0, radius: 8, color: "#2563eb"
        }));

        referee.x = 400; referee.y = 200;
        ball = { x: 400, y: 240, vx: 0, vy: 0 };
        return true;
    }

    function triggerSetPiece(type, player, side) {
        setPieceTimer = 20; // Khóa 2 giây để xếp vị trí
        resetPlayersToTactical();

        if (type === 'penalty') {
            ball = side === 'A' ? { x: 700, y: 240, vx: 0, vy: 0 } : { x: 100, y: 240, vx: 0, vy: 0 };
            logMatchEvent(`<b>PENALTY!</b> <b>${player.name}</b> bước lên chấm phạt đền!`);
            if (side === 'A') {
                player.x = 680; player.y = 240;
                teamB_players[0].x = 780; teamB_players[0].y = 240; // GK Đội B bắt
            } else {
                player.x = 120; player.y = 240;
                teamA_players[0].x = 20; teamA_players[0].y = 240; // GK Đội A bắt
            }
        } else if (type === 'corner') {
            ball = side === 'A' ? { x: 780, y: 20, vx: 0, vy: 0 } : { x: 20, y: 20, vx: 0, vy: 0 };
            player.x = ball.x; player.y = ball.y;
            logMatchEvent(`<b>PHẠT GÓC!</b> <b>${player.name}</b> chuẩn bị thực hiện quả đá phạt góc.`);
        } else if (type === 'freekick') {
            logMatchEvent(`<b>ĐÁ PHẠT!</b> Cầu thủ hai đội vây quanh vị trí phạm lỗi của <b>${player.name}</b>.`);
        }
    }

    function toggleMatchSim() {
        if (simRunning) {
            clearInterval(simInterval);
            simRunning = false;
            document.getElementById('sim-start-btn').textContent = "Tiếp tục";
        } else {
            if (simTime === 0) {
                const ready = setupSimPlayers();
                if (!ready) return;
            }
            simRunning = true;
            document.getElementById('sim-start-btn').textContent = "Tạm dừng";
            simInterval = setInterval(updateMatchSim, 100);
        }
    }

    function resetMatchSim() {
        clearInterval(simInterval);
        simRunning = false; simTime = 0; scoreA = 0; scoreB = 0; setPieceTimer = 0;
        ball = { x: 400, y: 240, vx: 0, vy: 0 };
        document.getElementById('sim-score').textContent = "0 - 0";
        document.getElementById('sim-timer').textContent = "00:00 (Hiệp 1)";
        document.getElementById('sim-start-btn').textContent = "Bắt đầu";
        document.getElementById('sim-logs').innerHTML = `<div class="text-gray-500 italic">Trận đấu đã đặt lại.</div>`;
        drawPitch();
    }

    function logMatchEvent(msg) {
        const logs = document.getElementById('sim-logs');
        const minute = Math.floor(simTime / 60);
        logs.innerHTML = `<div><span class="text-gray-400">[${minute}']</span> ${msg}</div>` + logs.innerHTML;
    }

    function updateMatchSim() {
        simTime += 5;
        const mins = Math.floor(simTime / 60);
        const secs = simTime % 60;
        document.getElementById('sim-timer').textContent = `${mins < 10 ? '0'+mins : mins}:${secs < 10 ? '0'+secs : secs} ${mins > 45 ? '(Hiệp 2)' : '(Hiệp 1)'}`;

        const allPlayers = [...teamA_players, ...teamB_players];

        if (setPieceTimer > 0) {
            setPieceTimer--;
            drawPitch();
            renderSimEntities();
            return;
        }

        // TÌM CẦU THỦ GẦN BÓNG NHẤT MỖI ĐỘI
        let closestA = teamA_players[0], minDistA = 9999;
        teamA_players.forEach(p => {
            let d = Math.hypot(ball.x - p.x, ball.y - p.y);
            if (d < minDistA) { minDistA = d; closestA = p; }
        });

        let closestB = teamB_players[0], minDistB = 9999;
        teamB_players.forEach(p => {
            let d = Math.hypot(ball.x - p.x, ball.y - p.y);
            if (d < minDistB) { minDistB = d; closestB = p; }
        });

        // AI DI CHUYỂN GIỮ VỊ TRÍ CHIẾN THUẬT
        teamA_players.forEach(p => {
            let targetX = p.homeX + (ball.x - 400) * 0.3; // Dịch chuyển nhẹ theo bóng
            let targetY = p.homeY + (ball.y - 240) * 0.2;

            if (p === closestA && minDistA < 180) { // Chỉ lao vào nếu gần bóng
                targetX = ball.x; targetY = ball.y;
            }

            let dx = targetX - p.x, dy = targetY - p.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 5) {
                p.vx = (dx / dist) * 2.2;
                p.vy = (dy / dist) * 2.2;
            } else { p.vx = 0; p.vy = 0; }
            p.x += p.vx; p.y += p.vy;
        });

        teamB_players.forEach(p => {
            let targetX = p.homeX + (ball.x - 400) * 0.3;
            let targetY = p.homeY + (ball.y - 240) * 0.2;

            if (p === closestB && minDistB < 180) {
                targetX = ball.x; targetY = ball.y;
            }

            let dx = targetX - p.x, dy = targetY - p.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 5) {
                p.vx = (dx / dist) * 2.2;
                p.vy = (dy / dist) * 2.2;
            } else { p.vx = 0; p.vy = 0; }
            p.x += p.vx; p.y += p.vy;
        });

        // XỬ LÝ VA CHẠM CẦU THỦ (KÉO NHAU RA)
        for (let i = 0; i < allPlayers.length; i++) {
            for (let j = i + 1; j < allPlayers.length; j++) {
                let p1 = allPlayers[i], p2 = allPlayers[j];
                let dx = p2.x - p1.x, dy = p2.y - p1.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 16 && dist > 0) {
                    let overlap = 16 - dist;
                    p1.x -= (dx / dist) * overlap * 0.5;
                    p1.y -= (dy / dist) * overlap * 0.5;
                    p2.x += (dx / dist) * overlap * 0.5;
                    p2.y += (dy / dist) * overlap * 0.5;
                }
            }
        }

        // BÓNG & TRỌNG TÀI
        let refDx = ball.x + 20 - referee.x, refDy = ball.y - 20 - referee.y;
        let refDist = Math.hypot(refDx, refDy);
        if (refDist > 15) { referee.x += (refDx / refDist) * 1.8; referee.y += (refDy / refDist) * 1.8; }

        ball.x += ball.vx; ball.y += ball.vy;
        ball.vx *= 0.88; ball.vy *= 0.88;

        // CHẠM BÓNG & TẠO TÌNH HUỐNG
        allPlayers.forEach(p => {
            let dx = ball.x - p.x, dy = ball.y - p.y;
            if (Math.hypot(dx, dy) < 12) {
                const isTeamA = teamA_players.includes(p);
                const targetGoalX = isTeamA ? 785 : 15;

                // Sút hoặc Chuyền
                if (Math.abs(ball.x - targetGoalX) < 180) {
                    ball.vx = (targetGoalX - ball.x) * 0.15;
                    ball.vy = (240 - ball.y + (Math.random() - 0.5) * 80) * 0.15;
                } else {
                    ball.vx = (Math.random() - 0.5) * 16;
                    ball.vy = (Math.random() - 0.5) * 16;
                }

                if (Math.random() < 0.04) {
                    const rand = Math.random();
                    if (rand < 0.25) {
                        triggerSetPiece('penalty', p, isTeamA ? 'A' : 'B');
                    } else if (rand < 0.55) {
                        triggerSetPiece('corner', p, isTeamA ? 'A' : 'B');
                    } else {
                        triggerSetPiece('freekick', p, isTeamA ? 'A' : 'B');
                    }
                }
            }
        });

        // VÀO LƯỚI
        if (ball.x <= 15 && ball.y >= 190 && ball.y <= 290) {
            scoreB++; document.getElementById('sim-score').textContent = `${scoreA} - ${scoreB}`;
            logMatchEvent("<b>VÀO!</b> Đội Khách mở tỷ số/sút tung lưới.");
            resetPlayersToTactical(); ball = { x: 400, y: 240, vx: 0, vy: 0 }; setPieceTimer = 20;
        } else if (ball.x >= 785 && ball.y >= 190 && ball.y <= 290) {
            scoreA++; document.getElementById('sim-score').textContent = `${scoreA} - ${scoreB}`;
            logMatchEvent("<b>VÀO!</b> Đội Nhà ghi bàn đẳng cấp.");
            resetPlayersToTactical(); ball = { x: 400, y: 240, vx: 0, vy: 0 }; setPieceTimer = 20;
        }

        if (ball.x < 15 || ball.x > 785) ball.vx *= -1;
        if (ball.y < 15 || ball.y > 465) ball.vy *= -1;

        drawPitch();
        renderSimEntities();

        if (mins >= 90) {
            clearInterval(simInterval); simRunning = false;
            logMatchEvent("<b>HẾT GIỜ!</b> Trận đấu chính thức kết thúc.");
        }
    }

    function renderSimEntities() {
        // Trọng tài
        simCtx.fillStyle = referee.color;
        simCtx.beginPath(); simCtx.arc(referee.x, referee.y, 6, 0, Math.PI * 2); simCtx.fill();

        // Cầu thủ
        teamA_players.forEach(p => {
            simCtx.fillStyle = p.color;
            simCtx.beginPath(); simCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); simCtx.fill();
        });
        teamB_players.forEach(p => {
            simCtx.fillStyle = p.color;
            simCtx.beginPath(); simCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); simCtx.fill();
        });

        // Quả bóng
        simCtx.fillStyle = "#ffffff";
        simCtx.beginPath(); simCtx.arc(ball.x, ball.y, 4, 0, Math.PI * 2); simCtx.fill();
    }
</script>
