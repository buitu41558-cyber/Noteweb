<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ghi chú · Tối giản</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #f5f5f0;
      color: #1a1a1a;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app-container {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .app-header h1 {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #171717;
    }

    .note-count {
      background: #e8e8df;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #3d3d3d;
    }

    /* Form thêm ghi chú */
    .note-form {
      background: #ffffff;
      border: 1px solid #e0e0d8;
      border-radius: 0.9rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .note-form input[type="text"],
    .note-form textarea {
      width: 100%;
      border: 1px solid #e2e2d9;
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      background: #fcfcf9;
      transition: border 0.2s;
      resize: vertical;
      outline: none;
    }

    .note-form input[type="text"]:focus,
    .note-form textarea:focus {
      border-color: #b0b0a0;
      background: #fff;
    }

    .note-form textarea {
      min-height: 90px;
    }

    .form-actions {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .file-upload-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.2rem;
      background: #f0f0e8;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #d9d9ce;
      color: #2e2e2e;
      transition: background 0.2s;
    }

    .file-upload-label:hover {
      background: #e6e6da;
    }

    #imageInput {
      display: none;
    }

    .image-preview-name {
      font-size: 0.8rem;
      color: #5e5e5e;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      padding: 0.6rem 1.4rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      border: 1px solid transparent;
      cursor: pointer;
      background: #f0f0e8;
      color: #1c1c1c;
      transition: background 0.2s, border-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background: #1c1c1c;
      color: #fafaf9;
      border-color: #1c1c1c;
    }

    .btn-primary:hover {
      background: #2e2e2e;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #c4c4b8;
    }

    .btn-outline:hover {
      background: #f4f4ef;
    }

    .btn-sm {
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
      border-radius: 0.4rem;
    }

    .btn-danger {
      border-color: #d0c8c8;
      color: #4a3030;
      background: #faf5f5;
    }

    .btn-danger:hover {
      background: #f1e8e8;
      border-color: #b8a7a7;
    }

    /* Danh sách ghi chú */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .note-card {
      background: #ffffff;
      border: 1px solid #e4e4dc;
      border-radius: 0.8rem;
      padding: 1.3rem 1.3rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .note-card:hover {
      border-color: #c5c5b6;
      box-shadow: 0 6px 14px rgba(0,0,0,0.04);
    }

    .note-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #1a1a1a;
      word-break: break-word;
    }

    .note-content {
      color: #444;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note-image {
      margin-top: 0.4rem;
      border-radius: 0.5rem;
      max-width: 100%;
      max-height: 260px;
      object-fit: cover;
      border: 1px solid #e6e6dd;
      background: #fafaf7;
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #7a7a7a;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .note-actions {
      display: flex;
      gap: 0.5rem;
    }

    .edit-mode-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #8a8a8a;
      background: #fdfdfb;
      border-radius: 0.8rem;
      border: 1px dashed #d5d5cb;
      font-size: 0.95rem;
    }

    hr {
      border: 0;
      border-top: 1px solid #eaeae2;
      margin: 0.2rem 0;
    }

    @media (max-width: 480px) {
      .form-actions {
        flex-direction: column;
        align-items: flex-start;
      }
      .note-footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <h1>📋 ghi chú</h1>
    <span class="note-count" id="noteCount">0 ghi chú</span>
  </header>

  <!-- Form thêm / chỉnh sửa -->
  <div class="note-form" id="noteFormContainer">
    <input type="text" id="noteTitle" placeholder="Tiêu đề ghi chú" maxlength="120" />
    <textarea id="noteContent" placeholder="Nội dung ghi chú..."></textarea>
    <div class="form-actions">
      <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
        <label for="imageInput" class="file-upload-label">
          <span>🖼️</span> Chọn ảnh
        </label>
        <input type="file" id="imageInput" accept="image/*" />
        <span class="image-preview-name" id="imagePreviewName"></span>
      </div>
      <div style="display: flex; gap: 0.6rem;">
        <button class="btn btn-outline btn-sm" id="cancelEditBtn" style="display: none;">Huỷ</button>
        <button class="btn btn-primary" id="saveNoteBtn">➕ Thêm ghi chú</button>
      </div>
    </div>
  </div>

  <!-- Danh sách ghi chú -->
  <div class="notes-list" id="notesList">
    <div class="empty-state">
      Chưa có ghi chú nào. Hãy thêm ghi chú đầu tiên.
    </div>
  </div>
</div>

<script>
  (function() {
    // Lưu trữ ghi chú trong bộ nhớ (có thể mở rộng localStorage)
    let notes = [];
    // Trạng thái chỉnh sửa
    let editingId = null;
    // Ảnh được chọn (dạng base64)
    let selectedImageData = null;

    // DOM elements
    const titleInput = document.getElementById('noteTitle');
    const contentInput = document.getElementById('noteContent');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewName = document.getElementById('imagePreviewName');
    const saveBtn = document.getElementById('saveNoteBtn');
    const cancelBtn = document.getElementById('cancelEditBtn');
    const notesListEl = document.getElementById('notesList');
    const noteCountEl = document.getElementById('noteCount');

    // Đọc ảnh thành base64
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) {
        selectedImageData = null;
        imagePreviewName.textContent = '';
        return;
      }
      // Giới hạn kích thước ảnh (5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('Ảnh quá lớn, vui lòng chọn ảnh dưới 5MB.');
        imageInput.value = '';
        selectedImageData = null;
        imagePreviewName.textContent = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = function(ev) {
        selectedImageData = ev.target.result;
        imagePreviewName.textContent = file.name.length > 22 ? file.name.substring(0, 19) + '...' : file.name;
      };
      reader.readAsDataURL(file);
    });

    // Lưu hoặc cập nhật ghi chú
    function saveNote() {
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title && !content && !selectedImageData) {
        alert('Vui lòng nhập tiêu đề, nội dung hoặc chọn ảnh.');
        return;
      }

      if (editingId !== null) {
        // Đang sửa
        const noteIndex = notes.findIndex(n => n.id === editingId);
        if (noteIndex > -1) {
          notes[noteIndex].title = title || 'Không tiêu đề';
          notes[noteIndex].content = content;
          // Nếu có ảnh mới thì cập nhật, không thì giữ ảnh cũ
          if (selectedImageData !== null) {
            notes[noteIndex].image = selectedImageData;
          }
          // Nếu người dùng không chọn ảnh mới (selectedImageData = null) => giữ nguyên ảnh cũ
        }
        exitEditMode();
      } else {
        // Thêm mới
        const newNote = {
          id: Date.now(),
          title: title || 'Không tiêu đề',
          content: content,
          image: selectedImageData || null,
          createdAt: new Date().toISOString(),
        };
        notes.unshift(newNote);
      }

      // Reset form
      clearForm();
      renderNotes();
    }

    // Xoá ghi chú
    function deleteNote(id) {
      if (editingId === id) {
        exitEditMode();
      }
      notes = notes.filter(note => note.id !== id);
      renderNotes();
    }

    // Bắt đầu chỉnh sửa
    function startEdit(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      // Nếu đang sửa note khác thì huỷ trước
      if (editingId !== null && editingId !== id) {
        exitEditMode();
      }
      editingId = id;
      titleInput.value = note.title;
      contentInput.value = note.content;
      // Hiển thị tên ảnh nếu có
      if (note.image) {
        imagePreviewName.textContent = 'Ảnh hiện tại (chọn ảnh mới để thay)';
      } else {
        imagePreviewName.textContent = '';
      }
      selectedImageData = null; // reset lựa chọn mới
      imageInput.value = '';
      saveBtn.textContent = '✏️ Cập nhật';
      cancelBtn.style.display = 'inline-flex';
      // Cuộn nhẹ lên form
      document.getElementById('noteFormContainer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Thoát chế độ chỉnh sửa
    function exitEditMode() {
      editingId = null;
      clearForm();
      saveBtn.textContent = '➕ Thêm ghi chú';
      cancelBtn.style.display = 'none';
    }

    function clearForm() {
      titleInput.value = '';
      contentInput.value = '';
      imageInput.value = '';
      selectedImageData = null;
      imagePreviewName.textContent = '';
    }

    // Render danh sách ghi chú
    function renderNotes() {
      noteCountEl.textContent = `${notes.length} ghi chú`;
      if (notes.length === 0) {
        notesListEl.innerHTML = `<div class="empty-state">Chưa có ghi chú nào. Hãy thêm ghi chú đầu tiên.</div>`;
        return;
      }

      let html = '';
      notes.forEach(note => {
        const titleSafe = escapeHtml(note.title || 'Không tiêu đề');
        const contentSafe = escapeHtml(note.content || '');
        const dateStr = note.createdAt ? new Date(note.createdAt).toLocaleDateString('vi-VN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

        html += `
          <div class="note-card" data-id="${note.id}">
            <div class="note-title">${titleSafe}</div>
            ${note.content ? `<div class="note-content">${contentSafe}</div>` : ''}
            ${note.image ? `<img src="${note.image}" alt="ảnh ghi chú" class="note-image" loading="lazy" />` : ''}
            <div class="note-footer">
              <span>${dateStr}</span>
              <div class="note-actions">
                <button class="btn btn-outline btn-sm edit-note-btn" data-id="${note.id}">✎ Sửa</button>
                <button class="btn btn-danger btn-sm delete-note-btn" data-id="${note.id}">🗑 Xoá</button>
              </div>
            </div>
          </div>
        `;
      });

      notesListEl.innerHTML = html;

      // Gắn sự kiện cho nút sửa và xoá
      document.querySelectorAll('.edit-note-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const id = Number(this.getAttribute('data-id'));
          startEdit(id);
        });
      });

      document.querySelectorAll('.delete-note-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const id = Number(this.getAttribute('data-id'));
          if (confirm('Xoá ghi chú này?')) {
            deleteNote(id);
          }
        });
      });
    }

    // Hàm escape HTML đơn giản
    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Sự kiện nút Lưu
    saveBtn.addEventListener('click', saveNote);

    // Nút Huỷ chỉnh sửa
    cancelBtn.addEventListener('click', exitEditMode);

    // Mặc định load dữ liệu mẫu nhẹ để trải nghiệm (có thể xoá)
    function loadSampleNotes() {
      if (notes.length === 0) {
        notes.push({
          id: 1678901234567,
          title: 'Ý tưởng thiết kế',
          content: 'Tập trung vào không gian trắng, font Inter, bố cục rõ ràng.',
          image: null,
          createdAt: new Date(Date.now() - 86400000).toISOString(),
        });
        notes.push({
          id: 1678901234568,
          title: 'Mua sắm cuối tuần',
          content: 'Trái cây, sữa chua, bánh mì đen.',
          image: null,
          createdAt: new Date().toISOString(),
        });
      }
      renderNotes();
    }

    // Khởi tạo
    loadSampleNotes();
  })();
</script>
</body>
</html>
```
