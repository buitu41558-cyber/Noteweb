<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Notes - Hệ Thống Ghi Chú Cá Nhân</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary: #38bdf8;
            --accent: #818cf8;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 { font-size: 28px; margin: 0; color: var(--primary); }

        /* Thanh tìm kiếm */
        .search-box {
            position: relative;
            flex: 1;
            margin: 0 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px;
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .search-box i { position: absolute; left: 15px; top: 14px; color: #64748b; }

        /* Nút thêm mới */
        .add-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

        /* Lưới ghi chú */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .note-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            transition: 0.3s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .note-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .note-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: var(--primary); border: none; background: transparent; width: 100%; color: inherit; outline: none; }
        
        .note-content { font-size: 14px; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 20px; flex-grow: 1; }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }

        .actions { display: flex; gap: 10px; }
        .actions i { cursor: pointer; font-size: 16px; transition: 0.2s; }
        .actions i:hover { color: white; }
        .del-icon:hover { color: var(--danger) !important; }

        /* Modal nhập ghi chú */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--primary);
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .save-btn { background: var(--primary); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .cancel-btn { background: #334155; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; color: white; }

        /* Màu sắc ghi chú */
        .color-dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: white; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-note-sticky"></i> PRO NOTES</h1>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm ghi chú..." oninput="renderNotes()">
            </div>
            <button class="add-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> THÊM MỚI</button>
        </header>

        <div class="notes-grid" id="notesGrid">
            </div>
    </div>

    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h2 id="modalTitle">Ghi chú mới</h2>
            <input type="text" id="titleInput" placeholder="Tiêu đề...">
            <textarea id="contentInput" rows="8" placeholder="Nội dung ghi chú..."></textarea>
            
            <label style="font-size: 12px; color: #888;">MÀU SẮC:</label>
            <div id="colorPicker" style="margin: 10px 0 20px;">
                <span class="color-dot active" style="background: #38bdf8;" data-color="#38bdf8"></span>
                <span class="color-dot" style="background: #f87171;" data-color="#f87171"></span>
                <span class="color-dot" style="background: #fbbf24;" data-color="#fbbf24"></span>
                <span class="color-dot" style="background: #34d399;" data-color="#34d399"></span>
                <span class="color-dot" style="background: #a78bfa;" data-color="#a78bfa"></span>
            </div>

            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">HỦY</button>
                <button class="save-btn" onclick="saveNote()">LƯU LẠI</button>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('my_pro_notes')) || [];
        let editId = null;
        let selectedColor = "#38bdf8";

        // Chọn màu
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                selectedColor = dot.getAttribute('data-color');
            });
        });

        function openModal(id = null) {
            const modal = document.getElementById('noteModal');
            modal.style.display = 'flex';
            if(id) {
                const note = notes.find(n => n.id === id);
                document.getElementById('titleInput').value = note.title;
                document.getElementById('contentInput').value = note.content;
                document.getElementById('modalTitle').innerText = "Chỉnh sửa ghi chú";
                editId = id;
            } else {
                document.getElementById('titleInput').value = "";
                document.getElementById('contentInput').value = "";
                document.getElementById('modalTitle').innerText = "Ghi chú mới";
                editId = null;
            }
        }

        function closeModal() {
            document.getElementById('noteModal').style.display = 'none';
        }

        function saveNote() {
            const title = document.getElementById('titleInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();

            if(!title && !content) return alert("Vui lòng nhập nội dung!");

            if(editId) {
                const index = notes.findIndex(n => n.id === editId);
                notes[index] = { ...notes[index], title, content, color: selectedColor, date: new Date().toLocaleString('vi-VN') };
            } else {
                const newNote = {
                    id: Date.now(),
                    title,
                    content,
                    color: selectedColor,
                    date: new Date().toLocaleString('vi-VN')
                };
                notes.unshift(newNote);
            }

            localStorage.setItem('my_pro_notes', JSON.stringify(notes));
            renderNotes();
            closeModal();
        }

        function deleteNote(id) {
            if(confirm("Xóa ghi chú này?")) {
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('my_pro_notes', JSON.stringify(notes));
                renderNotes();
            }
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = "";

            const filteredNotes = notes.filter(n => 
                n.title.toLowerCase().includes(search) || 
                n.content.toLowerCase().includes(search)
            );

            filteredNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.style.borderTop = `5px solid ${note.color}`;
                
                card.innerHTML = `
                    <div class="note-title" style="color: ${note.color}">${note.title || 'Không tiêu đề'}</div>
                    <div class="note-content">${note.content}</div>
                    <div class="note-footer">
                        <span>${note.date}</span>
                        <div class="actions">
                            <i class="fa-solid fa-pen-to-square" onclick="openModal(${note.id})"></i>
                            <i class="fa-solid fa-trash del-icon" onclick="deleteNote(${note.id})"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Khởi tạo lần đầu
        renderNotes();

        // Đóng modal khi bấm ra ngoài
        window.onclick = function(event) {
            const modal = document.getElementById('noteModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
