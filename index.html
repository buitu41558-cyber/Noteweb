<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victoria - Mô Phỏng Dân Số</title>

  <!-- SDK Firebase CDN Trực Tuyến -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    /* Khung ứng dụng Đen Trắng */
    .app-container {
      width: 100%;
      max-width: 480px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 20px 15px;
      position: relative;
      min-height: 600px;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }

    .header-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
    }

    /* Nút Admin Panel */
    .admin-panel-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.5px;
      transition: background-color 0.2s;
    }

    .admin-panel-btn:hover {
      background-color: #e4e4e7;
    }

    /* Tiêu đề bảng */
    .table-header {
      display: flex;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .col-name { flex: 1.2; text-align: left; }
    .col-flag { flex: 0.8; text-align: center; }
    .col-pop  { flex: 1.6; text-align: right; }

    /* Danh sách quốc gia */
    .country-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .country-row {
      display: flex;
      align-items: center;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px 10px;
      transition: transform 0.3s ease, border-color 0.2s;
    }

    .country-row:hover {
      border-color: #52525b;
    }

    .country-row .col-name {
      font-weight: 600;
      color: #ffffff;
      font-size: 14px;
      word-break: break-word;
    }

    .country-row .col-flag {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flag-img {
      width: 32px;
      height: 20px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid #3f3f46;
    }

    .no-flag {
      width: 32px;
      height: 20px;
      background: #09090b;
      border: 1px dashed #3f3f46;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #71717a;
    }

    /* KHUNG HIỂN THỊ CHỮ SỐ CHUẨN ĐỒNG BỘ CĂN DÒNG (ĐÃ SỬA LỖI LỆCH HÀNG) */
    .pop-container {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    .digit-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 0.62em;
      height: 18px;
      overflow: hidden;
    }

    .digit-char {
      display: block;
      width: 100%;
      text-align: center;
      line-height: 18px;
      font-size: 15px;
    }

    .symbol-slot {
      display: inline-block;
      height: 18px;
      line-height: 18px;
      color: #a1a1aa;
      padding: 0 1px;
      font-size: 15px;
    }

    /* Animation Cuộn */
    @keyframes digitScrollUp {
      0% { transform: translateY(100%); opacity: 0.3; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes digitScrollDown {
      0% { transform: translateY(-100%); opacity: 0.3; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .digit-scroll-up {
      animation: digitScrollUp 0.18s ease-out forwards;
    }

    .digit-scroll-down {
      animation: digitScrollDown 0.18s ease-out forwards;
    }

    .empty-state {
      text-align: center;
      color: #71717a;
      margin-top: 60px;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Modal Admin Panel */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 12px;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: #18181b;
      padding: 24px;
      border-radius: 10px;
      width: 92%;
      max-width: 420px;
      max-height: 88vh;
      overflow-y: auto;
      border: 1px solid #27272a;
    }

    .modal-content h3 {
      margin-bottom: 14px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
      font-weight: 600;
      color: #a1a1aa;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
    }

    .form-group input:focus {
      border-color: #ffffff;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #27272a;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background-color 0.2s;
    }

    .btn-submit { background: #ffffff; color: #000000; border: none; }
    .btn-cancel { background: #27272a; color: #ffffff; }
    .btn-close  { background: #09090b; color: #a1a1aa; }

    /* Admin Country Item */
    .admin-country-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid #27272a;
      border-radius: 6px;
      margin-bottom: 6px;
      background: #09090b;
      font-size: 12px;
    }

    .admin-country-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-actions {
      display: flex;
      gap: 4px;
    }

    .btn-action {
      padding: 4px 8px;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      background: #18181b;
      color: #ffffff;
    }

    .btn-action:hover {
      background: #ffffff;
      color: #000000;
    }

    .error-msg {
      color: #f87171;
      font-size: 11px;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-bar">
      <div class="header-title">VICTORIA</div>
      <button class="admin-panel-btn" onclick="toggleModal(true)">ADMIN PANEL</button>
    </div>

    <div class="table-header">
      <div class="col-name">Tên Quốc Gia</div>
      <div class="col-flag">Cờ</div>
      <div class="col-pop">Dân Số</div>
    </div>

    <div id="countryContainer" class="country-list">
      <div class="empty-state">Chưa có quốc gia nào.<br>Hãy bấm ADMIN PANEL để thêm quốc gia mới!</div>
    </div>
  </div>

  <!-- Modal Admin Panel -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      
      <!-- PHẦN 1: XÁC NHẬN MẬT KHẨU -->
      <div id="passwordSection">
        <h3>XÁC NHẬN ADMIN</h3>
        <form onsubmit="verifyPassword(event)">
          <div class="form-group">
            <label>Mật Khẩu Admin:</label>
            <input type="password" id="adminPassword" required>
            <div id="pwdError" class="error-msg">Mật khẩu không chính xác!</div>
          </div>
          <div class="btn-group">
            <button type="submit" class="btn btn-submit">Đăng Nhập</button>
            <button type="button" class="btn btn-close" onclick="toggleModal(false)">Hủy</button>
          </div>
        </form>
      </div>

      <!-- PHẦN 2: QUẢN LÝ ADMIN -->
      <div id="adminFormSection" style="display: none;">
        <h3 id="formTitle">THÊM QUỐC GIA MỚI</h3>
        
        <form id="addCountryForm">
          <div class="form-group">
            <label>Tên Quốc Gia:</label>
            <input type="text" id="cName" required>
          </div>
          <div class="form-group">
            <label>File Ảnh Cờ:</label>
            <input type="file" id="cFlagFile" accept="image/*">
          </div>
          <div class="form-group">
            <label>Dân Số:</label>
            <input type="number" id="cPop" placeholder="..." min="1" required>
          </div>
          <div class="form-group">
            <label>Tỷ Lệ Tăng Trưởng Hàng Năm (%):</label>
            <input type="number" step="0.01" id="cRate" required>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-submit" id="saveBtn">Tạo Quốc Gia</button>
            <button type="button" class="btn btn-cancel" id="cancelEditBtn" style="display: none;" onclick="resetFormState()">Hủy Sửa</button>
            <button type="button" class="btn btn-close" onclick="toggleModal(false)">Đóng Panel</button>
          </div>
        </form>

        <hr style="margin: 16px 0; border: 0; border-top: 1px solid #27272a;">

        <h3>QUẢN LÝ QUỐC GIA</h3>
        <div id="adminCountryList"></div>
      </div>

    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // CẤU HÌNH CLOUD DATABASE ONLINE CHUNG TẤT CẢ MỌI NGƯỜI
    // ----------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://victoria-shared-world-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    let dbRef = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      dbRef = firebase.database().ref("victoria_world_countries");
    } catch(e) {
      console.log("Sử dụng bộ nhớ dự phòng.");
    }

    const ADMIN_PASSWORD = "admin89897272";
    let isAuthenticated = false;

    let countries = [];
    let editingCountryId = null;
    let lastTime = performance.now();

    // Logic Tỷ lệ chuẩn: 1 Ngày Thật (86.400s) = 2 Tháng Ảo (1/6 năm ảo = 518.400s)
    const VIRTUAL_YEAR_RATIO = 518400;

    // LƯU DỮ LIỆU LÊN CLOUD ONLINE HOẶC LOCAL
    function saveAutosave() {
      const nowMs = Date.now();
      countries.forEach(c => c.lastTimestamp = nowMs);

      localStorage.setItem("victoria_countries_online_v3", JSON.stringify(countries));
      localStorage.setItem("victoria_last_save_time_v3", nowMs.toString());

      if (dbRef) {
        const updateObj = {};
        countries.forEach(c => {
          updateObj[c.id] = {
            id: c.id,
            name: c.name,
            flagUrl: c.flagUrl || null,
            population: c.population,
            growthRate: c.growthRate,
            lastTimestamp: c.lastTimestamp
          };
        });
        dbRef.set(updateObj);
      }
    }

    // ĐỒNG BỘ DATA ONLINE VỚI TẤT CẢ NGƯỜI DÙNG & TÍNH BÙ KHI THOÁT WEB
    function loadAutosaveData() {
      // 1. Đọc nhanh từ local để hiển thị lập tức
      const localData = localStorage.getItem("victoria_countries_online_v3");
      const lastSaveTimeStr = localStorage.getItem("victoria_last_save_time_v3");
      const nowMs = Date.now();

      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          const lastSaveTime = lastSaveTimeStr ? parseInt(lastSaveTimeStr, 10) : nowMs;
          const elapsedSeconds = Math.max(0, (nowMs - lastSaveTime) / 1000);

          if (elapsedSeconds > 0) {
            const virtualYearsPassed = elapsedSeconds / VIRTUAL_YEAR_RATIO;
            parsed.forEach(c => {
              const birthRate = c.growthRate || 0.01;
              const deathRate = 0.01;
              const netGrowthRate = birthRate - deathRate;
              c.population += c.population * netGrowthRate * virtualYearsPassed;
              c.lastTimestamp = nowMs;
            });
          }

          countries = parsed;
          renderList();
          renderAdminCountryList();
        } catch(e) {}
      }

      // 2. Kết nối Cloud Firebase để tất cả mọi người thấy chung 1 data
      if (dbRef) {
        dbRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const cloudList = Object.values(data);
            processCloudCatchup(cloudList);
          } else if (countries.length === 0) {
            renderList();
          }
        });
      }
    }

    function processCloudCatchup(cloudList) {
      const nowMs = Date.now();
      cloudList.forEach(incoming => {
        let existing = countries.find(c => c.id === incoming.id);
        const lastUpdated = incoming.lastTimestamp || nowMs;
        const elapsedSeconds = Math.max(0, (nowMs - lastUpdated) / 1000);

        if (elapsedSeconds > 0) {
          const virtualYearsPassed = elapsedSeconds / VIRTUAL_YEAR_RATIO;
          const birthRate = incoming.growthRate || 0.01;
          const deathRate = 0.01;
          const netGrowthRate = birthRate - deathRate;
          incoming.population += incoming.population * netGrowthRate * virtualYearsPassed;
          incoming.lastTimestamp = nowMs;
        }

        if (existing) {
          existing.name = incoming.name;
          existing.flagUrl = incoming.flagUrl;
          existing.population = incoming.population;
          existing.growthRate = incoming.growthRate;
        } else {
          incoming.prevPopulation = incoming.population;
          incoming.renderedChars = null;
          countries.push(incoming);
        }
      });

      const incomingIds = cloudList.map(i => i.id);
      countries = countries.filter(c => incomingIds.includes(c.id));

      renderList();
      renderAdminCountryList();
    }

    function toggleModal(show) {
      const modal = document.getElementById('adminModal');
      if (show) {
        modal.style.display = 'flex';
        if (!isAuthenticated) {
          document.getElementById('passwordSection').style.display = 'block';
          document.getElementById('adminFormSection').style.display = 'none';
          document.getElementById('adminPassword').value = '';
          document.getElementById('pwdError').style.display = 'none';
        } else {
          document.getElementById('passwordSection').style.display = 'none';
          document.getElementById('adminFormSection').style.display = 'block';
          renderAdminCountryList();
        }
      } else {
        modal.style.display = 'none';
        resetFormState();
      }
    }

    function verifyPassword(e) {
      e.preventDefault();
      const inputPwd = document.getElementById('adminPassword').value;
      if (inputPwd === ADMIN_PASSWORD) {
        isAuthenticated = true;
        document.getElementById('passwordSection').style.display = 'none';
        document.getElementById('adminFormSection').style.display = 'block';
        renderAdminCountryList();
      } else {
        document.getElementById('pwdError').style.display = 'block';
      }
    }

    document.getElementById('addCountryForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('cName').value;
      const initialPop = parseFloat(document.getElementById('cPop').value);
      const rate = parseFloat(document.getElementById('cRate').value) / 100;
      const fileInput = document.getElementById('cFlagFile');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          saveCountryData(name, event.target.result, initialPop, rate);
        };
        reader.readAsDataURL(file);
      } else {
        let existingFlag = null;
        if (editingCountryId !== null) {
          const target = countries.find(c => c.id === editingCountryId);
          if (target) existingFlag = target.flagUrl;
        }
        saveCountryData(name, existingFlag, initialPop, rate);
      }
    });

    function saveCountryData(name, flagImgUrl, pop, rate) {
      if (editingCountryId !== null) {
        const country = countries.find(c => c.id === editingCountryId);
        if (country) {
          country.name = name;
          country.flagUrl = flagImgUrl;
          country.population = pop;
          country.growthRate = rate;
          country.renderedChars = null;
        }
      } else {
        const newCountry = {
          id: Date.now(),
          name: name,
          flagUrl: flagImgUrl,
          population: pop,
          growthRate: rate,
          prevPopulation: pop,
          renderedChars: null,
          lastTimestamp: Date.now()
        };
        countries.push(newCountry);
      }

      resetFormState();
      saveAutosave();
      renderList();
      renderAdminCountryList();
    }

    function startEditCountry(id) {
      const country = countries.find(c => c.id === id);
      if (!country) return;

      editingCountryId = id;
      document.getElementById('formTitle').innerText = 'CHỈNH SỬA QUỐC GIA';
      document.getElementById('cName').value = country.name;
      document.getElementById('cPop').value = Math.floor(country.population);
      document.getElementById('cRate').value = (country.growthRate * 100).toFixed(2);
      document.getElementById('saveBtn').innerText = 'Cập Nhật';
      document.getElementById('cancelEditBtn').style.display = 'block';
    }

    function resetFormState() {
      editingCountryId = null;
      document.getElementById('formTitle').innerText = 'THÊM QUỐC GIA MỚI';
      document.getElementById('addCountryForm').reset();
      document.getElementById('saveBtn').innerText = 'Tạo Quốc Gia';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function duplicateCountry(id) {
      const country = countries.find(c => c.id === id);
      if (!country) return;

      const clone = {
        id: Date.now(),
        name: country.name + " (Bản sao)",
        flagUrl: country.flagUrl,
        population: country.population,
        growthRate: country.growthRate,
        prevPopulation: country.population,
        renderedChars: null,
        lastTimestamp: Date.now()
      };

      countries.push(clone);
      saveAutosave();
      renderList();
      renderAdminCountryList();
    }

    function deleteCountry(id) {
      countries = countries.filter(c => c.id !== id);
      if (editingCountryId === id) resetFormState();
      saveAutosave();
      renderList();
      renderAdminCountryList();
    }

    function renderAdminCountryList() {
      const listEl = document.getElementById('adminCountryList');
      if (countries.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; color:#71717a; font-size:12px; padding:10px;">Chưa có quốc gia nào.</div>`;
        return;
      }

      listEl.innerHTML = countries.map(c => `
        <div class="admin-country-item">
          <div class="admin-country-info">
            ${c.flagUrl 
              ? `<img src="${c.flagUrl}" class="flag-img" style="width:22px; height:14px;">` 
              : `<div class="no-flag" style="width:22px; height:14px;">N/A</div>`}
            <b>${c.name}</b>
          </div>
          <div class="admin-actions">
            <button class="btn-action" onclick="startEditCountry(${c.id})">Sửa</button>
            <button class="btn-action" onclick="duplicateCountry(${c.id})">Nhân Bản</button>
            <button class="btn-action" onclick="deleteCountry(${c.id})">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    function renderList() {
      const container = document.getElementById('countryContainer');
      if (countries.length === 0) {
        container.innerHTML = `<div class="empty-state">Chưa có quốc gia nào.<br>Hãy bấm ADMIN PANEL để thêm quốc gia mới!</div>`;
        return;
      }

      countries.sort((a, b) => b.population - a.population);

      container.innerHTML = countries.map(c => `
        <div class="country-row" id="country-${c.id}">
          <div class="col-name">${c.name}</div>
          <div class="col-flag">
            ${c.flagUrl 
              ? `<img src="${c.flagUrl}" class="flag-img" alt="Cờ">` 
              : `<div class="no-flag">No Flag</div>`}
          </div>
          <div class="col-pop">
            <div class="pop-container" id="pop-val-${c.id}"></div>
          </div>
        </div>
      `).join('');

      countries.forEach(c => updateDigitDisplay(c, true));
    }

    // CẬP NHẬT DÂN SỐ CHỈ CUỘN TỪNG CHỮ SỐ LỆCH (ĐÃ SỬA CHUẨN CĂN HÀNG)
    function updateDigitDisplay(c, forceRebuild = false) {
      const container = document.getElementById(`pop-val-${c.id}`);
      if (!container) return;

      const newStr = Math.floor(c.population).toLocaleString('vi-VN');
      const newChars = newStr.split('');

      if (forceRebuild || !c.renderedChars || c.renderedChars.length !== newChars.length) {
        container.innerHTML = newChars.map((ch, idx) => {
          if (/\d/.test(ch)) {
            return `<span class="digit-slot"><span class="digit-char" id="digit-${c.id}-${idx}">${ch}</span></span>`;
          } else {
            return `<span class="symbol-slot">${ch}</span>`;
          }
        }).join('');
        c.renderedChars = [...newChars];
        c.prevPopulation = c.population;
        return;
      }

      const isOverallIncrease = c.population >= (c.prevPopulation || c.population);
      c.prevPopulation = c.population;

      newChars.forEach((ch, idx) => {
        if (ch !== c.renderedChars[idx]) {
          const charEl = document.getElementById(`digit-${c.id}-${idx}`);
          if (charEl && /\d/.test(ch)) {
            charEl.innerText = ch;
            const animClass = isOverallIncrease ? 'digit-scroll-up' : 'digit-scroll-down';
            
            charEl.classList.remove('digit-scroll-up', 'digit-scroll-down');
            void charEl.offsetWidth;
            charEl.classList.add(animClass);
          }
          c.renderedChars[idx] = ch;
        }
      });
    }

    // VÒNG LẶP MÔ PHỎNG DÂN SỐ TĂNG / GIẢM HÀI HÒA
    function updateSimulation() {
      const now = performance.now();
      const deltaTime = (now - lastTime) / 1000;
      lastTime = now;

      if (countries.length > 0) {
        const virtualYearsPassed = deltaTime / VIRTUAL_YEAR_RATIO;

        countries.forEach(c => {
          const birthRate = c.growthRate;
          const deathCycle = Math.sin(now / 5000 + c.id * 1.5) * 0.006;
          const currentDeathRate = Math.max(0.002, 0.010 + deathCycle);

          const netGrowthRate = birthRate - currentDeathRate;
          const growth = c.population * netGrowthRate * virtualYearsPassed;

          c.population += growth;
          if (c.population < 0) c.population = 0;

          updateDigitDisplay(c);
        });

        // Tự động sắp xếp BXH (Đông nhất lên đầu)
        countries.sort((a, b) => b.population - a.population);

        const container = document.getElementById('countryContainer');
        countries.forEach(c => {
          const rowEl = document.getElementById(`country-${c.id}`);
          if (rowEl) {
            container.appendChild(rowEl);
          }
        });
      }
    }

    // Tự động Autosave đồng bộ định kỳ
    setInterval(saveAutosave, 3000);

    // Khởi tạo đọc dữ liệu & Chạy vòng lặp
    loadAutosaveData();
    setInterval(updateSimulation, 200);
  </script>
</body>
</html>
