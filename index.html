<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Khí Tượng Đồng Bộ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        
        /* Căn giữa map nằm ngang */
        .map-container { 
            width: 100vw; height: 50vw; max-height: 100vh; max-width: 200vh; 
            position: relative; margin: auto; top: 50%; transform: translateY(-50%); 
            border: 1px solid #333; box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        #map { width: 100%; height: 100%; background: #05070a; cursor: crosshair; }

        /* Thông báo chạy ngang toàn cầu */
        #tickerWrap { 
            position: absolute; top: 0; width: 100%; background: #d32f2f; color: #fff; 
            z-index: 5000; display: none; padding: 8px 0; overflow: hidden; font-weight: bold;
        }
        .ticker { display: inline-block; white-space: nowrap; animation: ticker 20s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Admin Panel bên trái */
        #adminPanel { 
            position: absolute; top: 0; left: -320px; width: 300px; height: 100%; 
            background: rgba(10, 10, 10, 0.95); border-right: 3px solid #ff4b4b; 
            z-index: 4000; transition: 0.4s ease-in-out; color: #fff; padding: 25px; box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
        }
        #adminPanel.active { left: 0; }

        h2 { color: #ff4b4b; font-size: 18px; margin-bottom: 20px; text-align: center; letter-spacing: 2px; }
        .item { margin-bottom: 15px; }
        label { font-size: 11px; color: #888; display: block; margin-bottom: 5px; text-transform: uppercase; }
        input, select { 
            width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; 
            padding: 10px; border-radius: 4px; box-sizing: border-box; font-size: 13px;
        }
        input:focus { border-color: #ff4b4b; outline: none; }

        .btn-send { 
            width: 100%; padding: 12px; background: #ff4b4b; color: #fff; border: none; 
            border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn-msg { background: #333; font-size: 11px; margin-top: 5px; }

        /* Nút ADMIN góc dưới */
        .login-btn { 
            position: absolute; bottom: 15px; right: 20px; z-index: 1000; 
            background: rgba(255,255,255,0.1); color: #555; border: 1px solid #333; 
            padding: 5px 15px; cursor: pointer; border-radius: 20px; font-size: 12px; font-weight: bold;
            transition: 0.3s;
        }
        .login-btn:hover { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }

        /* Marker Bão */
        .storm-marker { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; position: relative; }
        .radar { 
            position: absolute; inset: -15px; border: 2px solid inherit; border-radius: 50%; 
            animation: radar-pulse 2s infinite; opacity: 0.5; 
        }
        @keyframes radar-pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
    </style>
</head>
<body>

    <div id="tickerWrap"><div class="ticker"
