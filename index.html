<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Khí Tượng Tổng Hợp</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .map-container { width: 100vw; height: 50vw; max-height: 100vh; max-width: 200vh; position: relative; margin: auto; top: 50%; transform: translateY(-50%); border: 2px solid #333; }
        #map { width: 100%; height: 100%; background: #05070a; }

        /* Panel quản trị bên trái */
        #adminPanel { 
            position: absolute; top: 0; left: -320px; width: 300px; height: 100%; 
            background: rgba(10, 10, 10, 0.98); border-right: 3px solid #ff4b4b; 
            z-index: 4000; transition: 0.4s ease-in-out; color: #fff; padding: 25px; box-sizing: border-box;
        }
        #adminPanel.active { left: 0; }
        .toggle-panel {
            position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
            width: 40px; height: 60px; background: #ff4b4b; color: white; border: none; 
            border-radius: 0 5px 5px 0; cursor: pointer; display: none; font-weight: bold;
        }

        h2 { color: #ff4b4b; font-size: 16px; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
        .item { margin-bottom: 12px; }
        label { font-size: 10px; color: #666; display: block; margin-bottom: 3px; }
        input, select { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px; }
        .btn-action { width: 100%; padding: 12px; background: #ff4b4b; color: #fff; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 4px; }

        /* Hiệu ứng Marker */
        .storm-marker { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; position: relative; }
        .radar-pulse { 
            position: absolute; inset: -20px; border: 2px solid inherit; border-radius: 50%; 
            animation: pulse 2s infinite; opacity: 0.6; pointer-events: none;
        }
        @keyframes pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        .login-btn { position: absolute; bottom: 15px; right: 20px; z-index: 1000; background: rgba(255,255,255,0.05); color: #444; border: 1px solid #222; padding: 5px 15px; cursor: pointer; border-radius: 20px; font-size: 11px; }
        #statusHint { font-size: 11px; color: #ff4b4b; text-align: center; margin-top: 15px; font-weight: bold; border: 1px dashed #333; padding: 8px; }
    </style>
</head>
<body>

    <div class="map-container">
        <div id="map"></div>
        <button class="login-btn" onclick="login()">ADMIN LOGIN</button>

        <div id="adminPanel">
            <button class="toggle-panel" id="toggleBtn" onclick="togglePanel()"> < </button>
            <h2>BẢNG ĐIỀU KHIỂN</h2>
            
            <div class="item">
                <label>TÊN THỰC THỂ</label>
                <input type="text" id="sName" placeholder="VD: BÃO SỐ 3">
            </div>

            <div class="item">
                <label>LOẠI HÌNH BÃO</label>
                <select id="sType">
                    <option value="sieubao">🔴 SIÊU BÃO (Cấp 16+)</option>
                    <option value="baomanh">⭕ BÃO RẤT MẠNH (Cấp 12-15)</option>
                    <option value="bao">🟠 BÃO THƯỜNG (Cấp 8-11)</option>
                    <option value="apthap">🟡 ÁP THẤP NHIỆT ĐỚI</option>
                    <option value="lanh">🔵 KHÔNG KHÍ LẠNH</option>
                    <option value="mua">🟢 VÙNG HỘI TỤ MƯA</option>
                </select>
            </div>

            <div class="item">
                <label>BÁN KÍNH (KM)</label>
                <input type="range" id="sRadius" min="50" max="600" value="250">
            </div>
            
            <div id="statusHint">ĐĂNG NHẬP ĐỂ VẼ</div>
            
            <button class="btn-action" style="background:#222;" onclick="location.reload()">ĐĂNG XUẤT</button>
            <button class="btn-action" style="background:red; font-size: 10px;" onclick="clearMap()">XÓA TẤT CẢ BẢN ĐỒ</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
        const bounds = [[0, 0], [1000, 2000]];
        L.imageOverlay('https://i.ibb.co/p6njm03s/1778582329890.png', bounds).addTo(map);
        map.fitBounds(bounds);

        let isAdmin = false, step = 1, points = [], storms = [];
        const layerGroup = L.layerGroup().addTo(map);

        // Bảng màu cho từng loại bão
        const colors = {
            sieubao: '#ff0000',
            baomanh: '#ff4500',
            bao: '#ffa500',
            apthap: '#ffff00',
            lanh: '#00ccff',
            mua: '#00ff66'
        };

        window.onload = () => {
            const saved = localStorage.getItem('storm_pro_v5');
            if(saved) { storms = JSON.parse(saved); render(); }
        };

        function login() {
            if(prompt("Mật khẩu:") === 'aihoi') {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('toggleBtn').style.display = 'flex';
                updateHint();
            }
        }

        function togglePanel() {
            const panel = document.getElementById('adminPanel');
            const btn = document.getElementById('toggleBtn');
            panel.classList.toggle('active');
            btn.innerText = panel.classList.contains('active') ? '<' : '>';
        }

        function updateHint() {
            const text = ["CLICK CHỌN TÂM BÃO", "CLICK HƯỚNG DI CHUYỂN", "CLICK ĐIỂM KẾT THÚC"];
            document.getElementById('statusHint').innerText = `BƯỚC ${step}: ${text[step-1]}`;
        }

        function render() {
            layerGroup.clearLayers();
            storms.forEach((s, idx) => {
                const color = colors[s.type];
                
                // Marker
                const marker = L.marker([s.p1.y, s.p1.x], {
                    icon: L.divIcon({ 
                        className: 'storm-marker', 
                        html: `<div class="radar-pulse" style="border-color:${color}"></div>`,
                        iconSize: [20,20]
                    })
                });

                // Vùng quét
                const circle = L.circle([s.p1.y, s.p1.x], { radius: parseInt(s.r), color: color, weight: 1, fillOpacity: 0.1 });
                
                // Đường dự báo
                const line = L.polyline([[s.p1.y, s.p1.x], [s.p2.y, s.p2.x], [s.p3.y, s.p3.x]], { color: color, weight: 2, dashArray: '5,10', opacity: 0.5 });

                const group = L.layerGroup([marker, circle, line]).addTo(layerGroup);
                
                const del = isAdmin ? `<br><button onclick="removeStorm(${idx})" style="border:none; background:red; color:white; font-size:9px; cursor:pointer;">XÓA</button>` : "";
                marker.bindTooltip(`<b style="color:${color}">${s.name}</b>${del}`, { permanent: true, direction: 'top', interactive: true });
            });
            localStorage.setItem('storm_pro_v5', JSON.stringify(storms));
        }

        map.on('click', e => {
            if(!isAdmin) return;
            points.push({ y: e.latlng.lat, x: e.latlng.lng });

            if(step < 3) {
                step++;
                updateHint();
            } else {
                storms.push({
                    name: document.getElementById('sName').value || "KHÔNG TÊN",
                    type: document.getElementById('sType').value,
                    r: document.getElementById('sRadius').value,
                    p1: points[0], p2: points[1], p3: points[2]
                });
                render();
                points = []; step = 1;
                updateHint();
            }
        });

        window.removeStorm = (i) => { storms.splice(i, 1); render(); };
        function clearMap() { if(confirm("Xóa hết?")) { storms = []; render(); } }
    </script>
</body>
</html>
