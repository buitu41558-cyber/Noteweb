<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Windy - Weather Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-dark: #111;
            --panel-bg: rgba(30, 30, 30, 0.9);
            --windy-blue: #32a1ff;
            --windy-red: #ff4b4b;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }

        /* Map styling */
        #map { width: 100%; height: 100%; background: #0b0e11; }

        /* Windy UI Components */
        .ui-overlay { position: absolute; z-index: 1000; pointer-events: none; width: 100%; height: 100%; }
        .ui-overlay > * { pointer-events: auto; }

        /* Search & Info Panel */
        .top-left { top: 20px; left: 20px; position: absolute; }
        .search-bar { 
            background: var(--panel-bg); padding: 12px 20px; border-radius: 4px;
            border-left: 4px solid var(--windy-red); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Right Layer Menu */
        .right-menu { 
            right: 10px; top: 50%; transform: translateY(-50%); position: absolute;
            background: var(--panel-bg); border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .layer-item { text-align: center; cursor: pointer; font-size: 11px; opacity: 0.7; transition: 0.3s; }
        .layer-item.active { opacity: 1; color: var(--windy-blue); }
        .layer-icon { width: 30px; height: 30px; background: #444; margin-bottom: 5px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

        /* Bottom Timeline */
        .timeline {
            bottom: 30px; left: 50%; transform: translateX(-50%); position: absolute;
            width: 80%; background: var(--panel-bg); padding: 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 20px;
        }
        .play-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--windy-blue); color: white; cursor: pointer; }
        .slider { flex-grow: 1; accent-color: var(--windy-blue); cursor: pointer; }

        /* Storm Animation Overlay */
        .storm-marker {
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(50,161,255,0.1) 50%, transparent 70%);
            border-radius: 50%;
            animation: rotateStorm 10s linear infinite;
        }
        @keyframes rotateStorm {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-overlay">
        <div class="top-left">
            <div class="search-bar">
                <div style="font-weight: bold; font-size: 1.2rem;">LỤC ĐỊA ELDRIA</div>
                <div style="font-size: 0.8rem; color: #aaa;">Dự báo bão: Áp thấp nhiệt đới vùng biển phía Đông</div>
            </div>
        </div>

        <div class="right-menu">
            <div class="layer-item active"><div class="layer-icon">💨</div>Gió</div>
            <div class="layer-item"><div class="layer-icon">🌧️</div>Mưa</div>
            <div class="layer-item"><div class="layer-icon">🌡️</div>Nhiệt độ</div>
            <div class="layer-item"><div class="layer-icon">⛈️</div>Sét</div>
        </div>

        <div class="timeline">
            <button class="play-btn">▶</button>
            <div style="font-size: 12px; min-width: 60px;">THỨ BA 12</div>
            <input type="range" class="slider" min="0" max="100" value="20">
            <div style="font-size: 12px; min-width: 60px;">THỨ BẢY 16</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Thiết lập bản đồ giả tưởng
        const map = L.map('map', {
            crs: L.CRS.Simple, // Hệ tọa độ phẳng cho ảnh giả tưởng
            minZoom: -2
        });

        const bounds = [[0, 0], [1000, 1000]]; // Kích thước ảo
        const image = L.imageOverlay('https://i.ibb.co/p6njm03s/1778582329890.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // 2. Tạo hiệu ứng Bão (Storm Radar)
        // Chúng ta tạo các vòng tròn đồng tâm mô phỏng radar bão chuyên nghiệp
        function createStorm(lat, lng, color) {
            const stormIcon = L.divIcon({
                className: 'custom-storm',
                html: `<div class="storm-marker" style="border: 2px dashed ${color}; opacity: 0.5"></div>`,
                iconSize: [100, 100]
            });
            L.marker([lat, lng], {icon: stormIcon}).addTo(map);
            
            // Thêm tâm bão
            L.circle([lat, lng], {
                radius: 20,
                color: color,
                fillColor: color,
                fillOpacity: 0.5
            }).addTo(map).bindPopup("<b>Tâm bão cấp 12</b><br>Sức gió 120km/h");
        }

        // Đặt vài cơn bão lên các tọa độ trên map
        createStorm(400, 600, '#32a1ff'); // Bão biển
        createStorm(700, 300, '#ff4b4b'); // Áp thấp lục địa

        // 3. Hiệu ứng tương tác UI
        document.querySelector('.play-btn').onclick = function() {
            this.innerText = this.innerText === '▶' ? '⏸' : '▶';
        };

        // Ghi tọa độ khi click để bạn dễ dàng căn chỉnh bão sau này
        map.on('click', function(e) {
            console.log("Tọa độ click: ", e.latlng);
        });
    </script>
</body>
</html>
