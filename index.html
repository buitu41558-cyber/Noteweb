<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Weather - Lục Địa Huyền Bí</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --glass-bg: rgba(20, 20, 30, 0.85);
        }

        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background: #0a0a0c;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 20px;
            color: var(--primary-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .main-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            border: 2px solid var(--primary-gold);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Hiển thị bản đồ */
        .map-container {
            width: 100%;
            display: block;
        }

        .map-container img {
            width: 100%;
            height: auto;
            display: block;
            filter: sepia(30%) contrast(1.1);
        }

        /* Bảng điều khiển thời tiết */
        .weather-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--primary-gold);
            backdrop-filter: blur(5px);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .stat-box h3 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--primary-gold);
            text-transform: uppercase;
        }

        .stat-box p {
            margin: 5px 0 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .status-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            background: rgba(212, 175, 55, 0.2);
            margin-top: 5px;
        }

        /* Hiệu ứng hạt (Magic Particles) */
        #canvas-snow {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>DỰ BÁO THỜI TIẾT LIÊN MINH HUYỀN BÍ</h1>
        <p>Ngày 14, Kỷ Nguyên Thứ 3</p>
    </div>

    <div class="main-container">
        <div class="map-container">
            <img src="https://i.ibb.co/p6njm03s/1778582329890.png" alt="Fantasy Map">
        </div>
        
        <canvas id="canvas-snow"></canvas>

        <div class="weather-overlay">
            <div class="stat-box">
                <h3>Vùng Đất</h3>
                <p id="region">Thung Lũng Rồng</p>
            </div>
            <div class="stat-box">
                <h3>Nhiệt Độ</h3>
                <p id="temp">24°M</p> <!-- M là đơn vị Magic -->
            </div>
            <div class="stat-box">
                <h3>Năng Lượng Mana</h3>
                <p id="mana">Cực Cao</p>
                <span class="status-tag">Bão Ma Thuật</span>
            </div>
            <div class="stat-box">
                <h3>Dự Báo</h3>
                <p id="forecast">Mưa Ánh Sáng</p>
            </div>
        </div>
    </div>

    <script>
        // Giả lập dữ liệu thay đổi ngẫu nhiên
        const regions = ["Đảo Sương Mù", "Thành Phố Bay", "Rừng Nguyên Sinh", "Sa Mạc Cổ Đại"];
        const forecasts = ["Nắng Hoàng Kim", "Mưa Axit Nhẹ", "Tuyết Đen", "Gió Lốc Mana"];

        function updateWeather() {
            const temp = Math.floor(Math.random() * 50) - 10;
            document.getElementById('temp').innerText = `${temp}°M`;
            document.getElementById('region').innerText = regions[Math.floor(Math.random() * regions.length)];
            document.getElementById('forecast').innerText = forecasts[Math.floor(Math.random() * forecasts.length)];
        }

        // Cập nhật mỗi 5 giây
        setInterval(updateWeather, 5000);

        // Hiệu ứng hạt tuyết giả lập cho sinh động
        const canvas = document.getElementById('canvas-snow');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;

        let particles = [];
        for(let i=0; i<50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                density: Math.random() * 1
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.beginPath();
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2, true);
            }
            ctx.fill();
            update();
        }

        function update() {
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                p.y += Math.cos(p.density) + 1;
                p.x += Math.sin(p.density);
                if(p.y > canvas.height) {
                    particles[i] = {x: Math.random()*canvas.width, y: -10, radius: p.radius, density: p.density};
                }
            }
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
