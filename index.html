<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTE - Minimalism Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc; --sidebar-bg: #ffffff; --text: #1e293b;
            --primary: #6366f1; --border: #e2e8f0; --card: #ffffff;
            --sidebar-width: 280px;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --sidebar-bg: #1e293b; --text: #f1f5f9;
            --primary: #818cf8; --border: #334155; --card: #1e293b;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* Sidebar Logic */
        aside { 
            width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; padding: 25px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; z-index: 100;
        }
        aside.collapsed { width: 0; padding: 0; border: none; overflow: hidden; opacity: 0; transform: translateX(-20px); }

        .logo { font-size: 28px; font-weight: 800; margin-bottom: 35px; color: var(--primary); letter-spacing: -1.5px; }
        
        .folder-list { flex: 1; overflow-y: auto; }
        .folder-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; transition: 0.2s; }
        .folder-item:hover, .folder-item.active { background: var(--primary); color: white; }

        /* Main Content area */
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Nút Toggle Sidebar */
        .sidebar-toggle {
            position: absolute; left: 15px; top: 22px; z-index: 1000;
            background: var(--card); border: 1px solid var(--border);
            width: 35px; height: 35px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; color: var(--text);
            transition: 0.3s;
        }
        .sidebar-toggle:hover { background: var(--primary); color: white; }

        header { padding: 20px 20px 20px 65px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .search-bar { background: var(--sidebar-bg); border: 1px solid var(--border); padding: 10px 20px; border-radius: 25px; width: 350px; display: flex; align-items: center; }
        .search-bar input { border: none; background: transparent; color: var(--text); outline: none; margin-left: 10px; width: 100%; font-size: 14px; }

        .content-area { padding: 40px; overflow-y: auto; flex: 1; }
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        /* Note Card */
        .note-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: 0.3s; cursor: pointer; position: relative; }
        .note-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .note-card.pinned { border: 2px solid var(--primary); }
        .note-img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .note-title { font-weight: 700; font-size: 18px; margin-bottom: 10px; }
        .note-snippet { font-size: 14px; color: #64748b; line-height: 1.6; }

        /* Floating Add Button */
        .fab { position: fixed; bottom: 35px; right: 35px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); border: none; z-index: 500; transition: 0.3s; }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        /* Modal Custom */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card); width: 650px; max-width: 90%; padding: 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal-content textarea { width: 100%; border: none; background: transparent; color: var(--text); font-size: 16px; resize: none; outline: none; margin-top: 15px; }
        #imagePreview { width: 100%; max-height: 250px; object-fit: cover; border-radius: 15px; margin-bottom: 20px; display: none; }

        .color-opt { width: 30px; height: 30px; border-radius: 50%; display: inline-block; cursor: pointer; margin-right: 8px; border: 3px solid transparent; transition: 0.2s; }
        .color-opt.active { border-color: var(--text); transform: scale(1.2); }
    </style>
</head>
<body data-theme="dark">

    <aside id="sidebar">
        <div class="logo">NOTE</div>
        <div class="folder-list" id="folderList">
            </div>
        <button onclick="addFolder()" style="background:transparent; border:1px dashed var(--border); color:var(--text); width:100%; padding:10px; border-radius:10px; cursor:pointer; font-size:12px; margin-top:15px;">+ Thư mục mới</button>
        <div style="margin-top:auto;">
            <button onclick="toggleTheme()" style="width:100%; background:var(--border); border:none; padding:10px; border-radius:10px; color:var(--text); cursor:pointer;"><i class="fa-solid fa-circle-half-stroke"></i> Giao diện</button>
        </div>
    </aside>

    <main>
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars-staggered"></i>
        </button>

        <header>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Tìm kiếm ghi chú nhanh..." id="searchInp" oninput="renderNotes()">
            </div>
            <div id="folderTitle" style="font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:1px;">Tất cả</div>
        </header>

        <div class="content-area">
            <div class="notes-grid" id="notesGrid"></div>
        </div>

        <button class="fab" onclick="openModal()">
            <i class="fa-solid fa-plus"></i>
        </button>
    </main>

    <div class="modal" id="noteModal">
        <div class="modal-content">
            <input type="text" id="titleInp" placeholder="Tiêu đề NOTE" style="width:100%; border:none; background:transparent; color:var(--text); font-size:26px; font-weight:800; outline:none;">
            <textarea id="contentInp" rows="8" placeholder="Viết ghi chú của mày ở đây..."></textarea>
            
            <img id="imagePreview">

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:25px;">
                <div id="colorPicker">
                    <span class="color-opt" style="background:#6366f1;" data-color="#6366f1"></span>
                    <span class="color-opt" style="background:#f43f5e;" data-color="#f43f5e"></span>
                    <span class="color-opt" style="background:#10b981;" data-color="#10b981"></span>
                    <span class="color-opt" style="background:#f59e0b;" data-color="#f59e0b"></span>
                </div>
                <div style="display:flex; gap:10px;">
                    <label for="imgUpload" style="cursor:pointer; padding:10px; color:var(--primary); font-size:20px;"><i class="fa-solid fa-image"></i></label>
                    <input type="file" id="imgUpload" hidden accept="image/*" onchange="handleImage(this)">
                    <button onclick="closeModal()" style="background:transparent; border:none; color:var(--text); cursor:pointer;">Hủy</button>
                    <button onclick="saveNote()" style="background:var(--primary); color:white; border:none; padding:10px 25px; border-radius:12px; font-weight:700; cursor:pointer;">LƯU LẠI</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('notes_v3')) || [];
        let folders = JSON.parse(localStorage.getItem('folders_v3')) || ['Hàng ngày', 'Dự án', 'Học tập'];
        let currentFolder = 'all';
        let editId = null;
        let tempImg = "";
        let selectedColor = "#6366f1";

        // Logic Đóng/Mở thanh bên
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // Folders
        function renderFolders() {
            const list = document.getElementById('folderList');
            list.innerHTML = `<div class="folder-item ${currentFolder==='all'?'active':''}" onclick="filterFolder('all')"><span><i class="fa-solid fa-border-all"></i> Tất cả</span></div>`;
            folders.forEach(f => {
                list.innerHTML += `<div class="folder-item ${currentFolder===f?'active':''}" onclick="filterFolder('${f}')"><span><i class="fa-solid fa-folder"></i> ${f}</span></div>`;
            });
        }

        function addFolder() {
            const n = prompt("Tên thư mục mới:");
            if(n && !folders.includes(n)) {
                folders.push(n);
                save(); renderFolders();
            }
        }

        function filterFolder(f) {
            currentFolder = f;
            document.getElementById('folderTitle').innerText = f === 'all' ? 'Tất cả' : f;
            renderFolders(); renderNotes();
        }

        // Notes
        function handleImage(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                tempImg = e.target.result;
                const prev = document.getElementById('imagePreview');
                prev.src = tempImg; prev.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }

        function openModal(id = null) {
            editId = id;
            document.getElementById('noteModal').style.display = 'flex';
            const prev = document.getElementById('imagePreview');
            if(id) {
                const n = notes.find(x => x.id === id);
                document.getElementById('titleInp').value = n.title;
                document.getElementById('contentInp').value = n.content;
                tempImg = n.img || "";
                if(tempImg) { prev.src = tempImg; prev.style.display = 'block'; }
                else { prev.style.display = 'none'; }
            } else {
                document.getElementById('titleInp').value = "";
                document.getElementById('contentInp').value = "";
                prev.style.display = 'none'; tempImg = "";
            }
        }

        function closeModal() { document.getElementById('noteModal').style.display = 'none'; }

        function saveNote() {
            const title = document.getElementById('titleInp').value;
            const content = document.getElementById('contentInp').value;
            if(!title && !content) return;

            if(editId) {
                const i = notes.findIndex(x => x.id === editId);
                notes[i] = { ...notes[i], title, content, img: tempImg, color: selectedColor };
            } else {
                notes.unshift({ id: Date.now(), title, content, img: tempImg, color: selectedColor, folder: currentFolder === 'all' ? 'Hàng ngày' : currentFolder, pinned: false, date: new Date().toLocaleDateString() });
            }
            save(); renderNotes(); closeModal();
        }

        function deleteNote(e, id) {
            e.stopPropagation();
            if(confirm("Xóa NOTE này?")) {
                notes = notes.filter(x => x.id !== id);
                save(); renderNotes();
            }
        }

        function togglePin(e, id) {
            e.stopPropagation();
            const n = notes.find(x => x.id === id);
            n.pinned = !n.pinned;
            notes.sort((a,b) => b.pinned - a.pinned);
            save(); renderNotes();
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const search = document.getElementById('searchInp').value.toLowerCase();
            grid.innerHTML = "";

            notes.filter(n => (currentFolder === 'all' || n.folder === currentFolder) && (n.title.toLowerCase().includes(search) || n.content.toLowerCase().includes(search)))
            .forEach(n => {
                const card = document.createElement('div');
                card.className = `note-card ${n.pinned?'pinned':''}`;
                card.onclick = () => openModal(n.id);
                card.innerHTML = `
                    <div style="position:absolute; top:15px; right:15px; display:flex; gap:12px; z-index:10;">
                        <i class="fa-solid fa-thumbtack" style="color:${n.pinned?selectedColor:'#ccc'}" onclick="togglePin(event, ${n.id})"></i>
                        <i class="fa-solid fa-trash-can" style="color:#f43f5e" onclick="deleteNote(event, ${n.id})"></i>
                    </div>
                    ${n.img ? `<img src="${n.img}" class="note-img">` : ''}
                    <div class="note-title" style="color:${n.color}">${n.title || 'Không tiêu đề'}</div>
                    <div class="note-snippet">${n.content}</div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function save() {
            localStorage.setItem('notes_v3', JSON.stringify(notes));
            localStorage.setItem('folders_v3', JSON.stringify(folders));
        }

        // Color Logic
        document.querySelectorAll('.color-opt').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedColor = opt.dataset.color;
            }
        });

        renderFolders(); renderNotes();
    </script>
</body>
</html>
