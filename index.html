<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ghi chú thông minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1.2rem 3rem;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .app-container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .app-header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #171717;
    }
    .note-stats {
      font-size: 0.85rem;
      color: #5e5e5e;
      font-weight: 500;
      background: #fff;
      padding: 0.35rem 0.9rem;
      border-radius: 2rem;
      border: 1px solid #e0e0d6;
    }

    /* Thanh công cụ */
    .toolbar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      background: #fff;
      padding: 0.7rem 1rem;
      border-radius: 0.6rem;
      border: 1px solid #e4e4db;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .search-input {
      flex: 1;
      min-width: 150px;
      border: 1px solid #e0e0d6;
      border-radius: 0.45rem;
      padding: 0.55rem 0.8rem;
      font-size: 0.85rem;
      font-family: inherit;
      background: #fafaf7;
      outline: none;
      transition: border 0.2s;
    }
    .search-input:focus {
      border-color: #b5b5a5;
      background: #fff;
    }
    .sort-select {
      padding: 0.5rem 0.7rem;
      border-radius: 0.45rem;
      border: 1px solid #e0e0d6;
      font-size: 0.82rem;
      font-family: inherit;
      background: #fafaf7;
      cursor: pointer;
      outline: none;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 0.45rem;
      font-weight: 500;
      font-size: 0.82rem;
      border: 1px solid transparent;
      cursor: pointer;
      background: #f0f0e8;
      color: #1c1c1c;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn:hover {
      background: #e6e6da;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-dark {
      background: #1c1c1c;
      color: #fafaf9;
      border-color: #1c1c1c;
    }
    .btn-dark:hover {
      background: #2e2e2e;
    }
    .btn-sm {
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
    }

    /* Form thêm ghi chú */
    .note-form {
      background: #fff;
      border: 1px solid #e8e8e0;
      border-radius: 0.8rem;
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
      transition: box-shadow 0.2s;
    }
    .note-form:focus-within {
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      border-color: #cecec0;
    }
    .note-form input,
    .note-form textarea {
      width: 100%;
      border: 1px solid #e4e4db;
      border-radius: 0.5rem;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 0.9rem;
      background: #fcfcf9;
      outline: none;
      resize: vertical;
      transition: border 0.2s, background 0.2s;
    }
    .note-form textarea {
      min-height: 80px;
    }
    .note-form input:focus,
    .note-form textarea:focus {
      border-color: #b8b8a8;
      background: #fff;
    }
    .form-row {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .color-picker-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border 0.15s, transform 0.15s;
    }
    .color-dot:hover {
      transform: scale(1.15);
    }
    .color-dot.selected {
      border-color: #333;
    }
    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.45rem 0.9rem;
      background: #f2f2e9;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid #dbdbcf;
      font-weight: 500;
    }
    .file-label:hover {
      background: #e8e8db;
    }
    #imageInput {
      display: none;
    }
    .img-name {
      font-size: 0.75rem;
      color: #5e5e5e;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Danh sách ghi chú */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .note-card {
      background: #fff;
      border: 1px solid #eaeae2;
      border-radius: 0.7rem;
      padding: 1.1rem 1.1rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: all 0.25s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      animation: popIn 0.3s ease both;
      position: relative;
    }
    .note-card:hover {
      border-color: #c8c8b9;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
      transform: translateY(-2px);
    }
    .note-card.pinned {
      border-left: 3px solid #5a5a5a;
    }
    .note-card.done .note-title,
    .note-card.done .note-content {
      text-decoration: line-through;
      opacity: 0.55;
    }
    .note-card.removing {
      animation: cardOut 0.2s ease forwards;
    }
    @keyframes cardOut {
      to { opacity: 0; transform: scale(0.9); }
    }
    .note-title {
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
      word-break: break-word;
    }
    .note-content {
      color: #444;
      font-size: 0.88rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .note-image {
      border-radius: 0.45rem;
      max-width: 100%;
      max-height: 200px;
      object-fit: cover;
      border: 1px solid #e8e8dd;
      margin-top: 0.2rem;
      transition: transform 0.2s;
    }
    .note-image:hover {
      transform: scale(1.02);
    }
    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: #888;
      margin-top: 0.2rem;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .note-actions {
      display: flex;
      gap: 0.3rem;
    }
    .pin-badge {
      font-size: 0.7rem;
      color: #5a5a5a;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: #8a8a8a;
      background: #fdfdfb;
      border-radius: 0.8rem;
      border: 1px dashed #d8d8cd;
      font-size: 0.95rem;
    }
    .tag {
      display: inline-block;
      background: #eee;
      padding: 0.15rem 0.55rem;
      border-radius: 0.3rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: #4a4a4a;
      margin-right: 0.3rem;
    }

    @media (max-width: 500px) {
      .notes-grid {
        grid-template-columns: 1fr;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <h1>Ghi chú</h1>
    <span class="note-stats" id="noteStats">0 ghi chú</span>
  </header>

  <!-- Thanh công cụ -->
  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Tìm kiếm ghi chú..." />
    <select class="sort-select" id="sortSelect">
      <option value="newest">Mới nhất</option>
      <option value="oldest">Cũ nhất</option>
      <option value="title">Theo tên</option>
    </select>
    <button class="btn btn-sm" id="exportBtn">Xuất file</button>
    <button class="btn btn-sm" id="clearAllBtn">Xoá tất cả</button>
  </div>

  <!-- Form thêm / sửa -->
  <div class="note-form">
    <input type="text" id="noteTitle" placeholder="Tiêu đề" maxlength="150" />
    <textarea id="noteContent" placeholder="Nội dung ghi chú..."></textarea>
    <div class="form-row">
      <div class="color-picker-row">
        <span style="font-size:0.8rem; color:#555;">Màu nền:</span>
        <span class="color-dot" data-color="#ffffff" style="background:#fff; border:2px solid #ccc;"></span>
        <span class="color-dot" data-color="#fdf6e3" style="background:#fdf6e3;"></span>
        <span class="color-dot" data-color="#e8f0fe" style="background:#e8f0fe;"></span>
        <span class="color-dot" data-color="#fce4e4" style="background:#fce4e4;"></span>
        <span class="color-dot" data-color="#e6f5e6" style="background:#e6f5e6;"></span>
      </div>
      <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
        <label for="imageInput" class="file-label">Chọn ảnh</label>
        <input type="file" id="imageInput" accept="image/*" />
        <span class="img-name" id="imgPreviewName"></span>
      </div>
    </div>
    <div style="display:flex; gap:0.5rem; justify-content: flex-end;">
      <button class="btn" id="cancelEditBtn" style="display:none;">Huỷ</button>
      <button class="btn btn-dark" id="saveNoteBtn">Thêm ghi chú</button>
    </div>
  </div>

  <!-- Danh sách ghi chú -->
  <div class="notes-grid" id="notesGrid"></div>
</div>

<script>
  (() => {
    // ===== DỮ LIỆU =====
    let notes = [];
    let editingId = null;
    let selectedImage = null;
    let selectedBgColor = '#ffffff';

    // Mẫu
    function seed() {
      notes.push(
        { id: 1, title: 'Cuộc họp tuần', content: 'Thảo luận KPI quý 2, chuẩn bị báo cáo.', image: null, bg: '#ffffff', pinned: true, done: false, createdAt: Date.now() - 500000 },
        { id: 2, title: 'Mua sắm', content: 'Trứng, sữa, bánh mì, trái cây.', image: null, bg: '#fdf6e3', pinned: false, done: false, createdAt: Date.now() - 300000 },
        { id: 3, title: 'Đọc sách', content: 'Hoàn thành chương 5 cuốn "Thiết kế tối giản".', image: null, bg: '#e8f0fe', pinned: false, done: true, createdAt: Date.now() - 100000 },
      );
    }
    seed();

    // ===== DOM =====
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const exportBtn = document.getElementById('exportBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const noteTitle = document.getElementById('noteTitle');
    const noteContent = document.getElementById('noteContent');
    const imageInput = document.getElementById('imageInput');
    const imgPreviewName = document.getElementById('imgPreviewName');
    const saveBtn = document.getElementById('saveNoteBtn');
    const cancelBtn = document.getElementById('cancelEditBtn');
    const notesGrid = document.getElementById('notesGrid');
    const noteStats = document.getElementById('noteStats');
    const colorDots = document.querySelectorAll('.color-dot');

    // ===== TIỆN ÍCH =====
    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ===== MÀU NỀN =====
    colorDots.forEach(dot => {
      dot.addEventListener('click', function() {
        colorDots.forEach(d => d.classList.remove('selected'));
        this.classList.add('selected');
        selectedBgColor = this.dataset.color;
      });
    });
    // Mặc định chọn trắng
    document.querySelector('.color-dot[data-color="#ffffff"]').classList.add('selected');

    // ===== ẢNH =====
    imageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) { selectedImage = null; imgPreviewName.textContent = ''; return; }
      if (file.size > 5*1024*1024) { alert('Ảnh dưới 5MB'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        selectedImage = e.target.result;
        imgPreviewName.textContent = file.name.length > 20 ? file.name.slice(0,18)+'...' : file.name;
      };
      reader.readAsDataURL(file);
    });

    // ===== LƯU GHI CHÚ =====
    function saveNote() {
      const title = noteTitle.value.trim();
      const content = noteContent.value.trim();
      if (!title && !content && !selectedImage && !editingId) return;

      if (editingId) {
        const note = notes.find(n => n.id === editingId);
        if (note) {
          note.title = title || 'Không tiêu đề';
          note.content = content;
          note.bg = selectedBgColor;
          if (selectedImage !== null) note.image = selectedImage;
        }
        exitEdit();
      } else {
        notes.unshift({
          id: Date.now(),
          title: title || 'Không tiêu đề',
          content,
          image: selectedImage || null,
          bg: selectedBgColor,
          pinned: false,
          done: false,
          createdAt: Date.now(),
        });
        clearForm();
      }
      renderNotes();
    }

    function clearForm() {
      noteTitle.value = '';
      noteContent.value = '';
      imageInput.value = '';
      selectedImage = null;
      imgPreviewName.textContent = '';
      selectedBgColor = '#ffffff';
      document.querySelector('.color-dot[data-color="#ffffff"]').classList.add('selected');
      colorDots.forEach(d => { if (d.dataset.color !== '#ffffff') d.classList.remove('selected'); });
    }

    function exitEdit() {
      editingId = null;
      clearForm();
      saveBtn.textContent = 'Thêm ghi chú';
      cancelBtn.style.display = 'none';
    }

    saveBtn.addEventListener('click', saveNote);
    cancelBtn.addEventListener('click', exitEdit);

    // ===== RENDER =====
    function getFilteredNotes() {
      let filtered = [...notes];
      const query = searchInput.value.trim().toLowerCase();
      if (query) {
        filtered = filtered.filter(n =>
          n.title.toLowerCase().includes(query) ||
          n.content.toLowerCase().includes(query)
        );
      }
      const sort = sortSelect.value;
      if (sort === 'newest') filtered.sort((a,b) => b.createdAt - a.createdAt);
      else if (sort === 'oldest') filtered.sort((a,b) => a.createdAt - b.createdAt);
      else if (sort === 'title') filtered.sort((a,b) => a.title.localeCompare(b.title, 'vi'));

      // Ghim lên đầu
      const pinned = filtered.filter(n => n.pinned);
      const unpinned = filtered.filter(n => !n.pinned);
      return [...pinned, ...unpinned];
    }

    function renderNotes() {
      const list = getFilteredNotes();
      noteStats.textContent = `${notes.length} ghi chú`;

      if (list.length === 0) {
        notesGrid.innerHTML = '<div class="empty-state">Không có ghi chú nào.</div>';
        return;
      }

      notesGrid.innerHTML = list.map((note, i) => `
        <div class="note-card ${note.pinned ? 'pinned' : ''} ${note.done ? 'done' : ''}"
             data-id="${note.id}"
             style="background:${note.bg}; animation-delay:${i*0.03}s">
          ${note.pinned ? '<div class="pin-badge">Đã ghim</div>' : ''}
          <div class="note-title">${escapeHtml(note.title)}</div>
          ${note.content ? `<div class="note-content">${escapeHtml(note.content)}</div>` : ''}
          ${note.image ? `<img src="${note.image}" class="note-image" alt="ảnh" loading="lazy"/>` : ''}
          <div class="note-footer">
            <span>${new Date(note.createdAt).toLocaleDateString('vi-VN', {day:'numeric',month:'short',year:'numeric'})}</span>
            <div class="note-actions">
              <button class="btn btn-sm pin-btn" data-id="${note.id}">${note.pinned ? 'Bỏ ghim' : 'Ghim'}</button>
              <button class="btn btn-sm done-btn" data-id="${note.id}">${note.done ? 'Bỏ đánh dấu' : 'Xong'}</button>
              <button class="btn btn-sm edit-btn" data-id="${note.id}">Sửa</button>
              <button class="btn btn-sm del-btn" data-id="${note.id}" style="color:#a33;">Xoá</button>
            </div>
          </div>
        </div>
      `).join('');

      // Sự kiện
      document.querySelectorAll('.pin-btn').forEach(b => b.addEventListener('click', function() {
        togglePin(Number(this.dataset.id));
      }));
      document.querySelectorAll('.done-btn').forEach(b => b.addEventListener('click', function() {
        toggleDone(Number(this.dataset.id));
      }));
      document.querySelectorAll('.edit-btn').forEach(b => b.addEventListener('click', function() {
        startEdit(Number(this.dataset.id));
      }));
      document.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', function() {
        const id = Number(this.dataset.id);
        const card = document.querySelector(`.note-card[data-id="${id}"]`);
        if (card) {
          card.classList.add('removing');
          setTimeout(() => { deleteNote(id); }, 200);
        } else deleteNote(id);
      }));
    }

    function togglePin(id) {
      const note = notes.find(n => n.id === id);
      if (note) { note.pinned = !note.pinned; renderNotes(); }
    }
    function toggleDone(id) {
      const note = notes.find(n => n.id === id);
      if (note) { note.done = !note.done; renderNotes(); }
    }
    function deleteNote(id) {
      if (editingId === id) exitEdit();
      notes = notes.filter(n => n.id !== id);
      renderNotes();
    }
    function startEdit(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      if (editingId) exitEdit();
      editingId = id;
      noteTitle.value = note.title;
      noteContent.value = note.content;
      selectedImage = null;
      imageInput.value = '';
      imgPreviewName.textContent = note.image ? '(Ảnh hiện có)' : '';
      selectedBgColor = note.bg || '#ffffff';
      colorDots.forEach(d => {
        d.classList.remove('selected');
        if (d.dataset.color === selectedBgColor) d.classList.add('selected');
      });
      saveBtn.textContent = 'Cập nhật';
      cancelBtn.style.display = 'inline-flex';
      noteTitle.focus();
    }

    // ===== TÌM KIẾM & SẮP XẾP =====
    searchInput.addEventListener('input', renderNotes);
    sortSelect.addEventListener('change', renderNotes);

    // ===== XUẤT FILE =====
    exportBtn.addEventListener('click', () => {
      if (notes.length === 0) { alert('Chưa có ghi chú để xuất.'); return; }
      let text = 'DANH SÁCH GHI CHÚ\n';
      text += '═'.repeat(40) + '\n\n';
      notes.forEach((n, i) => {
        text += `#${i+1} ${n.title}${n.pinned?' [Ghim]':''}${n.done?' [Xong]':''}\n`;
        if (n.content) text += `   ${n.content}\n`;
        text += `   Ngày: ${new Date(n.createdAt).toLocaleDateString('vi-VN')}\n\n`;
      });
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ghi-chu.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });
