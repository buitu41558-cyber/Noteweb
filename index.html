<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria FC</title>
    <!-- Tailwind CSS (Giao diện màu trắng tối giản) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        .pitch-horizontal { background-color: #1b5e20; border: 4px solid #ffffff; }
    </style>
</head>
<body class="pb-24 select-none">

    <!-- HEADER TOP -->
    <header class="bg-white border-b border-gray-200 p-4 sticky top-0 z-30 shadow-sm flex justify-between items-center max-w-5xl mx-auto">
        <h1 class="text-xl font-black text-gray-900 tracking-wider">VICTORIA FC</h1>
        <div id="user-profile-bar" class="flex items-center gap-2"></div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-5xl mx-auto p-4">

        <!-- MODAL AUTH -->
        <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded-xl w-96 shadow-2xl border border-gray-100">
                <div class="flex border-b border-gray-200 mb-4">
                    <button id="auth-tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-bold border-b-2 border-gray-900 text-gray-900">Đăng Nhập</button>
                    <button id="auth-tab-register-btn" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-700">Đăng Ký</button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-gray-600 block mb-1">Tên tài khoản</label>
                        <input type="text" id="auth-user" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-gray-800">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600 block mb-1">Mật khẩu</label>
                        <input type="password" id="auth-pass" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-gray-800">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-red-600 block mb-1">Mật khẩu Admin</label>
                        <input type="password" id="admin-pass" placeholder="Nhập nếu là Admin" class="w-full border border-red-200 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                    </div>

                    <button id="auth-submit-btn" onclick="handleAuthSubmit()" class="w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-800 transition shadow">Xác Nhận</button>
                </div>
            </div>
        </div>

        <!-- TAB 1: CHỌN ĐỘI BÓNG -->
        <section id="tab-select-team" class="tab-content">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                <h2 class="text-base font-bold text-gray-800">Danh Sách Đội Bóng</h2>
            </div>
            <div id="team-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </section>

        <!-- TAB 2: XẾP ĐỘI HÌNH -->
        <section id="tab-tactics" class="tab-content hidden">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-gray-800">Sơ Đồ Chiến Thuật</h2>
                <select id="formation-select" onchange="applyFormation(this.value)" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm bg-white font-semibold focus:outline-none">
                    <option value="4-4-2">4-4-2 Classic</option>
                    <option value="4-3-3">4-3-3 Attack</option>
                    <option value="3-4-3">3-4-3 Wide</option>
                    <option value="3-5-2">3-5-2 Balanced</option>
                    <option value="4-2-3-1">4-2-3-1 Modern</option>
                    <option value="4-1-2-1-2">4-1-2-1-2 Diamond</option>
                    <option value="5-3-2">5-3-2 Defense</option>
                    <option value="4-5-1">4-5-1 Solid</option>
                    <option value="3-4-1-2">3-4-1-2 Attack</option>
                    <option value="4-3-2-1">4-3-2-1 Tree</option>
                    <option value="5-4-1">5-4-1 Bus</option>
                    <option value="4-2-2-2">4-2-2-2 Double Pivot</option>
                </select>
            </div>

            <!-- SÂN NGANG XẾP VỊ TRÍ -->
            <div id="pitch-container" class="relative w-full h-[460px] pitch-horizontal rounded-xl shadow-inner overflow-hidden mb-4">
                <div class="absolute inset-y-0 left-1/2 border-r-2 border-white/30"></div>
                <div class="absolute w-36 h-36 border-2 border-white/30 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                <div class="absolute h-64 w-28 border-2 border-l-0 border-white/30 left-0 top-1/2 -translate-y-1/2"></div>
                <div class="absolute h-64 w-28 border-2 border-r-0 border-white/30 right-0 top-1/2 -translate-y-1/2"></div>

                <div id="pitch-slots-layer" class="absolute inset-0"></div>
            </div>

            <!-- DỰ BỊ -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm" ondragover="allowDrop(event)" ondrop="dropToBench(event)">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold uppercase text-gray-600">Hàng Ghế Dự Bị</h3>
                    <span id="bench-count" class="text-xs text-gray-400 font-mono">0 Cầu thủ</span>
                </div>
                <div id="bench-list" class="flex gap-2 overflow-x-auto min-h-[72px] p-2 bg-gray-50 border border-dashed rounded-lg border-gray-300"></div>
            </div>
        </section>

        <!-- TAB 3: TRẬN ĐẤU MÔ PHỎNG -->
        <section id="tab-match" class="tab-content hidden">
            
            <!-- CHỌN ĐỘI & BẮT ĐẦU TRẬN ĐẤU TRỰC TIẾP TRÊN TAB TRẬN ĐẤU -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 mb-4 shadow-sm space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-gray-600 block mb-1">Đội Nhà</label>
                        <select id="match-tab-home-select" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white"></select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-600 block mb-1">Đội Khách</label>
                        <select id="match-tab-away-select" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white"></select>
                    </div>
                </div>
                <button id="match-tab-start-btn" onclick="startMatchFromMatchTab()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-emerald-500 transition shadow">
                    Bắt Đầu Trận Đấu
                </button>
            </div>

            <!-- BẢNG TỶ SỐ -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 mb-4 shadow-sm flex justify-between items-center">
                <div class="text-center flex-1">
                    <h3 class="font-bold text-base text-gray-800" id="match-home-name">Đội Nhà</h3>
                </div>
                <div class="text-center px-6 border-x border-gray-100">
                    <span class="text-[10px] font-bold text-red-500 uppercase tracking-widest block mb-1" id="match-status-text">CHƯA BẮT ĐẦU</span>
                    <div class="text-3xl font-black text-gray-900" id="match-score">0 - 0</div>
                </div>
                <div class="text-center flex-1">
                    <h3 class="font-bold text-base text-gray-800" id="match-away-name">Đội Khách</h3>
                </div>
            </div>

            <!-- CANVAS SÂN BÓNG 800x460 HỖ TRỢ 22 CẦU THỦ -->
            <div class="relative flex justify-center mb-4 overflow-x-auto">
                <canvas id="matchCanvas" width="800" height="460" class="rounded-xl shadow-lg border-4 border-white"></canvas>
            </div>

            <!-- NHẬT KÝ TRẬN ĐẤU -->
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
                <h4 class="text-xs font-bold text-gray-500 uppercase mb-2">Nhật Ký Trận Đấu</h4>
                <div id="match-log" class="h-32 overflow-y-auto text-xs font-mono space-y-1 text-gray-600 bg-gray-50 p-3 rounded-lg border border-gray-100"></div>
            </div>
        </section>

        <!-- TAB 4: ADMIN PANEL -->
        <section id="tab-admin" class="tab-content hidden">
            <div class="border-b border-red-200 pb-3 mb-6">
                <h2 class="text-lg font-bold text-red-600">Admin Control Panel</h2>
            </div>

            <!-- TẠO ĐỘI -->
            <div class="bg-white p-5 rounded-xl border border-gray-200 mb-6 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-gray-800">1. Tạo Đội Bóng Mới</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="admin-team-name" placeholder="Tên Đội Bóng" class="border rounded-lg p-2 text-sm focus:outline-none focus:border-gray-800">
                    <input type="password" id="admin-team-pass" placeholder="Mật khẩu lấy đội" class="border rounded-lg p-2 text-sm focus:outline-none focus:border-gray-800">
                </div>
                <button onclick="adminCreateTeam()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-800">Tạo Đội Bóng</button>
            </div>

            <!-- THÊM CẦU THỦ -->
            <div class="bg-white p-5 rounded-xl border border-gray-200 mb-6 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-gray-800">2. Thêm Cầu Thủ Vào Đội</h3>
                <div>
                    <label class="text-xs text-gray-500 font-semibold block mb-1">Chọn Đội Bóng</label>
                    <select id="admin-select-team-for-player" class="w-full border rounded-lg p-2 text-sm bg-white"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="p-name" placeholder="Tên Cầu Thủ" class="border rounded-lg p-2 text-sm focus:outline-none focus:border-gray-800">
                    <select id="p-pos" class="border rounded-lg p-2 text-sm bg-white">
                        <option value="GK">Thủ Môn (GK)</option>
                        <option value="CB">Hậu Vệ (CB)</option>
                        <option value="LB">Hậu Vệ Trái (LB)</option>
                        <option value="RB">Hậu Vệ Phải (RB)</option>
                        <option value="CM">Tiền Vệ (CM)</option>
                        <option value="CAM">Tiền Vệ Tấn Công (CAM)</option>
                        <option value="ST">Tiền Đạo (ST)</option>
                        <option value="LW">Tiền Đạo Trái (LW)</option>
                        <option value="RW">Tiền Đạo Phải (RW)</option>
                    </select>
                </div>
                <div class="grid grid-cols-3 md:grid-cols-6 gap-2 text-xs bg-gray-50 p-3 rounded-lg border border-gray-100">
                    <div>PAC: <input type="number" id="st-speed" value="80" class="border rounded p-1 w-full mt-1"></div>
                    <div>SHO: <input type="number" id="st-shoot" value="75" class="border rounded p-1 w-full mt-1"></div>
                    <div>PAS: <input type="number" id="st-pass" value="75" class="border rounded p-1 w-full mt-1"></div>
                    <div>DRI: <input type="number" id="st-dribble" value="75" class="border rounded p-1 w-full mt-1"></div>
                    <div>DEF: <input type="number" id="st-def" value="60" class="border rounded p-1 w-full mt-1"></div>
                    <div>PHY: <input type="number" id="st-phy" value="70" class="border rounded p-1 w-full mt-1"></div>
                </div>
                <button onclick="adminAddPlayer()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-500">Thêm Cầu Thủ</button>
            </div>
        </section>

    </main>

    <!-- NAVIGATION BAR -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 flex justify-around p-2 text-xs font-semibold z-40 shadow-lg max-w-5xl mx-auto">
        <button onclick="switchTab('tab-select-team')" class="nav-btn flex-1 py-2 text-center text-gray-700 hover:text-black">Đội hình (Chọn đội)</button>
        <button onclick="switchTab('tab-tactics')" class="nav-btn flex-1 py-2 text-center text-gray-700 hover:text-black">Đội hình (Xếp đội hình)</button>
        <button onclick="switchTab('tab-match')" class="nav-btn flex-1 py-2 text-center text-gray-700 hover:text-black">Trận đấu</button>
        <button id="nav-admin-btn" onclick="switchTab('tab-admin')" class="nav-btn flex-1 py-2 text-center text-red-600 hover:text-red-800 hidden">Admin Panel</button>
    </nav>

    <!-- JAVASCRIPT CODE ENGINE -->
    <script>
        let registeredUsers = JSON.parse(localStorage.getItem('vic_registered_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('vic_user')) || null;
        let teams = JSON.parse(localStorage.getItem('vic_teams')) || [];
        let pitchAssignments = JSON.parse(localStorage.getItem('vic_assignments')) || {};
        let currentAuthMode = 'login';
        let currentFormationKey = '4-4-2';

        // ENGINE MATCH VARS
        let canvas = document.getElementById('matchCanvas');
        let ctx = canvas.getContext('2d');
        let matchInterval = null;
        let isMatchRunning = false;
        let ball = { x: 400, y: 230, vx: 0, vy: 0 };

        // TỌA ĐỘ BẮT ĐẦU CHO ĐỦ 11 CẦU THỦ BÊN TRÁI & 11 CẦU THỦ BÊN PHẢI
        const BASE_POS_HOME = [
            { x: 60, y: 230 },  { x: 170, y: 70 },  { x: 160, y: 175 }, { x: 160, y: 285 },
            { x: 170, y: 390 }, { x: 280, y: 70 },  { x: 270, y: 175 }, { x: 270, y: 285 },
            { x: 280, y: 390 }, { x: 375, y: 175 }, { x: 375, y: 285 }
        ];

        const BASE_POS_AWAY = [
            { x: 740, y: 230 }, { x: 630, y: 70 },  { x: 640, y: 175 }, { x: 640, y: 285 },
            { x: 630, y: 390 }, { x: 520, y: 70 },  { x: 530, y: 180 }, { x: 530, y: 280 },
            { x: 520, y: 390 }, { x: 425, y: 175 }, { x: 425, y: 285 }
        ];

        let homePlayers = [];
        let awayPlayers = [];

        window.onload = function() {
            initDefaultMatchPlayers();
            renderHorizontalMatchPitch();
            if (currentUser) {
                document.getElementById('auth-modal').classList.add('hidden');
                updateUserUI();
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        };

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            const loginBtn = document.getElementById('auth-tab-login-btn');
            const regBtn = document.getElementById('auth-tab-register-btn');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-2 text-sm font-bold border-b-2 border-gray-900 text-gray-900";
                regBtn.className = "flex-1 py-2 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-700";
            } else {
                regBtn.className = "flex-1 py-2 text-sm font-bold border-b-2 border-gray-900 text-gray-900";
                loginBtn.className = "flex-1 py-2 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-700";
            }
        }

        function handleAuthSubmit() {
            const u = document.getElementById('auth-user').value.trim();
            const p = document.getElementById('auth-pass').value.trim();
            const adminP = document.getElementById('admin-pass').value.trim();

            if (!u || !p) return alert("Vui lòng nhập tên tài khoản và mật khẩu!");

            let role = (adminP === 'hellovictoria123') ? 'admin' : 'user';

            if (currentAuthMode === 'register') {
                const exist = registeredUsers.some(user => user.username.toLowerCase() === u.toLowerCase());
                if (exist) return alert("Tài khoản này đã tồn tại! Chọn tên khác.");

                const newUser = { username: u, password: p, role: role, claimedTeamId: null };
                registeredUsers.push(newUser);
                localStorage.setItem('vic_registered_users', JSON.stringify(registeredUsers));

                currentUser = newUser;
                localStorage.setItem('vic_user', JSON.stringify(currentUser));
                document.getElementById('auth-modal').classList.add('hidden');
                updateUserUI();
                alert("Đăng ký thành công!");
            } else {
                const user = registeredUsers.find(user => user.username.toLowerCase() === u.toLowerCase() && user.password === p);
                if (!user) return alert("Sai tên tài khoản hoặc mật khẩu!");

                if (adminP === 'hellovictoria123') user.role = 'admin';

                currentUser = user;
                localStorage.setItem('vic_user', JSON.stringify(currentUser));
                document.getElementById('auth-modal').classList.add('hidden');
                updateUserUI();
            }
        }

        function promptAdminUpgrade() {
            const key = prompt("Nhập mật khẩu xác minh Admin:");
            if (key === 'hellovictoria123') {
                currentUser.role = 'admin';
                localStorage.setItem('vic_user', JSON.stringify(currentUser));

                const userInDb = registeredUsers.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
                if (userInDb) {
                    userInDb.role = 'admin';
                    localStorage.setItem('vic_registered_users', JSON.stringify(registeredUsers));
                }

                alert("Tài khoản đã nâng cấp thành ADMIN!");
                updateUserUI();
            } else if (key !== null) {
                alert("Mật khẩu Admin không đúng!");
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('vic_user');
            document.getElementById('user-profile-bar').innerHTML = '';
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('nav-admin-btn').classList.add('hidden');
        }

        function updateUserUI() {
            if (!currentUser) return;

            const claimedTeam = teams.find(t => t.id == currentUser.claimedTeamId);
            const teamNameText = claimedTeam ? claimedTeam.name : 'Chưa có đội';

            const profileBar = document.getElementById('user-profile-bar');
            profileBar.innerHTML = `
                <div class="text-right">
                    <div class="text-xs font-bold text-gray-900">${currentUser.username} <span class="text-[10px] ${currentUser.role === 'admin' ? 'bg-red-100 text-red-600' : 'bg-gray-100 text-gray-600'} px-1.5 py-0.5 rounded font-mono uppercase">${currentUser.role}</span></div>
                    <div class="text-[11px] text-emerald-600 font-semibold">${teamNameText}</div>
                </div>
                ${currentUser.role !== 'admin' ? `
                    <button onclick="promptAdminUpgrade()" class="text-xs bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-300 px-2 py-1 rounded-lg font-semibold transition">
                        Kích hoạt Admin
                    </button>
                ` : ''}
                <button onclick="handleLogout()" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-2.5 py-1 rounded-lg font-semibold transition">
                    Đăng xuất
                </button>
            `;

            if (currentUser.role === 'admin') {
                document.getElementById('nav-admin-btn').classList.remove('hidden');
            } else {
                document.getElementById('nav-admin-btn').classList.add('hidden');
            }

            renderTeamList();
            renderSelectOptions();
            applyFormation(currentFormationKey);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            if (tabId === 'tab-match') renderHorizontalMatchPitch();
        }

        // --- CẤU HÌNH SƠ ĐỒ THAY ĐỔI ---
        const FORMATIONS = {
            '4-4-2': [
                { slotId: 0, pos: 'GK', x: 8, y: 50 },
                { slotId: 1, pos: 'LB', x: 24, y: 15 }, { slotId: 2, pos: 'LCB', x: 24, y: 38 }, { slotId: 3, pos: 'RCB', x: 24, y: 62 }, { slotId: 4, pos: 'RB', x: 24, y: 85 },
                { slotId: 5, pos: 'LM', x: 50, y: 15 }, { slotId: 6, pos: 'LCM', x: 50, y: 38 }, { slotId: 7, pos: 'RCM', x: 50, y: 62 }, { slotId: 8, pos: 'RM', x: 50, y: 85 },
                { slotId: 9, pos: 'LS', x: 78, y: 35 }, { slotId: 10, pos: 'RS', x: 78, y: 65 }
            ],
            '4-3-3': [
                { slotId: 0, pos: 'GK', x: 8, y: 50 },
                { slotId: 1, pos: 'LB', x: 24, y: 15 }, { slotId: 2, pos: 'LCB', x: 24, y: 38 }, { slotId: 3, pos: 'RCB', x: 24, y: 62 }, { slotId: 4, pos: 'RB', x: 24, y: 85 },
                { slotId: 5, pos: 'LCM', x: 48, y: 28 }, { slotId: 6, pos: 'CDM', x: 42, y: 50 }, { slotId: 7, pos: 'RCM', x: 48, y: 72 },
                { slotId: 8, pos: 'LW', x: 78, y: 18 }, { slotId: 9, pos: 'ST', x: 82, y: 50 }, { slotId: 10, pos: 'RW', x: 78, y: 82 }
            ],
            '3-4-3': [
                { slotId: 0, pos: 'GK', x: 8, y: 50 },
                { slotId: 1, pos: 'LCB', x: 24, y: 22 }, { slotId: 2, pos: 'CB', x: 24, y: 50 }, { slotId: 3, pos: 'RCB', x: 24, y: 78 },
                { slotId: 4, pos: 'LM', x: 50, y: 15 }, { slotId: 5, pos: 'LCM', x: 50, y: 38 }, { slotId: 6, pos: 'RCM', x: 50, y: 62 }, { slotId: 7, pos: 'RM', x: 50, y: 85 },
                { slotId: 8, pos: 'LW', x: 78, y: 18 }, { slotId: 9, pos: 'ST', x: 82, y: 50 }, { slotId: 10, pos: 'RW', x: 78, y: 82 }
            ],
            '3-5-2': [
                { slotId: 0, pos: 'GK', x: 8, y: 50 },
                { slotId: 1, pos: 'LCB', x: 24, y: 22 }, { slotId: 2, pos: 'CB', x: 24, y: 50 }, { slotId: 3, pos: 'RCB', x: 24, y: 78 },
                { slotId: 4, pos: 'LM', x: 50, y: 12 }, { slotId: 5, pos: 'LDM', x: 44, y: 35 }, { slotId: 6, pos: 'CAM', x: 60, y: 50 }, { slotId: 7, pos: 'RDM', x: 44, y: 65 }, { slotId: 8, pos: 'RM', x: 50, y: 88 },
                { slotId: 9, pos: 'LS', x: 78, y: 35 }, { slotId: 10, pos: 'RS', x: 78, y: 65 }
            ],
            '4-2-3-1': [
                { slotId: 0, pos: 'GK', x: 8, y: 50 },
                { slotId: 1, pos: 'LB', x: 24, y: 15 }, { slotId: 2, pos: 'LCB', x: 24, y: 38 }, { slotId: 3, pos: 'RCB', x: 24, y: 62 }, { slotId: 4, pos: 'RB', x: 24, y: 85 },
                { slotId: 5, pos: 'LDM', x: 42, y: 35 }, { slotId: 6, pos: 'RDM', x: 42, y: 65 },
                { slotId: 7, pos: 'LAM', x: 62, y: 20 }, { slotId: 8, pos: 'CAM', x: 64, y: 50 }, { slotId: 9, pos: 'RAM', x: 62, y: 80 },

        function applyFormation(key) {
            currentFormationKey = key || '4-4-2';
            const slots = FORMATIONS[currentFormationKey];
            const layer = document.getElementById('pitch-slots-layer');
            layer.innerHTML = '';

            slots.forEach(slot => {
                const assignedPlayerId = pitchAssignments[slot.slotId];
                const player = assignedPlayerId ? getPlayerById(assignedPlayerId) : null;

                const slotEl = document.createElement('div');
                slotEl.className = `absolute border-2 border-dashed rounded-lg p-1 w-20 h-16 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-between text-center transition ${
                    player ? 'bg-white border-gray-800 shadow-md' : 'border-white/50 bg-black/20 hover:border-white'
                }`;
                slotEl.style.left = `${slot.x}%`;
                slotEl.style.top = `${slot.y}%`;

                slotEl.setAttribute('ondragover', 'allowDrop(event)');
                slotEl.setAttribute('ondrop', `dropToPitchSlot(event, ${slot.slotId})`);

                if (player) {
                    slotEl.innerHTML = `
                        <div class="text-[10px] font-bold text-blue-600">${slot.pos}</div>
                        <div class="text-xs font-black text-gray-800 truncate w-full">${player.name}</div>
                        <div class="text-[9px] text-gray-500 font-mono">OVR:${calcOvr(player.stats)}</div>
                    `;
                    slotEl.draggable = true;
                    slotEl.setAttribute('ondragstart', `dragStart(event, ${player.id}, 'pitch', ${slot.slotId})`);
                } else {
                    slotEl.innerHTML = `
                        <div class="text-xs font-black text-white/90 drop-shadow">${slot.pos}</div>
                        <div class="text-[9px] text-white/60 italic">[ Trống ]</div>
                    `;
                }

                layer.appendChild(slotEl);
            });

            renderBench();
        }

        function renderBench() {
            const benchContainer = document.getElementById('bench-list');
            benchContainer.innerHTML = '';

            if (!currentUser || !currentUser.claimedTeamId) {
                benchContainer.innerHTML = '<span class="text-xs text-gray-400 p-2">Chọn đội bóng ở Tab "Chọn đội" trước.</span>';
                return;
            }

            const team = teams.find(t => t.id == currentUser.claimedTeamId);
            if (!team || !team.players) return;

            const activePlayerIds = Object.values(pitchAssignments);
            const benchPlayers = team.players.filter(p => !activePlayerIds.includes(p.id));

            document.getElementById('bench-count').innerText = `${benchPlayers.length} Cầu thủ`;

            if (benchPlayers.length === 0) {
                benchContainer.innerHTML = '<span class="text-xs text-gray-400 p-2">Tất cả cầu thủ đã được xếp lên sân.</span>';
                return;
            }

            benchPlayers.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-300 rounded-lg px-3 py-1.5 min-w-[100px] shadow-sm cursor-grab active:cursor-grabbing hover:border-gray-600 transition";
                card.draggable = true;
                card.setAttribute('ondragstart', `dragStart(event, ${p.id}, 'bench')`);
                card.innerHTML = `
                    <div class="text-xs font-bold text-gray-800">${p.name}</div>
                    <div class="flex justify-between items-center text-[10px] text-gray-500 mt-0.5">
                        <span class="font-bold text-blue-600">${p.pos}</span>
                        <span>OVR: ${calcOvr(p.stats)}</span>
                    </div>
                `;
                benchContainer.appendChild(card);
            });
        }

        let draggedData = null;

        function dragStart(event, playerId, sourceType, fromSlotId = null) {
            draggedData = { playerId, sourceType, fromSlotId };
            event.dataTransfer.setData("text/plain", playerId);
        }

        function allowDrop(event) {
            event.preventDefault();
        }

        function dropToPitchSlot(event, targetSlotId) {
            event.preventDefault();
            if (!draggedData) return;

            const { playerId, sourceType, fromSlotId } = draggedData;

            if (sourceType === 'pitch' && fromSlotId !== null) {
                const existingPlayerAtTarget = pitchAssignments[targetSlotId];
                pitchAssignments[targetSlotId] = playerId;
                pitchAssignments[fromSlotId] = existingPlayerAtTarget || undefined;
            } else if (sourceType === 'bench') {
                pitchAssignments[targetSlotId] = playerId;
            }

            draggedData = null;
            localStorage.setItem('vic_assignments', JSON.stringify(pitchAssignments));
            applyFormation(currentFormationKey);
        }

        function dropToBench(event) {
            event.preventDefault();
            if (!draggedData) return;

            if (draggedData.sourceType === 'pitch' && draggedData.fromSlotId !== null) {
                delete pitchAssignments[draggedData.fromSlotId];
            }

            draggedData = null;
            localStorage.setItem('vic_assignments', JSON.stringify(pitchAssignments));
            applyFormation(currentFormationKey);
        }

        function getPlayerById(id) {
            if (!currentUser || !currentUser.claimedTeamId) return null;
            const team = teams.find(t => t.id == currentUser.claimedTeamId);
            return team ? team.players.find(p => p.id == id) : null;
        }

        function calcOvr(s) {
            if (!s) return 70;
            return Math.round((s.speed + s.shoot + s.pass + s.dribble + s.def + s.phy) / 6);
        }

        // --- ADMIN CONTROLS ---
        function adminCreateTeam() {
            const name = document.getElementById('admin-team-name').value.trim();
            const pass = document.getElementById('admin-team-pass').value.trim();

            if (!name || !pass) return alert("Vui lòng nhập tên và mật khẩu lấy đội!");

            const newTeam = { id: Date.now(), name: name, pass: pass, players: [] };
            teams.push(newTeam);
            localStorage.setItem('vic_teams', JSON.stringify(teams));
            alert(`Đã tạo đội: ${name}`);

            document.getElementById('admin-team-name').value = '';
            document.getElementById('admin-team-pass').value = '';

            renderTeamList();
            renderSelectOptions();
        }

        function adminAddPlayer() {
            const teamId = document.getElementById('admin-select-team-for-player').value;
            const name = document.getElementById('p-name').value.trim();
            const pos = document.getElementById('p-pos').value;

            if (!teamId || !name) return alert("Chọn đội và nhập tên cầu thủ!");

            const player = {
                id: Date.now(),
                name: name,
                pos: pos,
                stats: {
                    speed: parseInt(document.getElementById('st-speed').value) || 75,
                    shoot: parseInt(document.getElementById('st-shoot').value) || 70,
                    pass: parseInt(document.getElementById('st-pass').value) || 70,
                    dribble: parseInt(document.getElementById('st-dribble').value) || 70,
                    def: parseInt(document.getElementById('st-def').value) || 60,
                    phy: parseInt(document.getElementById('st-phy').value) || 70
                }
            };

            const team = teams.find(t => t.id == teamId);
            team.players.push(player);
            localStorage.setItem('vic_teams', JSON.stringify(teams));
            alert(`Đã thêm cầu thủ ${name} vào đội ${team.name}`);

            document.getElementById('p-name').value = '';
            if (currentUser && currentUser.claimedTeamId == teamId) applyFormation(currentFormationKey);
        }

        function renderTeamList() {
            const container = document.getElementById('team-list');
            container.innerHTML = '';

            if (teams.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 col-span-2">Chưa có đội bóng nào do Admin tạo.</p>';
                return;
            }

            teams.forEach(t => {
                const isClaimedByMe = currentUser && currentUser.claimedTeamId == t.id;
                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-xl border ${isClaimedByMe ? 'border-emerald-500 ring-2 ring-emerald-500/20' : 'border-gray-200'} flex justify-between items-center shadow-sm`;
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-sm text-gray-800">${t.name}</div>
                        <div class="text-xs text-gray-400 mt-0.5">Cầu thủ: ${t.players ? t.players.length : 0}</div>
                    </div>
                    <button onclick="claimTeam(${t.id})" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${isClaimedByMe ? 'bg-emerald-600 text-white' : 'bg-gray-900 text-white hover:bg-gray-800'}">
                        ${isClaimedByMe ? 'Đang Chọn' : 'Lấy Đội'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function claimTeam(teamId) {
            const team = teams.find(t => t.id == teamId);
            const inputPass = prompt(`Nhập mật khẩu lấy đội ${team.name}:`);

            if (inputPass === team.pass) {
                currentUser.claimedTeamId = teamId;
                localStorage.setItem('vic_user', JSON.stringify(currentUser));

                const userInDb = registeredUsers.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
                if (userInDb) {
                    userInDb.claimedTeamId = teamId;
                    localStorage.setItem('vic_registered_users', JSON.stringify(registeredUsers));
                }

                pitchAssignments = {};
                localStorage.setItem('vic_assignments', JSON.stringify(pitchAssignments));

                alert(`Đã lấy thành công đội ${team.name}`);
                updateUserUI();
            } else if (inputPass !== null) {
                alert("Mật khẩu đội không đúng!");
            }
        }

        function renderSelectOptions() {
            const playerTeamSel = document.getElementById('admin-select-team-for-player');
            const matchHomeSel = document.getElementById('match-tab-home-select');
            const matchAwaySel = document.getElementById('match-tab-away-select');

            [playerTeamSel, matchHomeSel, matchAwaySel].forEach(s => {
                if (s) s.innerHTML = '';
            });

            teams.forEach(t => {
                const opt = `<option value="${t.id}">${t.name}</option>`;
                if (playerTeamSel) playerTeamSel.innerHTML += opt;
                if (matchHomeSel) matchHomeSel.innerHTML += opt;
                if (matchAwaySel) matchAwaySel.innerHTML += opt;
            });
        }

        // --- MATCH ENGINE: LOAD ĐỦ 11 CẦU THỦ MỖI ĐỘI & MÔ PHỎNG ---
        function initDefaultMatchPlayers() {
            homePlayers = BASE_POS_HOME.map((pos, idx) => ({
                x: pos.x, y: pos.y, color: '#2563eb', num: `${idx + 1}`, name: `Cầu thủ ${idx + 1}`, speed: 2.2, shoot: 75
            }));

            awayPlayers = BASE_POS_AWAY.map((pos, idx) => ({
                x: pos.x, y: pos.y, color: '#dc2626', num: `${idx + 1}`, name: `Cầu thủ ${idx + 1}`, speed: 2.2, shoot: 75
            }));
        }

        function startMatchFromMatchTab() {
            const hId = document.getElementById('match-tab-home-select').value;
            const aId = document.getElementById('match-tab-away-select').value;

            if (!hId || !aId) return alert("Cần chọn đầy đủ Đội Nhà và Đội Khách!");
            if (hId === aId) return alert("Chọn 2 đội khác nhau!");

            const homeTeam = teams.find(t => t.id == hId);
            const awayTeam = teams.find(t => t.id == aId);

            document.getElementById('match-home-name').innerText = homeTeam.name;
            document.getElementById('match-away-name').innerText = awayTeam.name;
            document.getElementById('match-status-text').innerText = "ĐANG THI ĐẤU";
            document.getElementById('match-score').innerText = "0 - 0";

            // LOAD ĐỦ 11 CẦU THỦ CHO ĐỘI NHÀ & ĐỘI KHÁCH
            homePlayers = BASE_POS_HOME.map((pos, idx) => {
                const p = (homeTeam.players && homeTeam.players[idx]) ? homeTeam.players[idx] : null;
                return {
                    x: pos.x,
                    y: pos.y,
                    color: '#2563eb',
                    num: `${idx + 1}`,
                    name: p ? p.name : `P${idx + 1}`,
                    speed: p ? (p.stats.speed / 35) : 2.2,
                    shoot: p ? p.stats.shoot : 75
                };
            });

            awayPlayers = BASE_POS_AWAY.map((pos, idx) => {
                const p = (awayTeam.players && awayTeam.players[idx]) ? awayTeam.players[idx] : null;
                return {
                    x: pos.x,
                    y: pos.y,
                    color: '#dc2626',
                    num: `${idx + 1}`,
                    name: p ? p.name : `P${idx + 1}`,
                    speed: p ? (p.stats.speed / 35) : 2.2,
                    shoot: p ? p.stats.shoot : 75
                };
            });

            isMatchRunning = true;
            ball = { x: 400, y: 230, vx: 0, vy: 0 };

            logMatch(`Trận đấu bắt đầu: ${homeTeam.name} vs ${awayTeam.name}`);

            if (matchInterval) clearInterval(matchInterval);
            matchInterval = setInterval(updateMatchLoop, 1000 / 30);
        }

        function renderHorizontalMatchPitch() {
            // Cỏ sọc
            const stripeWidth = 50;
            for (let i = 0; i < canvas.width; i += stripeWidth) {
                ctx.fillStyle = (i / stripeWidth) % 2 === 0 ? '#1e7e34' : '#1b5e20';
                ctx.fillRect(i, 0, stripeWidth, canvas.height);
            }

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;

            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            // Vạch giữa sân
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 20);
            ctx.lineTo(canvas.width / 2, canvas.height - 20);
            ctx.stroke();

            // Vòng tròn trung tâm
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Khung thành Trái
            ctx.strokeRect(20, (canvas.height - 260) / 2, 140, 260);
            ctx.strokeRect(20, (canvas.height - 120) / 2, 50, 120);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(5, (canvas.height - 90) / 2, 15, 90);
            ctx.strokeRect(5, (canvas.height - 90) / 2, 15, 90);

            // Khung thành Phải
            ctx.strokeRect(canvas.width - 160, (canvas.height - 260) / 2, 140, 260);
            ctx.strokeRect(canvas.width - 70, (canvas.height - 120) / 2, 50, 120);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(canvas.width - 20, (canvas.height - 90) / 2, 15, 90);
            ctx.strokeRect(canvas.width - 20, (canvas.height - 90) / 2, 15, 90);

            // Vẽ Bóng
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.stroke();

            // Vẽ ĐỦ 11 CẦU THỦ BÊN TRÁI
            homePlayers.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.num, p.x, p.y);
            });

            // Vẽ ĐỦ 11 CẦU THỦ BÊN PHẢI
            awayPlayers.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.num, p.x, p.y);
            });
        }

        function updateMatchLoop() {
            if (!isMatchRunning) return;

            // Đội Nhà
            homePlayers.forEach(p => {
                let dx = ball.x - p.x;
                let dy = ball.y - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist > 15) {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                } else {
                    ball.vx = 8;
                    ball.vy = (Math.random() - 0.5) * 6;
                }
            });

            // Đội Khách
            awayPlayers.forEach(p => {
                let dx = ball.x - p.x;
                let dy = ball.y - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist > 15) {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                } else {
                    ball.vx = -8;
                    ball.vy = (Math.random() - 0.5) * 6;
                }
            });

            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= 0.95;
            ball.vy *= 0.95;

            renderHorizontalMatchPitch();

            // Ghi bàn
            if (ball.x > 780 && ball.y > 180 && ball.y < 270) {
                logMatch(`VÀOOOO! Đội nhà ghi bàn!`);
                ball = { x: 400, y: 230, vx: 0, vy: 0 };
            } else if (ball.x < 20 && ball.y > 180 && ball.y < 270) {
                logMatch(`VÀOOOO! Đội khách ghi bàn!`);
                ball = { x: 400, y: 230, vx: 0, vy: 0 };
            }
        }

        function logMatch(msg) {
            const logBox = document.getElementById('match-log');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<p><span class="text-gray-400">[${time}]</span> ${msg}</p>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
