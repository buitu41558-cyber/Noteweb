<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Football Simulation - Reality Physics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    #game-container {
      display: flex;
      gap: 15px;
      background: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #canvas-wrapper {
      position: relative;
    }
    canvas {
      background: #388e3c;
      border: 4px solid #fff;
      border-radius: 4px;
      display: block;
    }
    #sidebar {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .scoreboard {
      background: #111;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid #444;
    }
    .score-title { font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .score-display { font-size: 24px; font-weight: bold; color: #4caf50; }
    .stats-panel, .log-panel {
      background: #111;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      font-size: 13px;
    }
    .stats-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .log-panel {
      height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      color: #ddd;
    }
    .log-item { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }
    .controls { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 8px;
      background: #4caf50;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
    button#reset-btn { background: #f44336; }
    button#reset-btn:hover { background: #da190b; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="canvas-wrapper">
      <canvas id="pitch" width="800" height="500"></canvas>
    </div>

    <div id="sidebar">
      <div class="scoreboard">
        <div class="score-title">TRẬN ĐẤU GIẢ LẬP</div>
        <div class="score-display" id="score">RED 0 - 0 BLUE</div>
      </div>

      <div class="stats-panel">
        <div class="stats-row"><span>Sút bóng:</span><span id="stat-shots">0 - 0</span></div>
        <div class="stats-row"><span>Phạm lỗi:</span><span id="stat-fouls">0 - 0</span></div>
        <div class="stats-row"><span>Kiểm soát bóng:</span><span id="stat-possession">50% - 50%</span></div>
      </div>

      <div class="log-panel" id="match-log">
        <div class="log-item">--- Trận đấu bắt đầu ---</div>
      </div>

      <div class="controls">
        <button id="pause-btn">Tạm dừng</button>
        <button id="reset-btn">Làm mới</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pitch');
    const ctx = canvas.getContext('2d');

    let isRunning = true;
    let matchStats = { homeGoals: 0, awayGoals: 0, homeShots: 0, awayShots: 0, homeFouls: 0, awayFouls: 0, homePoss: 50 };

    // Khởi tạo Bóng
    const ballState = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 0,
      vy: 0,
      owner: null,
      radius: 5
    };

    // Khởi tạo Trọng tài
    const refereeState = { x: canvas.width / 2, y: canvas.height / 2 - 50 };

    // Khởi tạo Cầu thủ (Home: Red, Away: Blue)
    function createTeam(isHome) {
      const team = [];
      const color = isHome ? '#e53935' : '#1e88e5';
      const startX = isHome ? 100 : canvas.width - 100;

      // 1 GK, 2 DEF, 2 MID, 1 FW
      const positions = [
        { role: 'GK', x: isHome ? 40 : canvas.width - 40, y: canvas.height / 2, pac: 50, phy: 80, def: 85, dri: 40 },
        { role: 'DEF', x: isHome ? 180 : canvas.width - 180, y: 150, pac: 65, phy: 85, def: 80, dri: 50 },
        { role: 'DEF', x: isHome ? 180 : canvas.width - 180, y: 350, pac: 65, phy: 85, def: 80, dri: 50 },
        { role: 'MID', x: isHome ? 320 : canvas.width - 320, y: 180, pac: 75, phy: 70, def: 65, dri: 75 },
        { role: 'MID', x: isHome ? 320 : canvas.width - 320, y: 320, pac: 75, phy: 70, def: 65, dri: 75 },
        { role: 'FW',  x: isHome ? 380 : canvas.width - 380, y: 250, pac: 85, phy: 70, def: 40, dri: 85 }
      ];

      positions.forEach((p, index) => {
        team.push({
          id: (isHome ? 'H' : 'A') + (index + 1),
          name: (isHome ? 'Red ' : 'Blue ') + (index + 1),
          isHome: isHome,
          color: color,
          role: p.role,
          x: p.x,
          y: p.y,
          baseX: p.x,
          baseY: p.y,
          pac: p.pac,
          phy: p.phy,
          def: p.def,
          dri: p.dri,
          cooldown: 0
        });
      });
      return team;
    }

    let homeTeamState = createTeam(true);
    let awayTeamState = createTeam(false);

    // LOGGING SYSTEM
    function logMatch(msg) {
      const logBox = document.getElementById('match-log');
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerText = msg;
      logBox.appendChild(item);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updateStatsUI() {
      document.getElementById('score').innerText = `RED ${matchStats.homeGoals} - ${matchStats.awayGoals} BLUE`;
      document.getElementById('stat-shots').innerText = `${matchStats.homeShots} - ${matchStats.awayShots}`;
      document.getElementById('stat-fouls').innerText = `${matchStats.homeFouls} - ${matchStats.awayFouls}`;
    }

    // ACTIONS
    function triggerShot(p, targetX, targetY) {
      if (p.isHome) matchStats.homeShots++; else matchStats.awayShots++;
      
      const angle = Math.atan2(targetY - p.y, targetX - p.x);
      const power = 9 + Math.random() * 3;
      
      ballState.owner = null;
      ballState.vx = Math.cos(angle) * power;
      ballState.vy = Math.sin(angle) * power;
      p.cooldown = 20;

      logMatch(`${p.name} dứt điểm căng về phía khung thành!`);
      updateStatsUI();
    }

    function triggerPass(p) {
      const teammates = (p.isHome ? homeTeamState : awayTeamState).filter(t => t !== p);
      const target = teammates[Math.floor(Math.random() * teammates.length)];

      const angle = Math.atan2(target.y - p.y, target.x - p.x);
      ballState.owner = null;
      ballState.vx = Math.cos(angle) * 6;
      ballState.vy = Math.sin(angle) * 6;
      p.cooldown = 15;
    }

    // AI ENGINE (VẬT LÝ VÀ TRANH CHẤP CHÂN THỰC)
    function updateAIEngine() {
      const allPlayers = [...homeTeamState, ...awayTeamState];

      // Trọng tài di chuyển
      refereeState.x += (ballState.x - refereeState.x) * 0.03;
      refereeState.y += (ballState.y - 40 - refereeState.y) * 0.03;

      // Cập nhật bóng khi ko ai giữ
      if (!ballState.owner) {
        ballState.x += ballState.vx;
        ballState.y += ballState.vy;
        ballState.vx *= 0.95;
        ballState.vy *= 0.95;

        // Va chạm biên / Goal
        if (ballState.y <= 10 || ballState.y >= canvas.height - 10) ballState.vy *= -1;
        if (ballState.x <= 10) {
          if (ballState.y > 200 && ballState.y < 300) {
            matchStats.awayGoals++;
            logMatch(`VÀOOO! Blue ghi bàn!`);
            resetPositions();
          } else {
            ballState.vx *= -1;
          }
        }
        if (ballState.x >= canvas.width - 10) {
          if (ballState.y > 200 && ballState.y < 300) {
            matchStats.homeGoals++;
            logMatch(`VÀOOO! Red ghi bàn!`);
            resetPositions();
          } else {
            ballState.vx *= -1;
          }
        }
      }

      // Logic Cầu thủ
      allPlayers.forEach(p => {
        if (p.cooldown > 0) p.cooldown--;

        let speed = (p.pac / 200) * 2.0 + 1.0;
        const distToBall = Math.hypot(ballState.x - p.x, ballState.y - p.y);

        // NẾU ĐANG GIỮ BÓNG
        if (ballState.owner === p) {
          const targetGoalX = p.isHome ? canvas.width - 20 : 20;
          const targetGoalY = canvas.height / 2;
          const distToGoal = Math.hypot(targetGoalX - p.x, targetGoalY - p.y);

          // Tỳ đè tỳ vết: Kiểm tra đối phương ép sát
          const enemyNear = allPlayers.find(e => e.isHome !== p.isHome && Math.hypot(e.x - p.x, e.y - p.y) < 18);
          if (enemyNear) {
            // Giảm tốc độ do bị đè, KHÔNG văng ra
            const phyDiff = (enemyNear.phy - p.phy) / 100;
            speed = Math.max(0.5, speed * (0.65 - phyDiff * 0.2));
          }

          const angle = Math.atan2(targetGoalY - p.y, targetGoalX - p.x);
          p.x += Math.cos(angle) * (speed * 0.7);
          p.y += Math.sin(angle) * (speed * 0.7);

          ballState.x = p.x + Math.cos(angle) * 8;
          ballState.y = p.y + Math.sin(angle) * 8;

          if (distToGoal < 150 || (distToGoal < 220 && Math.random() < 0.025)) {
            triggerShot(p, targetGoalX, targetGoalY);
          } else if (Math.random() < 0.03 || enemyNear) {
            triggerPass(p);
          }
        } 
        // NẾU KO GIỮ BÓNG
        else {
          if (distToBall < 180 && p.cooldown === 0) {
            const angle = Math.atan2(ballState.y - p.y, ballState.x - p.x);
            p.x += Math.cos(angle) * speed;
            p.y += Math.sin(angle) * speed;

            // Tiếp cận sát tranh chấp
            if (distToBall < 12) {
              if (ballState.owner) {
                const owner = ballState.owner;
                const stealChance = (p.def * 0.6 + p.phy * 0.4) - (owner.dri * 0.5 + owner.phy * 0.5);
                
                // Tỷ lệ cướp bóng bằng tỳ đè
                if (Math.random() * 100 < (48 + stealChance * 0.3)) {
                  ballState.owner = p;
                  p.cooldown = 15;
                  owner.cooldown = 15;
                  logMatch(`${p.name} tỳ đè cướp bóng thành công từ ${owner.name}!`);
                } else if (Math.random() < 0.025) {
                  // Phạm lỗi
                  if (p.isHome) matchStats.homeFouls++; else matchStats.awayFouls++;
                  logMatch(`Còi vang! ${p.name} phạm lỗi trg pha tranh chấp.`);
                  updateStatsUI();
                  p.cooldown = 25;
                }
              } else {
                ballState.owner = p;
                p.cooldown = 10;
              }
            }
          } else {
            // Định hình lại vị trí đội hình
            let shiftX = (ballState.x - canvas.width / 2) * 0.35;
            let targetX = p.baseX + shiftX;
            let targetY = p.baseY;

            p.x += (targetX - p.x) * 0.04;
            p.y += (targetY - p.y) * 0.04;
          }
        }
      });
    }

    function resetPositions() {
      ballState.x = canvas.width / 2;
      ballState.y = canvas.height / 2;
      ballState.vx = 0;
      ballState.vy = 0;
      ballState.owner = null;

      [...homeTeamState, ...awayTeamState].forEach(p => {
        p.x = p.baseX;
        p.y = p.baseY;
        p.cooldown = 0;
      });
      updateStatsUI();
    }

    // RENDER GRAPHICS
    function drawPitch() {
      ctx.fillStyle = '#388e3c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Đường kẻ sân
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 2;

      // Đường giữa sân & Vòng tròn trung tâm
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
      ctx.stroke();

      // Vòng cấm địa (2 bên)
      ctx.strokeRect(0, 120, 100, 260);
      ctx.strokeRect(canvas.width - 100, 120, 100, 260);

      // Khung thành
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 200, 8, 100);
      ctx.fillRect(canvas.width - 8, 200, 8, 100);
    }

    function drawEntities() {
      // Vẽ Trọng tài
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.arc(refereeState.x, refereeState.y, 5, 0, Math.PI * 2);
      ctx.fill();

      // Vẽ Cầu thủ
      const allPlayers = [...homeTeamState, ...awayTeamState];
      allPlayers.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Tên cầu thủ
        ctx.fillStyle = '#fff';
        ctx.font = '9px Arial';
        ctx.fillText(p.role, p.x - 8, p.y - 11);
      });

      // Vẽ Bóng
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ballState.x, ballState.y, ballState.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.stroke();
    }

    // GAME LOOP
    function gameLoop() {
      if (isRunning) {
        updateAIEngine();
        drawPitch();
        drawEntities();
      }
      requestAnimationFrame(gameLoop);
    }

    // CONTROLS
    document.getElementById('pause-btn').addEventListener('click', (e) => {
      isRunning = !isRunning;
      e.target.innerText = isRunning ? 'Tạm dừng' : 'Tiếp tục';
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      matchStats = { homeGoals: 0, awayGoals: 0, homeShots: 0, awayShots: 0, homeFouls: 0, awayFouls: 0, homePoss: 50 };
      resetPositions();
      document.getElementById('match-log').innerHTML = '<div class="log-item">--- Trận đấu bắt đầu lại ---</div>';
    });

    // START
    gameLoop();
  </script>
</body>
</html>
