<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bản đồ thời tiết toàn cầu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #0b0d12;
      color: #d0d0d0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes stormGlow {
      0%, 100% { box-shadow: 0 0 6px currentColor; }
      50% { box-shadow: 0 0 18px currentColor, 0 0 30px currentColor; }
    }

    /* Top bar siêu gọn */
    .top-bar {
      background: #10141c;
      padding: 0.4rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px solid #1c2230;
      z-index: 1000;
      flex-wrap: wrap;
    }
    .top-bar .title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    .btns {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.3rem 0.65rem;
      border-radius: 0.3rem;
      font-weight: 500;
      font-size: 0.72rem;
      border: 1px solid #252c3a;
      cursor: pointer;
      background: #161b26;
      color: #b0b0b0;
      transition: all 0.18s;
      font-family: inherit;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }
    .btn:hover {
      background: #1e2533;
      border-color: #404a5c;
      color: #fff;
    }
    .btn:active {
      transform: scale(0.94);
    }
    .btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
      font-weight: 600;
    }
    .btn.storm-active {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
      font-weight: 600;
    }

    /* Map */
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
      background: #080a10 !important;
    }

    /* Panel nhỏ góc dưới trái */
    .info-panel {
      position: absolute;
      bottom: 16px;
      left: 10px;
      z-index: 999;
      background: #10141cee;
      border: 1px solid #1c2230;
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      backdrop-filter: blur(12px);
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 42vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.65);
      animation: slideUp 0.4s 0.1s ease both;
      min-width: 150px;
    }
    .info-panel h4 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      font-weight: 700;
    }
    .city-row {
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
      cursor: pointer;
      padding: 0.15rem 0;
      font-weight: 500;
      font-size: 0.73rem;
      transition: color 0.15s;
    }
    .city-row:hover { color: #fff; }
    .city-row .val { color: #fbbf24; font-weight: 600; }
    .storm-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      padding: 0.12rem 0;
      font-size: 0.7rem;
      transition: color 0.15s;
    }
    .storm-row:hover { color: #fff; }
    .mini-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }
    .legend {
      display: flex;
      gap: 0.5rem;
      font-size: 0.6rem;
      color: #6b7280;
      margin-top: 0.1rem;
      flex-wrap: wrap;
    }
    .legend span { display: flex;
      align-items: center;
      gap: 0.2rem; }
    .ldot { width: 5px;
      height: 5px;
      border-radius: 50%;
      display: inline-block; }

    /* Leaflet */
    .leaflet-container { background: #080a10 !important; }
    .leaflet-control-zoom a {
      background: #161b26 !important;
      color: #bbb !important;
      border-color: #252c3a !important;
    }
    .leaflet-popup-content-wrapper {
      background: #10141c;
      color: #ddd;
      border-radius: 0.4rem;
      border: 1px solid #252c3a;
      box-shadow: 0 4px 16px rgba(0,0,0,0.7);
      font-size: 0.75rem;
    }
    .leaflet-popup-tip { background: #10141c; }

    @media (max-width: 550px) {
      .btn { padding: 0.25rem 0.5rem;
        font-size: 0.68rem; }
      .info-panel { bottom: 8px;
        left: 4px;
        padding: 0.5rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="title"><span class="live-dot"></span>Thời tiết toàn cầu</div>
    <div class="btns">
      <button class="btn active" data-layer="temp">Nhiệt độ</button>
      <button class="btn" data-layer="rain">Mưa</button>
      <button class="btn" data-layer="wind">Gió</button>
      <button class="btn" data-layer="snow">Tuyết</button>
      <button class="btn" data-layer="storm" id="stormBtn">Bão</button>
      <button class="btn" data-layer="reset">⟳</button>
    </div>
  </div>

  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <h4>Thành phố</h4>
    <div id="cityList"></div>
    <h4 style="margin-top:0.15rem;">Bão</h4>
    <div id="stormList"></div>
    <div class="legend">
      <span><span class="ldot" style="background:#fbbf24;"></span>Nhiệt</span>
      <span><span class="ldot" style="background:#3b82f6;"></span>Mưa</span>
      <span><span class="ldot" style="background:#10b981;"></span>Gió</span>
      <span><span class="ldot" style="background:#a78bfa;"></span>Tuyết</span>
    </div>
  </div>

  <script>
    (() => {
      // ===== DỮ LIỆU =====
      const cities = [
        { name: 'Hà Nội', lat: 21.03, lng: 105.85, temp: 32, rain: 5, wind: 10, snow: 0, cond: 'Nắng' },
        { name: 'Tokyo', lat: 35.68, lng: 139.65, temp: 22, rain: 45, wind: 18, snow: 0, cond: 'Mưa nhẹ' },
        { name: 'New York', lat: 40.71, lng: -74.0, temp: 16, rain: 20, wind: 24, snow: 0, cond: 'Mây' },
        { name: 'London', lat: 51.51, lng: -0.13, temp: 11, rain: 65, wind: 28, snow: 0, cond: 'Mưa' },
        { name: 'Moscow', lat: 55.75, lng: 37.62, temp: -4, rain: 0, wind: 14, snow: 85, cond: 'Tuyết' },
        { name: 'Sydney', lat: -33.87, lng: 151.21, temp: 27, rain: 0, wind: 12, snow: 0, cond: 'Nắng' },
        { name: 'Rio', lat: -22.91, lng: -43.17, temp: 30, rain: 8, wind: 9, snow: 0, cond: 'Nóng' },
        { name: 'Cairo', lat: 30.04, lng: 31.24, temp: 37, rain: 0, wind: 7, snow: 0, cond: 'Nắng gắt' },
        { name: 'Delhi', lat: 28.61, lng: 77.21, temp: 41, rain: 0, wind: 6, snow: 0, cond: 'Nóng' },
        { name: 'Paris', lat: 48.86, lng: 2.35, temp: 14, rain: 28, wind: 19, snow: 0, cond: 'Mây' },
        { name: 'Seoul', lat: 37.57, lng: 126.98, temp: 20, rain: 50, wind: 21, snow: 0, cond: 'Mưa' },
        { name: 'Lagos', lat: 6.45, lng: 3.4, temp: 29, rain: 40, wind: 11, snow: 0, cond: 'Mưa' },
      ];

      let storms = [
        { id: 1, name: 'TALA', lat: 16.8, lng: 119.5, cat: 3, wind: 185, dir: 'Tây Bắc', pres: 945 },
        { id: 2, name: 'NORU', lat: 27.5, lng: -87.0, cat: 4, wind: 220, dir: 'Bắc', pres: 918 },
        { id: 3, name: '06W', lat: 13.2, lng: 141.0, cat: 1, wind: 65, dir: 'Tây', pres: 996 },
        { id: 4, name: 'LIDIA', lat: 17.5, lng: -107.0, cat: 2, wind: 150, dir: 'ĐB', pres: 972 },
      ];

      let currentLayer = 'temp';
      let map;
      let imageOverlay;
      let cityMarkers = [];
      let stormMarkers = [];
      let stormLines = [];

      // ===== KHỞI TẠO BẢN ĐỒ =====
      function initMap() {
        map = L.map('map', {
          center: [18, 20],
          zoom: 2.3,
          minZoom: 2,
          maxZoom: 7,
          zoomControl: true,
          attributionControl: false,
          maxBounds: [
            [-80, -240],
            [80, 240]
          ],
          maxBoundsViscosity: 0.7,
        });

        // Ảnh bản đồ của bạn
        imageOverlay = L.imageOverlay(
          'https://i.ibb.co/p6njm03s/1778582329890.png',
          [
            [-82, -240],
            [82, 240]
          ], {
            opacity: 1,
            interactive: false,
          }
        ).addTo(map);

        // Lớp mờ tham chiếu
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
          subdomains: 'abcd',
          maxZoom: 7,
          opacity: 0.12,
        }).addTo(map);

        renderAll();
        setInterval(simulateWeather, 4000);
        setInterval(moveStorms, 5000);
      }

      // ===== RENDER THÀNH PHỐ =====
      function renderCities() {
        cityMarkers.forEach(m => map.removeLayer(m));
        cityMarkers = [];

        cities.forEach(city => {
          let color = '#fbbf24';
          if (currentLayer === 'rain') color = '#3b82f6';
          if (currentLayer === 'wind') color = '#10b981';
          if (currentLayer === 'snow') color = '#a78bfa';
          if (currentLayer === 'storm') color = '#ef4444';

          const value = currentLayer === 'temp' ? `${Math.round(city.temp)}°` :
            currentLayer === 'rain' ? `${Math.round(city.rain)}mm` :
            currentLayer === 'wind' ? `${Math.round(city.wind)}km/h` :
            currentLayer === 'snow' ? `${Math.round(city.snow)}%` :
            `${Math.round(city.temp)}°`;

          const iconHtml = `<div style="
            background:${color};color:#000;font-weight:700;
            padding:2px 7px;border-radius:10px;font-size:10px;
            white-space:nowrap;border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 1px 4px rgba(0,0,0,0.5);
          ">${value}</div>`;

          const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [48, 18], iconAnchor: [24, 9] });
          const marker = L.marker([city.lat, city.lng], { icon }).addTo(map);
          marker.bindPopup(`<b>${city.name}</b><br>🌡 ${Math.round(city.temp)}°C · ${city.cond}<br>💧 ${Math.round(city.rain)}mm · 💨 ${Math.round(city.wind)}km/h`);
          cityMarkers.push(marker);
        });
      }

      // ===== RENDER BÃO =====
      function renderStorms() {
        stormMarkers.forEach(m => map.removeLayer(m));
        stormLines.forEach(l => map.removeLayer(l));
        stormMarkers = [];
        stormLines = [];

        storms.forEach(s => {
          const catColor = s.cat >= 4 ? '#ff4444' : s.cat >= 2 ? '#ff8800' : '#ffaa00';
          const size = 20 + s.cat * 4;
          const html = `<div style="
            width:${size}px;height:${size}px;background:${catColor};
            border-radius:50%;opacity:0.85;border:2px solid #fff;
            box-shadow:0 0 ${8+s.cat*4}px ${catColor};
            animation:stormGlow 1.5s infinite;
          "></div>`;
          const icon = L.divIcon({ html, className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
          const marker = L.marker([s.lat, s.lng], { icon }).addTo(map);
          marker.bindPopup(`<b>🌀 ${s.name}</b><br>Cấp ${s.cat} · Gió ${s.wind}km/h<br>Áp suất ${s.pres}hPa · ${s.dir}`);
          stormMarkers.push(marker);

          const dLat = s.dir.includes('Bắc') ? 2 : s.dir.includes('Nam') ? -2 : 0;
          const dLng = s.dir.includes('Đông') ? 2 : s.dir.includes('Tây') ? -2 : 0;
          stormLines.push(L.polyline([
            [s.lat, s.lng],
            [s.lat + dLat, s.lng + dLng]
          ], { color: catColor, weight: 2, dashArray: '5 4', opacity: 0.5 }).addTo(map));
        });
      }

      // ===== PANEL NHỎ =====
      function renderPanel() {
        document.getElementById('cityList').innerHTML = cities.slice(0, 7).map(c => `
          <div class="city-row" data-lat="${c.lat}" data-lng="${c.lng}">
            <span>${c.name}</span><span class="val">${Math.round(c.temp)}°</span>
          </div>
        `).join('');
        document.getElementById('stormList').innerHTML = storms.map(s => `
          <div class="storm-row" data-lat="${s.lat}" data-lng="${s.lng}">
            <span class="mini-dot"></span>${s.name}<span style="color:#fbbf24;margin-left:auto;">C${s.cat}</span>
          </div>
        `).join('');

        document.querySelectorAll('.city-row').forEach(el => {
          el.addEventListener('click', () => map.flyTo([+el.dataset.lat, +el.dataset.lng], 5, { duration: 1 }));
        });
        document.querySelectorAll('.storm-row').forEach(el => {
          el.addEventListener('click', () => map.flyTo([+el.dataset.lat, +el.dataset.lng], 4.5, { duration: 1 }));
        });
      }

      function renderAll() { renderCities();
        renderStorms();
        renderPanel(); }

      // ===== GIẢ LẬP THỜI TIẾT =====
      function simulateWeather() {
        cities.forEach(c => {
          c.temp += (Math.random() - 0.5) * 2.5;
          c.rain = Math.max(0, Math.min(100, c.rain + (Math.random() - 0.5) * 12));
          c.wind = Math.max(0, Math.min(60, c.wind + (Math.random() - 0.5) * 7));
          c.snow = Math.max(0, Math.min(100, c.snow + (Math.random() - 0.5) * 8));
        });
        renderCities();
        renderPanel();
      }

      function moveStorms() {
        storms.forEach(s => {
          s.lat += (Math.random() - 0.4) * 1.1;
          s.lng += (Math.random() - 0.5) * 1.3;
          s.lat = Math.max(-55, Math.min(55, s.lat));
          s.lng = ((s.lng + 540) % 360) - 180;
          s.wind = Math.max(40, Math.min(270, s.wind + (Math.random() - 0.5) * 18));
          s.wind = Math.round(s.wind);
          s.pres = Math.round(s.pres + (Math.random() - 0.5) * 8);
          if (s.cat === 1 && s.wind > 118) s.cat = 2;
          else if (s.cat === 2 && s.wind > 153) s.cat = 3;
          else if (s.cat === 3 && s.wind > 178) s.cat = 4;
          else if (s.cat >= 2 && s.wind < 95) s.cat = 1;
        });
        renderStorms();
        renderPanel();
      }

      // ===== NÚT ĐIỀU KHIỂN =====
      document.querySelectorAll('.btn[data-layer]').forEach(btn => {
        btn.addEventListener('click', function() {
          const layer = this.dataset.layer;
          document.querySelectorAll('.btn').forEach(b => b.classList.remove('active', 'storm-active'));
          if (layer === 'reset') {
            currentLayer = 'temp';
            document.querySelector('.btn[data-layer="temp"]').classList.add('active');
            map.flyTo([18, 20], 2.3, { duration: 1 });
          } else if (layer === 'storm') {
            currentLayer = 'storm';
            this.classList.add('storm-active');
            map.flyTo([16, 118], 3.2, { duration: 1.2 });
          } else {
            currentLayer = layer;
            this.classList.add('active');
          }
          renderCities();
        });
      });

      initMap();
    })();
  </script>
</body>
</html>
