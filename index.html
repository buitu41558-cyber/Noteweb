<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria Football Manager - Fixed AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { mainBg: '#0f172a', sideBg: '#1e293b', pitchBg: '#15803d' }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
      body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
      .field-pitch { background: #15803d; border: 2px solid #ffffff; position: relative; border-radius: 6px; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden overflow-y-auto">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-full md:w-60 bg-sideBg flex flex-col justify-between p-4 shrink-0 border-r border-slate-700">
        <div>
            <div class="flex items-center gap-3 mb-6">
                <div class="w-9 h-9 bg-emerald-600 rounded flex items-center justify-center font-black text-lg text-white">VF</div>
                <h1 class="font-bold text-sm text-white leading-tight">Victoria Football</h1>
            </div>

            <nav class="space-y-1">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded text-xs font-medium transition text-white bg-slate-700" id="btn-dashboard">
                    <i class="fa-solid fa-chart-pie w-4"></i> Tổng quan
                </button>
                <button onclick="switchTab('squad')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded text-xs font-medium transition text-slate-300 hover:bg-slate-700" id="btn-squad">
                    <i class="fa-solid fa-users-line w-4"></i> Đội hình
                </button>
                <button onclick="switchTab('match')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded text-xs font-medium transition text-slate-300 hover:bg-slate-700" id="btn-match">
                    <i class="fa-solid fa-gamepad w-4"></i> Mô phỏng Trận đấu
                </button>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-3 md:p-5 bg-mainBg overflow-y-auto min-h-screen">

        <!-- TAB 1: DASHBOARD -->
        <section id="tab-dashboard" class="tab-content space-y-4">
            <h2 class="text-sm md:text-base font-bold text-white">Tổng quan & Chọn Đội bóng</h2>
            <div class="bg-sideBg p-4 rounded border border-slate-700">
                <div id="teams-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
            </div>
        </section>

        <!-- TAB 2: SQUAD MANAGEMENT -->
        <section id="tab-squad" class="tab-content hidden space-y-4">
            <h2 class="text-sm md:text-base font-bold text-white">Quản lý Đội hình</h2>
            <div class="bg-sideBg p-3 rounded border border-slate-700 flex justify-center">
                <div id="squad-pitch" class="field-pitch w-full h-[400px] max-w-[500px]">
                    <div id="formation-slots" class="absolute inset-0"></div>
                </div>
            </div>
        </section>

        <!-- TAB 3: MATCH SIMULATION -->
        <section id="tab-match" class="tab-content hidden space-y-3">
            <div class="bg-sideBg p-3 rounded border border-slate-700 flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <select id="sim-team-a-select" class="bg-slate-800 text-xs text-white p-1.5 rounded border border-slate-700"><option value="">-- Đội Nhà --</option></select>
                    <span id="sim-score" class="text-sm font-black text-white bg-slate-900 px-3 py-1 rounded border border-slate-700">0 - 0</span>
                    <select id="sim-team-b-select" class="bg-slate-800 text-xs text-white p-1.5 rounded border border-slate-700"><option value="">-- Đội Khách --</option></select>
                </div>
                <div class="flex items-center gap-2">
                    <div id="sim-timer" class="bg-slate-900 px-3 py-1 rounded font-mono text-emerald-400 text-xs font-bold">00:00</div>
                    <button id="sim-start-btn" onclick="toggleMatchSim()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1 rounded text-xs">Bắt đầu</button>
                    <button onclick="resetMatchSim()" class="bg-slate-700 hover:bg-slate-600 text-white px-2.5 py-1 rounded text-xs">Đặt lại</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-3">
                <div class="lg:col-span-3 bg-sideBg p-2 rounded border border-slate-700 flex justify-center">
                    <canvas id="matchCanvas" width="800" height="480" class="w-full max-w-[800px] bg-pitchBg rounded"></canvas>
                </div>
                <div class="bg-sideBg p-3 rounded border border-slate-700 flex flex-col h-[480px]">
                    <h3 class="font-semibold text-white text-xs mb-2 border-b border-slate-700 pb-1">Diễn biến Trận đấu</h3>
                    <div id="sim-logs" class="flex-1 overflow-y-auto space-y-1.5 text-[11px] text-slate-300 font-mono"></div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // DỮ LIỆU MẶC ĐỊNH SẴN CÓ ĐỂ CHƠI ĐƯỢC NGAY
        let state = {
            teams: [
                { id: 't1', name: 'Real Madrid' },
                { id: 't2', name: 'Barcelona' }
            ],
            players: [
                // Team A
                { id: 'p1', name: 'Courtois', pos: 'GK', teamId: 't1', pac: 60, pas: 70, sho: 20, dri: 50 },
                { id: 'p2', name: 'Carvajal', pos: 'DEF', teamId: 't1', pac: 82, pas: 78, sho: 60, dri: 75 },
                { id: 'p3', name: 'Militao', pos: 'DEF', teamId: 't1', pac: 85, pas: 70, sho: 50, dri: 68 },
                { id: 'p4', name: 'Alaba', pos: 'DEF', teamId: 't1', pac: 79, pas: 81, sho: 65, dri: 74 },
                { id: 'p5', name: 'Mendy', pos: 'DEF', teamId: 't1', pac: 88, pas: 72, sho: 55, dri: 78 },
                { id: 'p6', name: 'Casemiro', pos: 'MID', teamId: 't1', pac: 65, pas: 80, sho: 73, dri: 72 },
                { id: 'p7', name: 'Modric', pos: 'MID', teamId: 't1', pac: 73, pas: 89, sho: 76, dri: 88 },
                { id: 'p8', name: 'Kroos', pos: 'MID', teamId: 't1', pac: 55, pas: 91, sho: 81, dri: 81 },
                { id: 'p9', name: 'Rodrygo', pos: 'ATT', teamId: 't1', pac: 88, pas: 78, sho: 82, dri: 86 },
                { id: 'p10', name: 'Benzema', pos: 'ATT', teamId: 't1', pac: 80, pas: 83, sho: 88, dri: 87 },
                { id: 'p11', name: 'Vinicius', pos: 'ATT', teamId: 't1', pac: 95, pas: 79, sho: 84, dri: 90 },

                // Team B
                { id: 'p12', name: 'Ter Stegen', pos: 'GK', teamId: 't2', pac: 60, pas: 85, sho: 20, dri: 60 },
                { id: 'p13', name: 'Kounde', pos: 'DEF', teamId: 't2', pac: 84, pas: 75, sho: 45, dri: 72 },
                { id: 'p14', name: 'Araujo', pos: 'DEF', teamId: 't2', pac: 87, pas: 68, sho: 50, dri: 65 },
                { id: 'p15', name: 'Christensen', pos: 'DEF', teamId: 't2', pac: 75, pas: 76, sho: 40, dri: 70 },
                { id: 'p16', name: 'Balde', pos: 'DEF', teamId: 't2', pac: 91, pas: 73, sho: 50, dri: 79 },
                { id: 'p17', name: 'Busquets', pos: 'MID', teamId: 't2', pac: 42, pas: 86, sho: 62, dri: 79 },
                { id: 'p18', name: 'De Jong', pos: 'MID', teamId: 't2', pac: 82, pas: 86, sho: 69, dri: 87 },
                { id: 'p19', name: 'Pedri', pos: 'MID', teamId: 't2', pac: 78, pas: 88, sho: 72, dri: 88 },
                { id: 'p20', name: 'Raphinha', pos: 'ATT', teamId: 't2', pac: 91, pas: 78, sho: 80, dri: 85 },
                { id: 'p21', name: 'Lewandowski', pos: 'ATT', teamId: 't2', pac: 75, pas: 79, sho: 91, dri: 82 },
                { id: 'p22', name: 'Gavi', pos: 'ATT', teamId: 't2', pac: 76, pas: 78, sho: 68, dri: 83 }
            ]
        };

        window.onload = function() {
            renderApp();
            initMatchCanvas();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-slate-700', 'text-white'));
            document.getElementById('btn-' + tabId).classList.add('bg-slate-700', 'text-white');
        }

        function renderApp() {
            const simTeamA = document.getElementById('sim-team-a-select');
            const simTeamB = document.getElementById('sim-team-b-select');
            simTeamA.innerHTML = ''; simTeamB.innerHTML = '';
            
            state.teams.forEach((t, i) => {
                simTeamA.innerHTML += `<option value="${t.id}" ${i===0?'selected':''}>${t.name}</option>`;
                simTeamB.innerHTML += `<option value="${t.id}" ${i===1?'selected':''}>${t.name}</option>`;
            });
        }

        // ==========================================
        // ENGINE MÔ PHỎNG BÓNG ĐÁ CHUẨN ĐỘI HÌNH & AI
        // ==========================================
        let simCanvas, simCtx, animFrameId = null;
        let simTimeSeconds = 0, lastTickTime = 0, simRunning = false;
        let ball = { x: 400, y: 240, vx: 0, vy: 0, holder: null, looseTimer: 0 };
        let teamA_players = [], teamB_players = [];
        let scoreA = 0, scoreB = 0;

        const tacticalPositionsA = [
            { x: 35, y: 240, role: 'GK' },
            { x: 130, y: 70, role: 'DEF' }, { x: 110, y: 170, role: 'DEF' }, { x: 110, y: 310, role: 'DEF' }, { x: 130, y: 410, role: 'DEF' },
            { x: 240, y: 120, role: 'MID' }, { x: 220, y: 240, role: 'MID' }, { x: 240, y: 360, role: 'MID' },
            { x: 360, y: 90, role: 'ATT' }, { x: 380, y: 240, role: 'ATT' }, { x: 360, y: 390, role: 'ATT' }
        ];

        const tacticalPositionsB = [
            { x: 765, y: 240, role: 'GK' },
            { x: 670, y: 70, role: 'DEF' }, { x: 690, y: 170, role: 'DEF' }, { x: 690, y: 310, role: 'DEF' }, { x: 670, y: 410, role: 'DEF' },
            { x: 560, y: 120, role: 'MID' }, { x: 580, y: 240, role: 'MID' }, { x: 560, y: 360, role: 'MID' },
            { x: 440, y: 90, role: 'ATT' }, { x: 420, y: 240, role: 'ATT' }, { x: 440, y: 390, role: 'ATT' }
        ];

        function initMatchCanvas() {
            simCanvas = document.getElementById('matchCanvas');
            if (simCanvas) { simCtx = simCanvas.getContext('2d'); drawPitch(); }
        }

        function drawPitch() {
            if (!simCtx) return;
            simCtx.fillStyle = "#15803d"; simCtx.fillRect(0, 0, 800, 480);
            simCtx.strokeStyle = "rgba(255,255,255,0.8)"; simCtx.lineWidth = 2;
            simCtx.strokeRect(20, 20, 760, 440);
            simCtx.beginPath(); simCtx.moveTo(400, 20); simCtx.lineTo(400, 460); simCtx.stroke();
            simCtx.beginPath(); simCtx.arc(400, 240, 50, 0, Math.PI * 2); simCtx.stroke();
            
            // Khung thành 2 bên
            simCtx.strokeRect(20, 140, 90, 200); simCtx.strokeRect(690, 140, 90, 200);
            simCtx.fillStyle = "#ffffff";
            simCtx.fillRect(10, 190, 10, 100); simCtx.fillRect(780, 190, 10, 100);
        }

        function setupSimPlayers() {
            const teamAId = document.getElementById('sim-team-a-select').value;
            const teamBId = document.getElementById('sim-team-b-select').value;

            const pA = state.players.filter(p => p.teamId === teamAId);
            const pB = state.players.filter(p => p.teamId === teamBId);

            teamA_players = pA.slice(0, 11).map((p, idx) => ({
                ...p, homeX: tacticalPositionsA[idx].x, homeY: tacticalPositionsA[idx].y,
                x: tacticalPositionsA[idx].x, y: tacticalPositionsA[idx].y,
                speed: 1.2 + (p.pac / 100) * 1.2, team: 'A', color: '#ef4444'
            }));

            teamB_players = pB.slice(0, 11).map((p, idx) => ({
                ...p, homeX: tacticalPositionsB[idx].x, homeY: tacticalPositionsB[idx].y,
                x: tacticalPositionsB[idx].x, y: tacticalPositionsB[idx].y,
                speed: 1.2 + (p.pac / 100) * 1.2, team: 'B', color: '#3b82f6'
            }));

            ball = { x: 400, y: 240, vx: 0, vy: 0, holder: teamA_players[9], looseTimer: 0 };
        }

        function toggleMatchSim() {
            if (simRunning) {
                simRunning = false;
                if (animFrameId) cancelAnimationFrame(animFrameId);
                document.getElementById('sim-start-btn').textContent = "Tiếp tục";
            } else {
                if (simTimeSeconds === 0) setupSimPlayers();
                simRunning = true;
                lastTickTime = performance.now();
                document.getElementById('sim-start-btn').textContent = "Tạm dừng";
                animFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function resetMatchSim() {
            simRunning = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            simTimeSeconds = 0; scoreA = 0; scoreB = 0;
            document.getElementById('sim-score').textContent = "0 - 0";
            document.getElementById('sim-timer').textContent = "00:00";
            document.getElementById('sim-start-btn').textContent = "Bắt đầu";
            document.getElementById('sim-logs').innerHTML = '';
            drawPitch();
        }

        function logMatchEvent(msg) {
            const logs = document.getElementById('sim-logs');
            const min = Math.min(90, Math.floor(simTimeSeconds / 60) + 1);
            logs.innerHTML = `<div><span class="text-slate-400">[${min}']</span> ${msg}</div>` + logs.innerHTML;
        }

        function gameLoop(now) {
            if (!simRunning) return;

            if (now - lastTickTime >= 1000) {
                simTimeSeconds += 1;
                lastTickTime = now;
                const m = Math.floor(simTimeSeconds / 60), s = simTimeSeconds % 60;
                document.getElementById('sim-timer').textContent = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                if (simTimeSeconds >= 5400) {
                    simRunning = false;
                    logMatchEvent("<b>HẾT GIỜ!</b> Trận đấu kết thúc.");
                    return;
                }
            }

            updateAIPhysics();
            drawPitch();
            renderSimEntities();

            animFrameId = requestAnimationFrame(gameLoop);
        }

        function updateAIPhysics() {
            if (ball.looseTimer > 0) ball.looseTimer--;

            // Tim cầu thủ 2 đội gần bóng nhất
            let closestA = getClosestPlayer(teamA_players, ball.x, ball.y);
            let closestB = getClosestPlayer(teamB_players, ball.x, ball.y);

            // TÍNH TOÁN VỊ TRÍ ĐỘI HÌNH DÂNG CAO/LÙI SÂU THEO BÓNG
            const shiftX = (ball.x - 400) * 0.45;

            // --- AI ĐỘI A ---
            teamA_players.forEach(p => {
                let targetX = p.homeX + shiftX;
                let targetY = p.homeY + (ball.y - 240) * 0.2;

                if (p.pos === 'GK') {
                    targetX = Math.min(60, Math.max(30, 35 + (ball.x - 400) * 0.05));
                    targetY = 190 + (ball.y / 480) * 100;
                } else if (ball.holder && ball.holder.team === 'A') {
                    if (p === ball.holder) {
                        targetX = p.x + 1.2; // Dẫn bóng tiến tới
                        targetY = p.y;
                    } else {
                        targetX = p.homeX + shiftX + 35; // Đồng đội dâng cao đón bóng
                    }
                } else {
                    if (p === closestA && ball.looseTimer === 0) {
                        targetX = ball.x; targetY = ball.y; // Áp sát tranh bóng
                    }
                }
                movePlayer(p, targetX, targetY);
            });

            // --- AI ĐỘI B ---
            teamB_players.forEach(p => {
                let targetX = p.homeX + shiftX;
                let targetY = p.homeY + (ball.y - 240) * 0.2;

                if (p.pos === 'GK') {
                    targetX = Math.max(740, Math.min(770, 765 + (ball.x - 400) * 0.05));
                    targetY = 190 + (ball.y / 480) * 100;
                } else if (ball.holder && ball.holder.team === 'B') {
                    if (p === ball.holder) {
                        targetX = p.x - 1.2;
                        targetY = p.y;
                    } else {
                        targetX = p.homeX + shiftX - 35;
                    }
                } else {
                    if (p === closestB && ball.looseTimer === 0) {
                        targetX = ball.x; targetY = ball.y;
                    }
                }
                movePlayer(p, targetX, targetY);
            });

            // --- XỬ LÝ HÀNH ĐỘNG CẦU THỦ CẦM BÓNG ---
            if (ball.holder) {
                ball.x = ball.holder.x + (ball.holder.team === 'A' ? 7 : -7);
                ball.y = ball.holder.y;
                ball.vx = 0; ball.vy = 0;

                const isA = ball.holder.team === 'A';
                const goalX = isA ? 780 : 20;
                const distToGoal = Math.abs(ball.holder.x - goalX);

                // ƯU TIÊN 1: SÚT BÓNG KHI VÀO VÙNG NGUY HIỂM (< 180px)
                if (distToGoal < 180 && Math.random() < 0.04) {
                    let pwr = 6 + (ball.holder.sho / 100) * 5;
                    ball.vx = isA ? pwr : -pwr;
                    ball.vy = (240 - ball.y + (Math.random() - 0.5) * 40) * 0.05;
                    logMatchEvent(`<b>SÚT BÓNG!</b> Cú dứt điểm từ <b>${ball.holder.name}</b>!`);
                    ball.holder = null; ball.looseTimer = 15;
                }
                // ƯU TIÊN 2: CHUYỀN BÓNG CHO ĐỒNG ĐỘI
                else if (Math.random() < 0.05) {
                    const teammates = (isA ? teamA_players : teamB_players).filter(t => t !== ball.holder);
                    // Chọn đồng đội ở phía trước
                    let goodTargets = teammates.filter(t => isA ? t.x > ball.holder.x - 20 : t.x < ball.holder.x + 20);
                    if (goodTargets.length === 0) goodTargets = teammates;

                    let target = goodTargets[Math.floor(Math.random() * goodTargets.length)];
                    let dx = target.x - ball.holder.x, dy = target.y - ball.holder.y;
                    let dist = Math.hypot(dx, dy);
                    let spd = 4.5 + (ball.holder.pas / 100) * 2.5;

                    ball.vx = (dx / dist) * spd;
                    ball.vy = (dy / dist) * spd;
                    logMatchEvent(`<b>CHUYỀN BÓNG:</b> <b>${ball.holder.name}</b> chuyền cho <b>${target.name}</b>.`);
                    ball.holder = null; ball.looseTimer = 10;
                }
            } else {
                // TRANH BÓNG / CẮT BÓNG
                const all = [...teamA_players, ...teamB_players];
                all.forEach(p => {
                    if (Math.hypot(ball.x - p.x, ball.y - p.y) < 12) {
                        ball.holder = p; ball.looseTimer = 0;
                    }
                });

                ball.x += ball.vx; ball.y += ball.vy;
                ball.vx *= 0.96; ball.vy *= 0.96;
            }

            // XỬ LÝ GHI BÀN / BIÊN
            if (ball.x <= 20 && ball.y >= 190 && ball.y <= 290) {
                scoreB++; document.getElementById('sim-score').textContent = `${scoreA} - ${scoreB}`;
                logMatchEvent("<b>VÀO VÀO VÀO!</b> Bàn thắng cho Đội Khách!");
                resetBall();
            } else if (ball.x >= 780 && ball.y >= 190 && ball.y <= 290) {
                scoreA++; document.getElementById('sim-score').textContent = `${scoreA} - ${scoreB}`;
                logMatchEvent("<b>VÀO VÀO VÀO!</b> Bàn thắng cho Đội Nhà!");
                resetBall();
            } else if (ball.x < 20 || ball.x > 780 || ball.y < 20 || ball.y > 460) {
                resetBall();
            }
        }

        function resetBall() {
            ball = { x: 400, y: 240, vx: 0, vy: 0, holder: teamA_players[9], looseTimer: 0 };
        }

        function getClosestPlayer(players, x, y) {
            let closest = players[0], minDist = 9999;
            players.forEach(p => {
                let d = Math.hypot(x - p.x, y - p.y);
                if (d < minDist) { minDist = d; closest = p; }
            });
            return closest;
        }

        function movePlayer(p, tx, ty) {
            let dx = tx - p.x, dy = ty - p.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 2) {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }
            p.x = Math.max(25, Math.min(775, p.x));
            p.y = Math.max(25, Math.min(455, p.y));
        }

        function renderSimEntities() {
            if (!simCtx) return;

            const drawGroup = (list) => {
                list.forEach(p => {
                    simCtx.fillStyle = p.color;
                    simCtx.beginPath(); simCtx.arc(p.x, p.y, 8, 0, Math.PI * 2); simCtx.fill();
                    simCtx.strokeStyle = "#fff"; simCtx.lineWidth = 1.5; simCtx.stroke();
                    simCtx.fillStyle = "#fff"; simCtx.font = "bold 9px sans-serif";
                    simCtx.fillText(p.name.substring(0, 3), p.x - 7, p.y - 10);
                });
            };

            drawGroup(teamA_players);
            drawGroup(teamB_players);

            // Quả bóng
            simCtx.fillStyle = "#ffffff";
            simCtx.beginPath(); simCtx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); simCtx.fill();
            simCtx.strokeStyle = "#000"; simCtx.lineWidth = 1; simCtx.stroke();
        }
    </script>
</body>
</html>
