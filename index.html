<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICTORIA - Mô Phỏng Trận Đấu 2D</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-item {
            padding: 12px 20px;
            color: var(--text-sub);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .menu-item:hover, .menu-item.active {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            border-left: 4px solid var(--accent);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .tab-content {
            display: none;
            padding: 20px;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Match Simulation Header */
        .match-header {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .team-display {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            width: 250px;
        }

        .team-display.right {
            justify-content: flex-end;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #334155;
            border: 1px solid var(--border);
        }

        .scoreboard {
            text-align: center;
        }

        .score {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .timer {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Canvas Arena */
        .pitch-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 10px;
            position: relative;
        }

        canvas {
            background-color: #15803d;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            max-width: 100%;
            max-height: 100%;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #475569;
            color: #fff;
        }

        /* Admin Forms */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .card h3 {
            margin-bottom: 15px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
        }

        .team-list, .player-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background-color: var(--bg-dark);
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-info img {
            width: 25px;
            height: 25px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">⚽ VICTORIA</div>
        <div class="menu">
            <div class="menu-item active" onclick="switchTab('tab-sim')">⚽ Mô Phỏng Trận</div>
            <div class="menu-item" onclick="switchTab('tab-admin')">⚙️ Quản Lý Đội Bống</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- TAB MÔ PHỎNG -->
        <div id="tab-sim" class="tab-content active">
            <!-- Header Tỉ số + Đội + Thời gian -->
            <div class="match-header">
                <div class="team-display">
                    <img id="home-logo" class="team-logo" src="" alt="">
                    <span id="home-name">Chưa chọn đội 1</span>
                </div>
                <div class="scoreboard">
                    <div class="score"><span id="score-home">0</span> - <span id="score-away">0</span></div>
                    <div class="timer" id="match-timer">00:00 / 90:00</div>
                </div>
                <div class="team-display right">
                    <span id="away-name">Chưa chọn đội 2</span>
                    <img id="away-logo" class="team-logo" src="" alt="">
                </div>
            </div>

            <!-- Chọn Đội Trận Đấu -->
            <div style="display: flex; gap: 10px; margin-bottom: 10px; justify-content: center;">
                <select id="select-home-team" onchange="setupMatch()"><option value="">-- Chọn Đội Nhà --</option></select>
                <select id="select-away-team" onchange="setupMatch()"><option value="">-- Chọn Đội Khách --</option></select>
            </div>

            <!-- Sân Bóng Canvas 2D -->
            <div class="pitch-container">
                <canvas id="pitchCanvas" width="800" height="500"></canvas>
            </div>

            <!-- Điều Khiển -->
            <div class="controls">
                <button class="btn" onclick="startMatch()">▶ Bắt đầu Mô Phỏng</button>
                <button class="btn btn-secondary" onclick="resetMatch()">🔄 Reset</button>
            </div>
        </div>

        <!-- TAB QUẢN LÝ ADMIN -->
        <div id="tab-admin" class="tab-content">
            <div class="admin-grid">
                <!-- Tạo Đội -->
                <div class="card">
                    <h3>Tạo Đội Bóng Mới</h3>
                    <div class="form-group">
                        <label>Tên Đội Bóng</label>
                        <input type="text" id="new-team-name" placeholder="VD: Victoria FC">
                    </div>
                    <div class="form-group">
                        <label>Logo Đội Bóng (Tải tệp ảnh)</label>
                        <input type="file" id="new-team-logo" accept="image/*">
                    </div>
                    <button class="btn" onclick="createTeam()">Tạo Đội</button>

                    <h3 style="margin-top: 20px;">Danh Sách Đội</h3>
                    <div class="team-list" id="admin-team-list"></div>
                </div>

                <!-- Thêm Cầu Thủ -->
                <div class="card">
                    <h3>Thêm Cầu Thủ Vào Đội</h3>
                    <div class="form-group">
                        <label>Chọn Đội Bóng</label>
                        <select id="admin-select-team" onchange="renderPlayerList()"></select>
                    </div>
                    <div class="form-group">
                        <label>Tên Cầu Thủ</label>
                        <input type="text" id="new-player-name" placeholder="VD: Nguyen Van A">
                    </div>
                    <div class="form-group">
                        <label>Vị Trí Cầu Thủ</label>
                        <select id="new-player-pos">
                            <option value="GK">Thủ Môn (GK)</option>
                            <option value="DEF">Hậu Vệ (DEF)</option>
                            <option value="MID">Tiền Vệ (MID)</option>
                            <option value="FWD">Tiền Đạo (FWD)</option>
                        </select>
                    </div>
                    <button class="btn" onclick="addPlayer()">Thêm Cầu Thủ</button>

                    <h3 style="margin-top: 20px;">Cầu Thủ Trg Đội</h3>
                    <div class="player-list" id="admin-player-list"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Dữ liệu ứng dụng
        let teams = JSON.parse(localStorage.getItem('vic_teams')) || [];

        // Tab Navigation
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(event) event.currentTarget.classList.add('active');
            updateAdminSelects();
        }

        // Helper Base64 Image Upload
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // ADMIN LOGIC
        async function createTeam() {
            const name = document.getElementById('new-team-name').value;
            const logoFile = document.getElementById('new-team-logo').files[0];
            if(!name) return alert('Nhập tên đội giùm cái!');

            let logoUrl = '';
            if(logoFile) {
                logoUrl = await getBase64(logoFile);
            }

            const team = { id: Date.now(), name: name, logo: logoUrl, players: [] };
            teams.push(team);
            saveData();
            document.getElementById('new-team-name').value = '';
            updateAdminSelects();
        }

        function addPlayer() {
            const teamId = document.getElementById('admin-select-team').value;
            const name = document.getElementById('new-player-name').value;
            const pos = document.getElementById('new-player-pos').value;

            if(!teamId || !name) return alert('Chọn đội và nhập tên cầu thủ!');

            const team = teams.find(t => t.id == teamId);
            team.players.push({ id: Date.now(), name: name, pos: pos });
            saveData();
            document.getElementById('new-player-name').value = '';
            renderPlayerList();
        }

        function saveData() {
            localStorage.setItem('vic_teams', JSON.stringify(teams));
            updateAdminSelects();
        }

        function updateAdminSelects() {
            const adminSelect = document.getElementById('admin-select-team');
            const homeSelect = document.getElementById('select-home-team');
            const awaySelect = document.getElementById('select-away-team');
            
            const teamOpts = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            
            adminSelect.innerHTML = `<option value="">-- Chọn Đội --</option>` + teamOpts;
            homeSelect.innerHTML = `<option value="">-- Chọn Đội Nhà --</option>` + teamOpts;
            awaySelect.innerHTML = `<option value="">-- Chọn Đội Khách --</option>` + teamOpts;

            // Render admin team list
            document.getElementById('admin-team-list').innerHTML = teams.map(t => `
                <div class="item-row">
                    <div class="item-info">
                        ${t.logo ? `<img src="${t.logo}">` : ''}
                        <span>${t.name} (${t.players.length} cầu thủ)</span>
                    </div>
                </div>
            `).join('');
            renderPlayerList();
        }

        function renderPlayerList() {
            const teamId = document.getElementById('admin-select-team').value;
            const container = document.getElementById('admin-player-list');
            if(!teamId) return container.innerHTML = '';

            const team = teams.find(t => t.id == teamId);
            container.innerHTML = team.players.map(p => `
                <div class="item-row">
                    <span>${p.name}</span>
                    <b style="color: var(--accent);">${p.pos}</b>
                </div>
            `).join('');
        }

        // GAME SIMULATION ENGINE (CANVAS 2D)
        const canvas = document.getElementById('pitchCanvas');
        const ctx = canvas.getContext('2d');

        let isRunning = false;
        let matchSeconds = 0; // 0 to 90 mins (5400s)
        let simInterval = null;
        let scoreHome = 0, scoreAway = 0;

        let homeTeamData = null, awayTeamData = null;
        let players = [];
        let ball = { x: 400, y: 250, vx: 0, vy: 0, holder: null };

        // Position Anchors (Sơ đồ vị trí chuẩn)
        const POS_ANCHORS_HOME = {
            GK: { x: 50, y: 250 },
            DEF: [{ x: 180, y: 120 }, { x: 160, y: 250 }, { x: 180, y: 380 }],
            MID: [{ x: 300, y: 150 }, { x: 280, y: 250 }, { x: 300, y: 350 }],
            FWD: [{ x: 380, y: 180 }, { x: 380, y: 320 }]
        };

        const POS_ANCHORS_AWAY = {
            GK: { x: 750, y: 250 },
            DEF: [{ x: 620, y: 120 }, { x: 640, y: 250 }, { x: 620, y: 380 }],
            MID: [{ x: 500, y: 150 }, { x: 520, y: 250 }, { x: 500, y: 350 }],
            FWD: [{ x: 420, y: 180 }, { x: 420, y: 320 }]
        };

        function setupMatch() {
            const hId = document.getElementById('select-home-team').value;
            const aId = document.getElementById('select-away-team').value;

            homeTeamData = teams.find(t => t.id == hId);
            awayTeamData = teams.find(t => t.id == aId);

            if(homeTeamData) {
                document.getElementById('home-name').innerText = homeTeamData.name;
                document.getElementById('home-logo').src = homeTeamData.logo || '';
            }
            if(awayTeamData) {
                document.getElementById('away-name').innerText = awayTeamData.name;
                document.getElementById('away-logo').src = awayTeamData.logo || '';
            }

            initPlayers();
            drawPitch();
        }

        function initPlayers() {
            players = [];
            ball = { x: 400, y: 250, vx: 0, vy: 0, holder: null };

            // Gen Đội Nhà (Xanh)
            if(homeTeamData) {
                let defIdx = 0, midIdx = 0, fwdIdx = 0;
                homeTeamData.players.forEach(p => {
                    let anchor = POS_ANCHORS_HOME.MID[0];
                    if(p.pos === 'GK') anchor = POS_ANCHORS_HOME.GK;
                    else if(p.pos === 'DEF') anchor = POS_ANCHORS_HOME.DEF[(defIdx++) % 3];
                    else if(p.pos === 'MID') anchor = POS_ANCHORS_HOME.MID[(midIdx++) % 3];
                    else if(p.pos === 'FWD') anchor = POS_ANCHORS_HOME.FWD[(fwdIdx++) % 2];

                    players.push({
                        id: p.id, name: p.name, pos: p.pos, team: 'home',
                        x: anchor.x, y: anchor.y, anchorX: anchor.x, anchorY: anchor.y,
                        color: '#38bdf8', vx: 0, vy: 0
                    });
                });
            }

            // Gen Đội Khách (Đỏ)
            if(awayTeamData) {
                let defIdx = 0, midIdx = 0, fwdIdx = 0;
                awayTeamData.players.forEach(p => {
                    let anchor = POS_ANCHORS_AWAY.MID[0];
                    if(p.pos === 'GK') anchor = POS_ANCHORS_AWAY.GK;
                    else if(p.pos === 'DEF') anchor = POS_ANCHORS_AWAY.DEF[(defIdx++) % 3];
                    else if(p.pos === 'MID') anchor = POS_ANCHORS_AWAY.MID[(midIdx++) % 3];
                    else if(p.pos === 'FWD') anchor = POS_ANCHORS_AWAY.FWD[(fwdIdx++) % 2];

                    players.push({
                        id: p.id, name: p.name, pos: p.pos, team: 'away',
                        x: anchor.x, y: anchor.y, anchorX: anchor.x, anchorY: anchor.y,
                        color: '#f87171', vx: 0, vy: 0
                    });
                });
            }
        }

        function startMatch() {
            if(!homeTeamData || !awayTeamData) return alert('Vui lòng chọn đủ 2 đội bóng!');
            if(isRunning) return;
            isRunning = true;

            // Timer Loop (90 phút mô phỏng trg ~45 giây)
            simInterval = setInterval(() => {
                matchSeconds += 2;
                if(matchSeconds >= 90 * 60) {
                    matchSeconds = 90 * 60;
                    isRunning = false;
                    clearInterval(simInterval);
                }
                updateTimerDisplay();
            }, 100);

            requestAnimationFrame(gameLoop);
        }

        function resetMatch() {
            isRunning = false;
            clearInterval(simInterval);
            matchSeconds = 0;
            scoreHome = 0;
            scoreAway = 0;
            document.getElementById('score-home').innerText = '0';
            document.getElementById('score-away').innerText = '0';
            updateTimerDisplay();
            initPlayers();
            drawPitch();
        }

        function updateTimerDisplay() {
            const m = Math.floor(matchSeconds / 60).toString().padStart(2, '0');
            const s = (matchSeconds % 60).toString().padStart(2, '0');
            document.getElementById('match-timer').innerText = `${m}:${s} / 90:00`;
        }

        // AI Logic di chuyển mượt + khôn theo zone
        function updateAI() {
            players.forEach(p => {
                // Tính khoảng cách tới bóng
                let dx = ball.x - p.x;
                let dy = ball.y - p.y;
                let distToBall = Math.hypot(dx, dy);

                let targetX = p.anchorX;
                let targetY = p.anchorY;

                // AI Khôn: Cầu thủ gần bóng nhất sẽ lao vào tranh bóng, cầu thủ còn lại giữ vị trí Zone
                if (distToBall < 120 && p.pos !== 'GK') {
                    targetX = ball.x;
                    targetY = ball.y;
                } else {
                    // Dâng cao/lùi về nhẹ theo vị trí quả bóng
                    targetX += (ball.x - 400) * 0.2;
                }

                // Giới hạn GK không chạy khỏi vòng cấm
                if (p.pos === 'GK') {
                    targetX = p.team === 'home' ? Math.min(targetX, 100) : Math.max(targetX, 700);
                }

                // Di chuyển mượt (Smooth interpolation - Lerp)
                p.x += (targetX - p.x) * 0.04;
                p.y += (targetY - p.y) * 0.04;

                // Va chạm lấy bóng
                if(distToBall < 12) {
                    ball.holder = p;
                    // Sút bóng ngẫu nhiên / chuyền
                    if(Math.random() < 0.03) {
                        let shootDir = p.team === 'home' ? 1 : -1;
                        ball.vx = (Math.random() * 5 + 4) * shootDir;
                        ball.vy = (Math.random() - 0.5) * 4;
                        ball.holder = null;
                    }
                }
            });

            // Physics quả bóng
            if(ball.holder) {
                ball.x = ball.holder.x + 5;
                ball.y = ball.holder.y;
            } else {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vx *= 0.96; // Ma sát
                ball.vy *= 0.96;

                // Check Goal
                if(ball.x < 20 && ball.y > 180 && ball.y < 320) {
                    scoreAway++;
                    document.getElementById('score-away').innerText = scoreAway;
                    initPlayers();
                } else if(ball.x > 780 && ball.y > 180 && ball.y < 320) {
                    scoreHome++;
                    document.getElementById('score-home').innerText = scoreHome;
                    initPlayers();
                }

                // Chạm biên bật lại
                if(ball.x < 10 || ball.x > 790) ball.vx *= -1;
                if(ball.y < 10 || ball.y > 490) ball.vy *= -1;
            }
        }

        // Render Sân Bóng 60fps
        function drawPitch() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ Đường Sân
            ctx.strokeStyle = "rgba(255,255,255,0.5)";
            ctx.lineWidth = 2;
            
            // Khung ngoài & Giữa sân
            ctx.strokeRect(20, 20, 760, 460);
            ctx.beginPath();
            ctx.moveTo(400, 20); ctx.lineTo(400, 480);
            ctx.arc(400, 250, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Vòng cấm 2 bên
            ctx.strokeRect(20, 140, 100, 220);
            ctx.strokeRect(680, 140, 100, 220);

            // Vẽ Cầu Thủ
            players.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Tên cầu thủ ngắn
                ctx.fillStyle = "#fff";
                ctx.font = "10px sans-serif";
                ctx.fillText(p.name, p.x - 12, p.y - 11);
            });

            // Vẽ Bóng
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.stroke();
        }

        function gameLoop() {
            if(!isRunning) return;
            updateAI();
            drawPitch();
            requestAnimationFrame(gameLoop);
        }

        // Init App
        updateAdminSelects();
        drawPitch();
    </script>
</body>
</html>
