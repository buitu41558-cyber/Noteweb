<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dự Báo Bão Đồng Bộ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* Map nằm ngang chuẩn tỉ lệ */
        .map-container { width: 100vw; height: 50vw; max-height: 100vh; max-width: 200vh; position: relative; border: 1px solid #333; }
        #map { width: 100%; height: 100%; background: #0b0e11; cursor: crosshair; }

        /* Admin UI */
        .admin-hint { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 2000; 
            background: #ff0000; color: white; padding: 10px 20px; border-radius: 5px; 
            font-size: 13px; font-weight: bold; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .admin-panel {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(0,0,0,0.9); border: 1px solid #444; padding: 15px;
            color: white; border-radius: 8px; display: none; width: 220px;
        }
        input, select { width: 100%; background: #222; border: 1px solid #555; color: white; padding: 8px; margin-bottom: 8px; box-sizing: border-box; }
        
        /* Marker bão */
        .storm-marker { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; position: relative; }
        .storm-marker::after { content: ''; position: absolute; inset: -5px; border: 1px solid inherit; border-radius: 50%; animation: pulse 1.5s infinite; border: 1px solid white; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        /* Màu theo cấp độ */
        .lv-apthap { background: #ffeb3b; box-shadow: 0 0 10px #ffeb3b; }
        .lv-bao { background: #ff9800; box-shadow: 0 0 10px #ff9800; }
        .lv-sieubao { background: #f44336; box-shadow: 0 0 15px #f44336; }

        .login-trigger { position: absolute; bottom: 5px; right: 5px; z-index: 1000; background: none; border: none; color: #111; cursor: pointer; }
        .del-btn { color: #ff4b4b; cursor: pointer; font-weight: bold; text-decoration: underline; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div class="map-container">
        <div id="adminHint" class="admin-hint">BƯỚC 1: CLICK CHỌN VỊ TRÍ BÃO</div>
        <div id="map"></div>
        
        <div id="adminPanel" class="admin-panel">
            <h4 style="margin:0 0 10px 0; color:red">QUẢN TRỊ VIÊN</h4>
            <input type="text" id="sName" placeholder="Tên bão">
            <input type="number" id="sTemp" placeholder="Nhiệt độ (°C)" value="28">
            <select id="sLevel">
                <option value="apthap">Cấp: Áp thấp</option>
                <option value="bao">Cấp: Bão</option>
                <option value="sieubao">Cấp: Siêu bão</option>
            </select>
            <p style="font-size: 10px; color: #888;">* Click Map để vẽ bão</p>
            <button onclick="location.reload()" style="width:100%; padding:5px; background:#444; color:white; border:none; cursor:pointer;">Thoát</button>
        </div>

        <button class="login-trigger" onclick="unlock()">.</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Khởi tạo hệ thống đồng bộ GunDB
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const storms = gun.get('weather_shared_data_v2');

        // Khởi tạo Map nằm ngang
        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, attributionControl: false });
        const bounds = [[0, 0], [1000, 2000]];
        L.imageOverlay('https://i.ibb.co/p6njm03s/1778582329890.png', bounds).addTo(map);
        map.fitBounds(bounds);

        let isAdmin = false;
        let step = 1;
        let tempMarker = {};
        const activeMarkers = {};
        const layerGroup = L.layerGroup().addTo(map);

        function unlock() {
            if(prompt("Nhập mật khẩu:") === 'aihoi') {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('adminHint').style.display = 'block';
            }
        }

        function getDirection(y1, x1, y2, x2) {
            const dy = y2 - y1, dx = x2 - x1;
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);
            if (angle > -22.5 && angle <= 22.5) return "Đông";
            if (angle > 22.5 && angle <= 67.5) return "Đông Bắc";
            if (angle > 67.5 && angle <= 112.5) return "Bắc";
            if (angle > 112.5 && angle <= 157.5) return "Tây Bắc";
            if (angle > 157.5 || angle <= -157.5) return "Tây";
            if (angle > -157.5 && angle <= -112.5) return "Tây Nam";
            if (angle > -112.5 && angle <= -67.5) return "Nam";
            return "Đông Nam";
        }

        // LẮNG NGHE ĐỒNG BỘ: Khi bất kỳ ai thêm/xóa bão, hàm này sẽ chạy cho tất cả mọi người
        storms.map().on((data, id) => {
            if (activeMarkers[id]) {
                layerGroup.removeLayer(activeMarkers[id]);
                delete activeMarkers[id];
            }
            if (!data) return;

            const m = L.marker([data.y, data.x], {
                icon: L.divIcon({ className: `storm-marker lv-${data.level}` })
            });

            const delLink = isAdmin ? `<span class="del-btn" onclick="removeStorm('${id}')">[XÓA BÃO]</span>` : "";
            const levelText = data.level === 'apthap' ? 'Áp thấp' : (data.level === 'bao' ? 'Bão' : 'Siêu bão');

            m.bindTooltip(`<b>${data.name}</b> (${levelText})<br>${data.temp}°C | Hướng: ${data.dir}${delLink}`, { 
                permanent: true, direction: 'top', interactive: true 
            });

            const group = L.layerGroup([m]);
            if(data.ty) {
                const line = L.polyline([[data.y, data.x], [data.ty, data.tx]], { color: 'white', weight: 1, dashArray: '5,5', opacity: 0.3 });
                group.addLayer(line);
            }
            
            group.addTo(layerGroup);
            activeMarkers[id] = group;
        });

        // Xử lý Click 2 bước của Admin
        map.on('click', function(e) {
            if(!isAdmin) return;

            if(step === 1) {
                tempMarker = {
                    y: e.latlng.lat, x: e.latlng.lng,
                    name: document.getElementById('sName').value || "BÃO_MỚI",
                    temp: document.getElementById('sTemp').value || 28,
                    level: document.getElementById('sLevel').value
                };
                step = 2;
                document.getElementById('adminHint').innerText = "VỊ TRÍ ĐÃ CHỌN. CLICK ĐIỂM TIẾP THEO ĐỂ CHỌN HƯỚNG.";
            } else {
                tempMarker.ty = e.latlng.lat;
                tempMarker.tx = e.latlng.lng;
                tempMarker.dir = getDirection(tempMarker.y, tempMarker.x, e.latlng.lat, e.latlng.lng);
                
                // Gửi dữ liệu đi (Tất cả mọi người sẽ nhận được)
                storms.set(tempMarker);
                
                step = 1;
                document.getElementById('adminHint').innerText = "BƯỚC 1: CLICK CHỌN VỊ TRÍ BÃO";
            }
        });

        window.removeStorm = function(id) {
            if(confirm("Xóa cơn bão này cho tất cả mọi người?")) {
                storms.get(id).put(null);
            }
        };
    </script>
</body>
</html>
