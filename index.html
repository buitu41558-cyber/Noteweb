<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Theo Dõi Thời Tiết</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #f0f2f5; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100%; background: #ffffff; }

        /* Giao diện UI đơn giản */
        .info-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 250px;
        }
        .info-panel h2 { margin: 0 0 10px 0; font-size: 16px; color: #333; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .status-item { font-size: 13px; margin: 5px 0; color: #666; }
        .status-badge { background: #444; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; }

        /* Menu bên phải tối giản */
        .side-bar {
            position: absolute; right: 20px; top: 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 5px;
        }
        .tool-btn {
            background: white; border: 1px solid #ccc; padding: 10px;
            cursor: pointer; font-size: 12px; text-align: center; width: 60px;
        }
        .tool-btn:hover { background: #f9f9f9; }
        .tool-btn.active { background: #333; color: white; border-color: #333; }

        /* Icon bão dạng radar phẳng */
        .storm-icon {
            border: 1px solid rgba(0,0,0,0.3);
            border-radius: 50%;
            background: rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center;
        }
        .storm-dot { width: 6px; height: 6px; background: red; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h2>DỮ LIỆU KHÍ TƯỢNG</h2>
        <div class="status-item">Khu vực: <b>Lục địa Eldria</b></div>
        <div class="status-item">Cảnh báo: <span class="status-badge">Áp thấp nhiệt đới</span></div>
        <div class="status-item">Cập nhật: 18:00 (GMT +7)</div>
    </div>

    <div class="side-bar">
        <div class="tool-btn active">BẢN ĐỒ</div>
        <div class="tool-btn">GIÓ</div>
        <div class="tool-btn">MƯA</div>
        <div class="tool-btn">NHIỆT</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const imgUrl = 'https://i.ibb.co/p6njm03s/1778582329890.png';
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            attributionControl: false
        });

        // XỬ LÝ ẢNH ĐỂ KHÔNG BỊ MÉO
        const img = new Image();
        img.src = imgUrl;
        img.onload = function() {
            const w = this.width;
            const h = this.height;
            
            // Tính toán bounds dựa trên kích thước thật của ảnh
            const southWest = map.unproject([0, h], map.getMaxZoom()-1);
            const northEast = map.unproject([w, 0], map.getMaxZoom()-1);
            const bounds = new L.LatLngBounds(southWest, northEast);

            L.imageOverlay(imgUrl, bounds).addTo(map);
            map.setMaxBounds(bounds);
            map.fitBounds(bounds);

            // Thêm các điểm bão (vị trí tượng trưng trên map của bạn)
            addStorm(h * 0.4, w * 0.25, "Vùng áp thấp A");
            addStorm(h * 0.6, w * 0.75, "Tâm bão B");
        };

        function addStorm(lat, lng, title) {
            // Vòng tròn radar đơn giản
            L.circle([lat, lng], {
                radius: 120, color: '#666', weight: 1, fillOpacity: 0, dashArray: '4'
            }).addTo(map);

            // Điểm tâm bão
            const customIcon = L.divIcon({
                className: 'storm-icon',
                html: '<div class="storm-dot"></div>',
                iconSize: [40, 40]
            });

            L.marker([lat, lng], {icon: customIcon})
             .addTo(map)
             .bindTooltip(title, {permanent: false, direction: 'top'});
        }
    </script>
</body>
</html>
