<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ghi chú · Thư mục thông minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #f5f5f0;
      color: #1a1a1a;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.8rem 1rem 3rem;
    }

    .app-wrapper {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .app-header h1 {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #171717;
    }

    .global-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .btn {
      padding: 0.55rem 1.2rem;
      border-radius: 0.45rem;
      font-weight: 500;
      font-size: 0.85rem;
      border: 1px solid transparent;
      cursor: pointer;
      background: #f0f0e8;
      color: #1c1c1c;
      transition: background 0.2s, border-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .btn-primary {
      background: #1c1c1c;
      color: #fafaf9;
      border-color: #1c1c1c;
    }
    .btn-primary:hover { background: #2e2e2e; }

    .btn-outline {
      background: transparent;
      border: 1px solid #c4c4b8;
    }
    .btn-outline:hover { background: #f4f4ef; }

    .btn-sm {
      padding: 0.3rem 0.8rem;
      font-size: 0.78rem;
      border-radius: 0.4rem;
    }

    .btn-danger {
      border-color: #d0c8c8;
      color: #4a3030;
      background: #faf5f5;
    }
    .btn-danger:hover { background: #f1e8e8; border-color: #b8a7a7; }

    /* Layout chính: sidebar + notes */
    .main-layout {
      display: flex;
      gap: 1.8rem;
      align-items: flex-start;
    }

    /* Sidebar thư mục */
    .sidebar {
      width: 240px;
      background: #ffffff;
      border: 1px solid #e0e0d8;
      border-radius: 0.8rem;
      padding: 1.2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      flex-shrink: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #2b2b2b;
    }

    .folder-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-height: 380px;
      overflow-y: auto;
    }

    .folder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.7rem;
      border-radius: 0.45rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #3a3a3a;
      transition: background 0.15s;
      border: 1px solid transparent;
      word-break: break-word;
    }

    .folder-item:hover {
      background: #f5f5ee;
    }

    .folder-item.active {
      background: #eaeae0;
      border-color: #c5c5b6;
      font-weight: 600;
      color: #111;
    }

    .folder-badge {
      background: #d9d9ce;
      border-radius: 1rem;
      padding: 0.1rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: #2e2e2e;
      margin-left: 0.4rem;
    }

    .folder-actions {
      display: flex;
      gap: 0.25rem;
      opacity: 0.6;
    }
    .folder-item:hover .folder-actions { opacity: 1; }

    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.15rem 0.3rem;
      border-radius: 0.3rem;
      color: #5a5a5a;
    }
    .icon-btn:hover { background: #e0e0d4; }

    .add-folder-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.3rem;
    }
    .add-folder-row input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 0.4rem;
      padding: 0.45rem 0.7rem;
      font-size: 0.8rem;
      background: #fcfcf9;
    }

    /* Khu vực ghi chú */
    .notes-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-width: 0;
    }

    .current-folder-title {
      font-weight: 600;
      font-size: 1.25rem;
      color: #1f1f1f;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Form ghi chú */
    .note-form {
      background: #ffffff;
      border: 1px solid #e0e0d8;
      border-radius: 0.8rem;
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .note-form input[type="text"],
    .note-form textarea {
      width: 100%;
      border: 1px solid #e2e2d9;
      border-radius: 0.45rem;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 0.9rem;
      background: #fcfcf9;
      outline: none;
      resize: vertical;
    }
    .note-form textarea { min-height: 85px; }
    .note-form input:focus, .note-form textarea:focus { border-color: #b0b0a0; background: #fff; }

    .form-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 1rem;
      background: #f0f0e8;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid #d9d9ce;
    }
    #imageInput { display: none; }
    .img-preview-name { font-size: 0.75rem; color: #5e5e5e; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .note-cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-card {
      background: #ffffff;
      border: 1px solid #e4e4dc;
      border-radius: 0.7rem;
      padding: 1.1rem 1.2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
    }
    .note-card:hover { border-color: #c5c5b6; }

    .note-title { font-weight: 600; font-size: 1.05rem; }
    .note-content { color: #444; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
    .note-image { margin-top: 0.3rem; border-radius: 0.45rem; max-width: 100%; max-height: 220px; object-fit: cover; border: 1px solid #e6e6dd; }
    .note-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #777; margin-top: 0.2rem; flex-wrap: wrap; gap: 0.5rem; }

    .move-select {
      padding: 0.25rem 0.4rem;
      border-radius: 0.3rem;
      border: 1px solid #d5d5ca;
      font-size: 0.75rem;
      background: #fafaf7;
    }

    .empty-message {
      text-align: center;
      padding: 2.5rem;
      color: #8a8a8a;
      background: #fdfdfb;
      border-radius: 0.7rem;
      border: 1px dashed #d5d5cb;
    }

    @media (max-width: 700px) {
      .main-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: unset;
      }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <header class="app-header">
    <h1>📁 Thư mục ghi chú</h1>
    <div class="global-actions">
      <button class="btn btn-outline btn-sm" id="addFolderBtn">➕ Thư mục mới</button>
    </div>
  </header>

  <div class="main-layout">
    <!-- Sidebar thư mục -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Thư mục</h2>
      </div>
      <ul class="folder-list" id="folderList"></ul>
      <div class="add-folder-row" id="folderInputRow" style="display: none;">
        <input type="text" id="newFolderName" placeholder="Tên thư mục..." maxlength="40" />
        <button class="btn btn-sm btn-primary" id="confirmAddFolder">✓</button>
        <button class="btn btn-sm btn-outline" id="cancelAddFolder">✕</button>
      </div>
    </aside>

    <!-- Khu vực ghi chú -->
    <main class="notes-area">
      <div class="current-folder-title" id="currentFolderTitle">📄 Tất cả ghi chú</div>

      <!-- Form thêm/sửa -->
      <div class="note-form">
        <input type="text" id="noteTitle" placeholder="Tiêu đề ghi chú" maxlength="120" />
        <textarea id="noteContent" placeholder="Nội dung..."></textarea>
        <div class="form-row">
          <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
            <label for="imageInput" class="file-label">🖼️ Ảnh</label>
            <input type="file" id="imageInput" accept="image/*" />
            <span class="img-preview-name" id="imgPreviewName"></span>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-outline btn-sm" id="cancelEditBtn" style="display:none;">Huỷ</button>
            <button class="btn btn-primary" id="saveNoteBtn">➕ Thêm</button>
          </div>
        </div>
      </div>

      <div class="note-cards" id="notesContainer"></div>
    </main>
  </div>
</div>

<script>
  (() => {
    // Dữ liệu
    let folders = [
      { id: 'folder_all', name: 'Tất cả', isDefault: true },
      { id: 'folder_1', name: 'Cá nhân' },
      { id: 'folder_2', name: 'Công việc' }
    ];
    let notes = [];
    let currentFolderId = 'folder_all'; // mặc định xem tất cả
    let editingNoteId = null;
    let selectedImageData = null;
    let nextFolderId = 3;

    // Khởi tạo vài ghi chú mẫu
    function seedData() {
      notes.push(
        { id: 1001, folderId: 'folder_1', title: 'Nhật ký', content: 'Hôm nay trời đẹp.', image: null, createdAt: Date.now() - 200000 },
        { id: 1002, folderId: 'folder_2', title: 'Họp dự án', content: 'Chuẩn bị slide.', image: null, createdAt: Date.now() - 100000 },
        { id: 1003, folderId: 'folder_all', title: 'Ghi chú nhanh', content: 'Không phân loại.', image: null, createdAt: Date.now() }
      );
    }
    seedData();

    // DOM
    const folderListEl = document.getElementById('folderList');
    const folderInputRow = document.getElementById('folderInputRow');
    const newFolderNameInput = document.getElementById('newFolderName');
    const addFolderBtn = document.getElementById('addFolderBtn');
    const confirmAddFolder = document.getElementById('confirmAddFolder');
    const cancelAddFolder = document.getElementById('cancelAddFolder');
    const currentFolderTitle = document.getElementById('currentFolderTitle');
    const noteTitle = document.getElementById('noteTitle');
    const noteContent = document.getElementById('noteContent');
    const imageInput = document.getElementById('imageInput');
    const imgPreviewName = document.getElementById('imgPreviewName');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const notesContainer = document.getElementById('notesContainer');

    // ==== FOLDER FUNCTIONS ====
    function renderFolders() {
      folderListEl.innerHTML = folders.map(f => {
        const noteCount = (f.id === 'folder_all') ? notes.length : notes.filter(n => n.folderId === f.id).length;
        const activeClass = (currentFolderId === f.id) ? 'active' : '';
        return `
          <li class="folder-item ${activeClass}" data-folder-id="${f.id}">
            <span style="flex:1;" class="folder-name-click">${f.isDefault ? '📁' : '📂'} ${escapeHtml(f.name)} <span class="folder-badge">${noteCount}</span></span>
            ${!f.isDefault ? `<span class="folder-actions">
              <button class="icon-btn edit-folder-btn" data-id="${f.id}">✎</button>
              <button class="icon-btn delete-folder-btn" data-id="${f.id}">🗑</button>
            </span>` : ''}
          </li>
        `;
      }).join('');

      // Gắn sự kiện click chọn thư mục
      document.querySelectorAll('.folder-name-click').forEach(el => {
        el.addEventListener('click', (e) => {
          const li = el.closest('.folder-item');
          if (li) {
            const id = li.dataset.folderId;
            selectFolder(id);
          }
        });
      });

      // Sửa tên thư mục
      document.querySelectorAll('.edit-folder-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const folder = folders.find(f => f.id === id);
          if (!folder) return;
          const newName = prompt('Tên mới cho thư mục:', folder.name);
          if (newName && newName.trim() !== '') {
            folder.name = newName.trim();
            renderFolders();
            updateCurrentFolderTitle();
          }
        });
      });

      // Xoá thư mục
      document.querySelectorAll('.delete-folder-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm('Xoá thư mục? Các ghi chú sẽ chuyển về "Tất cả".')) {
            // Chuyển ghi chú về folder_all
            notes.forEach(n => { if (n.folderId === id) n.folderId = 'folder_all'; });
            folders = folders.filter(f => f.id !== id);
            if (currentFolderId === id) selectFolder('folder_all');
            renderFolders();
            renderNotes();
            updateCurrentFolderTitle();
          }
        });
      });
    }

    function selectFolder(id) {
      currentFolderId = id;
      if (editingNoteId) exitEditMode();
      renderFolders();
      renderNotes();
      updateCurrentFolderTitle();
    }

    function updateCurrentFolderTitle() {
      const folder = folders.find(f => f.id === currentFolderId);
      currentFolderTitle.textContent = folder ? `📄 ${folder.name}` : '📄 Ghi chú';
    }

    function showFolderInput() {
      folderInputRow.style.display = 'flex';
      newFolderNameInput.value = '';
      newFolderNameInput.focus();
    }
    function hideFolderInput() {
      folderInputRow.style.display = 'none';
    }

    addFolderBtn.addEventListener('click', showFolderInput);
    cancelAddFolder.addEventListener('click', hideFolderInput);
    confirmAddFolder.addEventListener('click', () => {
      const name = newFolderNameInput.value.trim();
      if (!name) return;
      folders.push({ id: `folder_${nextFolderId++}`, name });
      hideFolderInput();
      renderFolders();
    });

    // ==== NOTE FUNCTIONS ====
    function getCurrentNotes() {
      if (currentFolderId === 'folder_all') return notes;
      return notes.filter(n => n.folderId === currentFolderId);
    }

    function renderNotes() {
      const currentNotes = getCurrentNotes();
      if (currentNotes.length === 0) {
        notesContainer.innerHTML = `<div class="empty-message">Chưa có ghi chú trong thư mục này.</div>`;
        return;
      }
      notesContainer.innerHTML = currentNotes.map(note => {
        const folder = folders.find(f => f.id === note.folderId);
        const folderName = folder ? folder.name : 'Tất cả';
        return `
          <div class="note-card" data-note-id="${note.id}">
            <div class="note-title">${escapeHtml(note.title || 'Không tiêu đề')}</div>
            ${note.content ? `<div class="note-content">${escapeHtml(note.content)}</div>` : ''}
            ${note.image ? `<img src="${note.image}" class="note-image" alt="ảnh" loading="lazy"/>` : ''}
            <div class="note-meta">
              <span>📁 ${escapeHtml(folderName)} · ${new Date(note.createdAt).toLocaleDateString('vi-VN')}</span>
              <div style="display:flex; gap:0.4rem; align-items:center;">
                <select class="move-select" data-note-id="${note.id}">
                  <option value="">Di chuyển...</option>
                  ${folders.map(f => `<option value="${f.id}" ${note.folderId === f.id ? 'selected disabled' : ''}>${escapeHtml(f.name)}</option>`).join('')}
                </select>
                <button class="btn btn-sm btn-outline edit-note-btn" data-id="${note.id}">✎</button>
                <button class="btn btn-sm btn-danger delete-note-btn" data-id="${note.id}">🗑</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Gắn sự kiện
      document.querySelectorAll('.edit-note-btn').forEach(b => b.addEventListener('click', (e) => startEdit(Number(b.dataset.id))));
      document.querySelectorAll('.delete-note-btn').forEach(b => b.addEventListener('click', (e) => {
        if (confirm('Xoá ghi chú?')) deleteNote(Number(b.dataset.id));
      }));
      document.querySelectorAll('.move-select').forEach(sel => {
        sel.addEventListener('change', function() {
          const noteId = Number(this.dataset.noteId);
          const newFolder = this.value;
          if (!newFolder) return;
          moveNoteToFolder(noteId, newFolder);
        });
      });
    }

    function moveNoteToFolder(noteId, folderId) {
      const note = notes.find(n => n.id === noteId);
      if (note) {
        note.folderId = folderId;
        renderFolders();
        renderNotes();
        updateCurrentFolderTitle();
      }
    }

    function deleteNote(id) {
      if (editingNoteId === id) exitEditMode();
      notes = notes.filter(n => n.id !== id);
      renderFolders();
      renderNotes();
    }

    function startEdit(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      if (editingNoteId && editingNoteId !== id) exitEditMode();
      editingNoteId = id;
      noteTitle.value = note.title || '';
      noteContent.value = note.content || '';
      selectedImageData = null;
      imageInput.value = '';
      imgPreviewName.textContent = note.image ? '(có ảnh, chọn mới để thay)' : '';
      saveNoteBtn.textContent = '✏️ Cập nhật';
      cancelEditBtn.style.display = 'inline-flex';
    }

    function exitEditMode() {
      editingNoteId = null;
      noteTitle.value = '';
      noteContent.value = '';
      imageInput.value = '';
      selectedImageData = null;
      imgPreviewName.textContent = '';
      saveNoteBtn.textContent = '➕ Thêm';
      cancelEditBtn.style.display = 'none';
    }

    function saveNote() {
      const title = noteTitle.value.trim();
      const content = noteContent.value.trim();
      if (!title && !content && !selectedImageData && !editingNoteId) {
        alert('Nhập nội dung hoặc chọn ảnh.');
        return;
      }

      if (editingNoteId) {
        const note = notes.find(n => n.id === editingNoteId);
        if (note) {
          note.title = title || 'Không tiêu đề';
          note.content = content;
          if (selectedImageData !== null) note.image = selectedImageData;
        }
        exitEditMode();
      } else {
        notes.unshift({
          id: Date.now(),
          folderId: currentFolderId,
          title: title || 'Không tiêu đề',
          content: content,
          image: selectedImageData || null,
          createdAt: Date.now()
        });
        clearFormOnly();
      }
      renderFolders();
      renderNotes();
    }

    function clearFormOnly() {
      noteTitle.value = '';
      noteContent.value = '';
      imageInput.value = '';
      selectedImageData = null;
      imgPreviewName.textContent = '';
    }

    // Ảnh
    imageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) { selectedImageData = null; imgPreviewName.textContent = ''; return; }
      if (file.size > 5 * 1024 * 1024) { alert('Ản
